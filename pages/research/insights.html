                    const w = el.offsetWidth || el.parentElement?.offsetWidth || 700;
                    ci.instance.updateOptions({ chart: { width: w } }, false, false);
                }
            });
            hiddenPanels.forEach(p => { p.style.display = ''; });
        }

        window.addEventListener('beforeprint', () => {
            // Force-render any still-zero-width charts
            forceRenderHiddenCharts();
            // Expand all collapsed summary cards
            document.querySelectorAll('.ins-summary-card.collapsed, .ins-overview-section.collapsed').forEach(el => {
                el.classList.remove('collapsed');
                el.dataset.printExpanded = '1';
            });

            // ── Pass 1: Force solid fills via inline style !important ──
            // Chrome print engine strips rgba() from SVG fill attributes.
            // Using inline style with !important ensures Chrome cannot strip them.
            document.querySelectorAll('.apexcharts-canvas svg').forEach(svg => {
                svg.querySelectorAll('*').forEach(el => {
                    const fill = el.getAttribute('fill');
                    if (fill && fill.includes('rgba(')) {
                        const rgb = rgbaToRgb(fill);
                        if (rgb) {
                            el.dataset.origFill = fill;
                            el.dataset.origInlineStyle = el.getAttribute('style') || '';
                            el.setAttribute('fill', rgb);
                            // Also set via inline style with !important as belt-and-suspenders
                            const existing = el.getAttribute('style') || '';
                            el.setAttribute('style', existing + `; fill: ${rgb} !important;`);
                        }
                    }
                    const stroke = el.getAttribute('stroke');
                    if (stroke && stroke.includes('rgba(')) {
                        const rgb = rgbaToRgb(stroke);
                        if (rgb) {
                            el.dataset.origStroke = stroke;
                            el.setAttribute('stroke', rgb);
                        }
                    }
                });
            });

            // ── Pass 2: Add viewBox + scale large SVGs for A4 fit ──
            document.querySelectorAll('.apexcharts-canvas').forEach(canvas => {
                const svg = canvas.querySelector('svg');
                if (!svg) return;
                const w = parseFloat(svg.getAttribute('width'));
                const h = parseFloat(svg.getAttribute('height'));
                if (!w || !h) return;
                // Skip small charts (KPI radial gauges ≤300px) — they fit fine
                if (w <= 300) return;
                const area = canvas.closest('.ins-chart-area');
                saved.push({
                    canvas, svg,
                    cW: canvas.style.width,
                    cH: canvas.style.height,
                    sW: svg.getAttribute('width'),
                    sH: svg.getAttribute('height'),
                    vb: svg.getAttribute('viewBox'),
                    par: svg.getAttribute('preserveAspectRatio'),
                    area,
                    areaH: area?.style.minHeight
                });
                svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
                svg.setAttribute('preserveAspectRatio', 'xMidYMin meet');
                svg.removeAttribute('width');
                svg.removeAttribute('height');
                svg.style.width = '100%';
                svg.style.height = 'auto';
                canvas.style.width = '100%';
                canvas.style.height = 'auto';
                if (area) area.style.minHeight = '0';
                // Boost text sizes to compensate for SVG scaling
                svg.querySelectorAll('.apexcharts-datalabel, .apexcharts-data-labels text').forEach(t => {
                    t.dataset.origSize = t.getAttribute('font-size') || '';
                    const cur = parseFloat(t.getAttribute('font-size') || t.style.fontSize || 11);
                    t.setAttribute('font-size', Math.round(cur * 1.3));
                });
                svg.querySelectorAll('.apexcharts-xaxis-label, .apexcharts-yaxis-label').forEach(t => {
                    t.dataset.origSize = t.getAttribute('font-size') || '';
                    const cur = parseFloat(t.getAttribute('font-size') || t.style.fontSize || 11);
                    t.setAttribute('font-size', Math.round(cur * 1.2));
                });
                svg.querySelectorAll('.apexcharts-legend-text').forEach(t => {
                    t.dataset.origSize = t.style.fontSize || '';
                    const cur = parseFloat(t.style.fontSize || 12);
                    t.style.fontSize = Math.round(cur * 1.2) + 'px';
                });
            });
        });
        window.addEventListener('afterprint', () => {
            document.querySelectorAll('[data-print-expanded]').forEach(el => {
                el.classList.add('collapsed');
                delete el.dataset.printExpanded;
            });
            // Restore rgba fills/strokes/styles on ALL SVGs
            document.querySelectorAll('.apexcharts-canvas svg').forEach(svg => {
                svg.querySelectorAll('[data-orig-fill]').forEach(el => {
                    el.setAttribute('fill', el.dataset.origFill);
                    // Restore original inline style (removes the !important fill we added)
                    const origStyle = el.dataset.origInlineStyle;
                    if (origStyle !== undefined) {
                        if (origStyle) el.setAttribute('style', origStyle);
                        else el.removeAttribute('style');
                        delete el.dataset.origInlineStyle;
                    }
                    delete el.dataset.origFill;
                });
                svg.querySelectorAll('[data-orig-stroke]').forEach(el => {
                    el.setAttribute('stroke', el.dataset.origStroke);
                    delete el.dataset.origStroke;
                });
                svg.querySelectorAll('[data-orig-style]').forEach(el => {
                    el.setAttribute('style', el.dataset.origStyle);
                    delete el.dataset.origStyle;
                });
            });
            saved.forEach(({ canvas, svg, cW, cH, sW, sH, vb, par, area, areaH }) => {
                canvas.style.width = cW;
                canvas.style.height = cH;
                if (sW) svg.setAttribute('width', sW); else svg.removeAttribute('width');
                if (sH) svg.setAttribute('height', sH); else svg.removeAttribute('height');
                if (vb) svg.setAttribute('viewBox', vb); else svg.removeAttribute('viewBox');
                if (par) svg.setAttribute('preserveAspectRatio', par); else svg.removeAttribute('preserveAspectRatio');
                svg.style.width = '';
                svg.style.height = '';
                if (area) area.style.minHeight = areaH || '';
                // Restore text sizes
                svg.querySelectorAll('[data-orig-size]').forEach(t => {
                    const orig = t.dataset.origSize;
                    if (orig) t.setAttribute('font-size', orig); else t.removeAttribute('font-size');
                    delete t.dataset.origSize;
                });
                svg.querySelectorAll('.apexcharts-legend-text[data-orig-size]').forEach(t => {
                    t.style.fontSize = t.dataset.origSize || '';
                    delete t.dataset.origSize;
                });
            });
            saved.length = 0;
        });
    })();
    </script>
</body>
</html>
