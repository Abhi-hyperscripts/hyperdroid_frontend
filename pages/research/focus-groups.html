<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/js/cookie-consent.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=2">
    <title>Focus Groups - Ragenaizer</title>
    <script>window.CACHE_VERSION = Date.now();</script>
    <script>document.write('<script src="../../js/sw-version.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script src="/js/sw-update.js"></script>
    <script src="/js/pwa-install-prompt.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script>document.write('<link rel="stylesheet" href="../../css/theme.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/styles.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/research.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/glassmorphic-modal.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<script src="../../js/theme.js?v=' + CACHE_VERSION + '"><\/script>');</script>
</head>
<body class="dashboard research-page">
    <script>document.write('<script src="/js/button-spinner.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <nav class="navbar">
        <div class="navbar-brand">
            <a href="../home.html"><img src="../../assets/brand_logo.png" alt="Logo" class="navbar-logo"></a>
        </div>
        <div class="navbar-menu"></div>
    </nav>

    <div class="research-container">
        <!-- Page Header -->
        <div class="research-header">
            <div>
                <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 4px;">
                    <a href="dashboard.html" style="color: var(--text-secondary); text-decoration: none; font-size: 14px;">Research</a>
                    <span style="color: var(--text-secondary); font-size: 14px;">/</span>
                    <h1 style="margin: 0;">Focus Groups</h1>
                </div>
                <p>Speaker diarization and transcription from audio recordings</p>
            </div>
            <button class="research-btn btn-primary" onclick="showModal('createProjectModal')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                New Project
            </button>
        </div>

        <!-- Search -->
        <div style="margin-bottom: 16px;">
            <div style="position:relative; max-width:400px;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="2" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); pointer-events:none;">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" id="projectSearch" placeholder="Search projects..." oninput="handleProjectSearch()" style="width:100%; padding:10px 12px 10px 38px; border:1px solid var(--border-primary); border-radius:8px; background:var(--bg-secondary); color:var(--text-primary); font-size:14px; outline:none;" onfocus="this.style.borderColor='var(--border-focus)'" onblur="this.style.borderColor='var(--border-primary)'">
            </div>
        </div>

        <!-- Projects Grid -->
        <div id="projectsGrid">
            <div class="research-loading"><div class="spinner"></div><p>Loading projects...</p></div>
        </div>

        <!-- Pagination -->
        <div id="paginationContainer" style="display:none; justify-content:center; gap:8px; padding:16px 0;"></div>
    </div>

    <!-- Create Project Modal -->
    <div id="createProjectModal" class="gm-overlay" onclick="if(event.target===this)closeModal('createProjectModal')">
        <div class="gm-modal">
            <div class="gm-header">
                <div class="gm-header-left">
                    <div class="gm-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                    </div>
                    <div class="gm-title">New Focus Group Project</div>
                </div>
                <button class="gm-close" onclick="closeModal('createProjectModal')">&times;</button>
            </div>
            <form id="createProjectForm">
                <div class="gm-body">
                    <div class="research-form-group">
                        <label for="projectName">Project Name <span class="required">*</span></label>
                        <input type="text" id="projectName" placeholder="e.g., Customer Feedback Focus Group" required>
                    </div>
                    <div class="research-form-group">
                        <label for="projectDescription">Description</label>
                        <textarea id="projectDescription" rows="3" placeholder="Brief description of the focus group study..."></textarea>
                    </div>
                </div>
                <div class="gm-footer" style="display:flex; justify-content:flex-end; gap:8px;">
                    <button type="button" class="gm-btn gm-btn-secondary" onclick="closeModal('createProjectModal')">Cancel</button>
                    <button type="submit" class="gm-btn gm-btn-primary" id="createProjectBtn">Create Project</button>
                </div>
            </form>
        </div>
    </div>

    <script>document.write('<script src="../../js/config.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script>document.write('<script src="../../js/api.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script>document.write('<script src="../../js/navigation.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script>document.write('<script src="../../js/toast.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script>document.write('<script src="../../js/research/focus-groups.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof Navigation !== 'undefined') Navigation.init('research', '../');
        });
    </script>
    <!-- AI Copilot Widget -->
    <script>document.write('<script src="../../embed/widget.js?v=' + CACHE_VERSION + '" data-mode="copilot" data-service="research" data-title="Research Assistant"><\/script>');</script>
</body>
</html>
