    <style>
        /* ═══════════════════════════════════════════════════════════════
           FGD REPORT DASHBOARD SHELL
           Inspired by insights.html — collapsible sidebar + tab-swap main.
           ═══════════════════════════════════════════════════════════════ */

        html, body { margin: 0; padding: 0; height: 100%; }
        body.dashboard.research-page { overflow: hidden; }

        .dash-shell {
            display: grid;
            grid-template-columns: 260px 1fr;
            height: 100vh;
            background: var(--bg-primary);
            transition: grid-template-columns 0.25s ease;
        }
        .dash-shell.collapsed { grid-template-columns: 0 1fr; }
        .dash-shell.collapsed .dash-sidebar { transform: translateX(-100%); opacity: 0; pointer-events: none; }

        /* ── Sidebar ───────────────────────────────────────────────── */
        .dash-sidebar {
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-primary);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
            transition: transform 0.25s ease, opacity 0.2s ease;
        }
        .dash-sidebar-header {
            padding: 18px 18px 14px;
            border-bottom: 1px solid var(--border-primary);
        }
        .dash-back {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 11px; color: var(--text-secondary);
            text-decoration: none; text-transform: uppercase; letter-spacing: 0.6px;
            margin-bottom: 8px;
        }
        .dash-back:hover { color: var(--text-primary); }
        .dash-project {
            font-size: 17px; font-weight: 700; color: var(--text-primary);
            line-height: 1.25; word-break: break-word;
        }
        .dash-meta {
            font-size: 11px; color: var(--text-secondary);
            margin-top: 6px; line-height: 1.5;
        }

        .dash-nav {
            flex: 1; padding: 10px 10px 20px;
            display: flex; flex-direction: column; gap: 2px;
        }
        .dash-nav-item {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 12px;
            border-radius: 8px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-secondary);
            font-size: 13px; font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            text-align: left;
            font-family: inherit;
        }
        .dash-nav-item:hover {
            background: rgba(var(--brand-primary-rgb), 0.06);
            color: var(--text-primary);
        }
        .dash-nav-item.active {
            background: rgba(var(--brand-primary-rgb), 0.12);
            border-color: rgba(var(--brand-primary-rgb), 0.35);
            color: var(--brand-primary);
            font-weight: 600;
        }
        .dash-nav-num {
            width: 22px; height: 22px; flex-shrink: 0;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 6px;
            background: rgba(var(--brand-primary-rgb), 0.12);
            color: var(--brand-primary);
            font-size: 11px; font-weight: 700;
            font-variant-numeric: tabular-nums;
        }
        .dash-nav-item.active .dash-nav-num {
            background: var(--brand-primary);
            color: var(--text-inverse);
        }
        .dash-nav-label { flex: 1; min-width: 0; }

        .dash-sidebar-footer {
            padding: 14px 18px;
            border-top: 1px solid var(--border-primary);
            font-size: 11px; color: var(--text-secondary);
        }

        /* ── Main ──────────────────────────────────────────────────── */
        .dash-main {
            display: flex; flex-direction: column;
            min-width: 0; overflow: hidden;
        }
        .dash-topbar {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            padding: 14px 28px;
            border-bottom: 1px solid var(--border-primary);
            background: var(--bg-primary);
            flex-shrink: 0;
        }
        .dash-topbar-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
        .dash-hamburger {
            display: inline-flex; align-items: center; justify-content: center;
            width: 36px; height: 36px;
            border-radius: 8px;
            border: 1px solid var(--border-primary);
            background: var(--bg-secondary);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.15s;
            flex-shrink: 0;
        }
        .dash-hamburger:hover { border-color: var(--brand-primary); color: var(--brand-primary); }
        .dash-topbar-titles { display: flex; flex-direction: column; min-width: 0; }
        .dash-section-title {
            font-size: 18px; font-weight: 700; color: var(--text-primary);
            line-height: 1.2;
        }
        .dash-section-sub {
            font-size: 12px; color: var(--text-secondary);
        }
        .dash-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .dash-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 7px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-primary);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 13px; font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }
        .dash-btn:hover {
            border-color: var(--brand-primary);
            color: var(--brand-primary);
        }
        .dash-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .dash-btn.primary {
            background: var(--brand-primary);
            color: var(--text-inverse);
            border-color: var(--brand-primary);
        }
        .dash-btn.primary:hover { background: var(--brand-primary-hover); color: var(--text-inverse); }
        .dash-btn-icon { padding: 7px 9px; }
        .dash-btn-icon svg { display: block; }
        /* Show the moon in dark mode (to switch → light), sun in light mode (to switch → dark) */
        .dash-btn-icon .dash-theme-icon-sun { display: block; }
        .dash-btn-icon .dash-theme-icon-moon { display: none; }
        [data-theme="dark"] .dash-btn-icon .dash-theme-icon-sun { display: none; }
        [data-theme="dark"] .dash-btn-icon .dash-theme-icon-moon { display: block; }

        .dash-content {
            flex: 1;
            overflow-y: auto;
            padding: 32px 40px 100px;
        }
        .dash-section {
            display: none;
            width: 100%;
            max-width: none;
        }
        .dash-section.active { display: block; }
        /* Guarantee visible vertical gap between ALL stacked section children —
           works even when descendants forget margins (quote-card, chart-card, custom divs). */
        .dash-section > * + * { margin-top: 24px; }
        .dash-card > * + *  { margin-top: 14px; }
        .dash-card > .dash-card-header + * { margin-top: 16px; }

        /* ── Glassy bento cards (matches insights dashboard feel) ──
           Strong inset glow + 135° gradient + saturated blur. Light +
           dark both driven by CSS vars; no hard-coded chrome hex. */
        .dash-card {
            position: relative;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.04) 40%, transparent 100%),
                var(--bg-card, var(--bg-secondary));
            backdrop-filter: blur(20px) saturate(1.35);
            -webkit-backdrop-filter: blur(20px) saturate(1.35);
            border: 1px solid var(--border-primary);
            border-radius: 16px;
            padding: 24px 28px;
            margin-bottom: 24px;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.5),
                0 4px 18px rgba(0, 0, 0, 0.06);
        }
        [data-theme="dark"] .dash-card {
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 40%, transparent 100%),
                rgba(15, 23, 42, 0.55);
            border-color: rgba(var(--brand-primary-rgb), 0.2);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 4px 24px rgba(0, 0, 0, 0.28);
        }
        .dash-card-header {
            display: flex; align-items: baseline; justify-content: space-between;
            margin-bottom: 18px; gap: 12px; flex-wrap: wrap;
        }
        .dash-card-title { font-size: 15px; font-weight: 600; color: var(--text-primary); letter-spacing: 0.1px; }
        .dash-card-sub { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.6px; }

        /* ── KPI tiles — proper glassy bento, generous spacing ─── */
        .kpi-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 20px; margin-bottom: 24px;
        }
        .kpi {
            position: relative;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.24) 0%, rgba(255, 255, 255, 0.04) 45%, transparent 100%),
                var(--bg-card, var(--bg-secondary));
            backdrop-filter: blur(20px) saturate(1.35);
            -webkit-backdrop-filter: blur(20px) saturate(1.35);
            border: 1px solid var(--border-primary);
            border-radius: 16px;
            padding: 22px 24px;
            min-height: 120px;
            display: flex; flex-direction: column;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.5),
                0 4px 18px rgba(0, 0, 0, 0.05);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .kpi:hover {
            transform: translateY(-1px);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.55),
                0 8px 24px rgba(0, 0, 0, 0.08);
        }
        [data-theme="dark"] .kpi {
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 45%, transparent 100%),
                rgba(15, 23, 42, 0.5);
            border-color: rgba(var(--brand-primary-rgb), 0.18);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 4px 24px rgba(0, 0, 0, 0.28);
        }
        [data-theme="dark"] .kpi:hover {
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .kpi-val { font-size: 34px; font-weight: 700; color: var(--text-primary); font-variant-numeric: tabular-nums; line-height: 1.05; }
        .kpi-sub { font-size: 12px; color: var(--text-secondary); margin-top: 8px; font-variant-numeric: tabular-nums; }
        .kpi-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-secondary); margin-bottom: 10px; font-weight: 700; }
        /* Semantic value-tinting for KPIs (Dominant sentiment etc). */
        .kpi.success .kpi-val { color: var(--color-success); }
        .kpi.warning .kpi-val { color: var(--color-warning); }
        .kpi.error   .kpi-val { color: var(--color-error);   }

        /* Two-column layout for wider content areas */
        .dash-two-col {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 24px;
            align-items: start;
        }
        @media (max-width: 1100px) { .dash-two-col { grid-template-columns: 1fr; } }

        /* ── Exec bullets — roomier per-line ──────────────────── */
        ul.exec-bullets { margin: 0; padding-left: 0; list-style: none; }
        ul.exec-bullets li {
            padding: 14px 0 14px 26px;
            position: relative;
            border-bottom: 1px solid var(--border-primary);
            font-size: 14px; line-height: 1.6; color: var(--text-primary);
        }
        ul.exec-bullets li:last-child { border-bottom: none; }
        ul.exec-bullets li::before {
            content: ""; position: absolute;
            left: 4px; top: 21px;
            width: 9px; height: 9px; border-radius: 50%;
            background: var(--brand-primary);
            box-shadow: 0 0 0 3px rgba(var(--brand-primary-rgb), 0.18);
        }
        ul.exec-bullets li .bullet-themes { display: inline-flex; flex-wrap: wrap; gap: 5px; margin-left: 8px; vertical-align: middle; }

        /* ── Pull quote — compact, dashboard-style ─────────────── */
        .pull-quote {
            border-left: 3px solid var(--brand-primary);
            padding: 10px 14px;
            background: rgba(var(--brand-primary-rgb), 0.06);
            border-radius: 0 6px 6px 0;
            font-style: italic; font-size: 14px; line-height: 1.45;
            color: var(--text-primary);
        }
        .pull-quote-attr { font-style: normal; font-size: 11px; color: var(--text-secondary); margin-top: 6px; display: block; }

        /* ── Badges ────────────────────────────────────────────────── */
        .badge {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 11px; font-weight: 600;
            padding: 3px 9px; border-radius: 14px;
            background: rgba(var(--brand-primary-rgb), 0.12);
            color: var(--brand-primary);
            letter-spacing: 0.3px;
            text-decoration: none;
        }
        .badge.neutral { background: var(--bg-tertiary); color: var(--text-secondary); }
        .badge.pos { background: rgba(16,185,129,0.15); color: var(--color-success); }
        .badge.neg { background: rgba(239,68,68,0.15); color: var(--color-error); }
        .badge.split { background: rgba(245,158,11,0.15); color: var(--color-warning); }
        .badge.universal { background: rgba(16,185,129,0.15); color: var(--color-success); }
        .badge.majority { background: rgba(99,102,241,0.15); color: var(--brand-primary); }
        .badge.minority { background: var(--bg-tertiary); color: var(--text-secondary); }
        .badge-row { display: flex; flex-wrap: wrap; gap: 8px; }

        /* ── Chart bento cards — clear margin + glassy ───────── */
        .chart-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px; }
        .chart-card {
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.02) 45%, transparent 100%),
                var(--bg-card, var(--bg-secondary));
            backdrop-filter: blur(20px) saturate(1.3);
            -webkit-backdrop-filter: blur(20px) saturate(1.3);
            border: 1px solid var(--border-primary);
            border-radius: 16px;
            padding: 22px 26px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 4px 18px rgba(0, 0, 0, 0.05);
            min-width: 0; /* allow grid children to shrink */
        }
        [data-theme="dark"] .chart-card {
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.01) 45%, transparent 100%),
                rgba(15, 23, 42, 0.55);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 4px 18px rgba(0, 0, 0, 0.25);
        }
        .chart-card.span-7  { grid-column: span 7; }
        .chart-card.span-5  { grid-column: span 5; }
        .chart-card.span-12 { grid-column: 1 / -1; }
        @media (max-width: 1100px) {
            .chart-card.span-7, .chart-card.span-5 { grid-column: 1 / -1; }
        }
        .chart-card-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-secondary); margin-bottom: 14px; font-weight: 700; }
        .chart-host { min-height: 220px; }
        .chart-host-tall { min-height: 300px; }
        .chart-host-sm { min-height: 240px; }
        .apexcharts-legend-text, .apexcharts-text, .apexcharts-xaxis text, .apexcharts-yaxis text, .apexcharts-datalabel {
            fill: var(--text-primary) !important;
            color: var(--text-primary) !important;
        }

        /* ── Theme list — bento container with tight row density ─ */
        .theme-list {
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, transparent 60%),
                var(--bg-secondary);
            border: 1px solid var(--border-primary);
            border-radius: 14px;
            overflow: hidden;
        }
        [data-theme="dark"] .theme-list {
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, transparent 60%),
                rgba(15, 23, 42, 0.45);
        }
        .theme-accordion {
            border-bottom: 1px solid var(--border-primary);
        }
        .theme-accordion:last-child { border-bottom: none; }
        .theme-accordion-header {
            display: grid;
            grid-template-columns: 36px minmax(0, 1.8fr) 1fr 120px 20px;
            align-items: center; gap: 14px;
            padding: 10px 14px;
            cursor: pointer;
            user-select: none;
            transition: background 0.1s;
        }
        .theme-accordion-header:hover { background: rgba(var(--brand-primary-rgb), 0.06); }
        .theme-accordion-rank {
            width: 28px; height: 28px;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 6px;
            background: rgba(var(--brand-primary-rgb), 0.12);
            color: var(--brand-primary);
            font-size: 12px; font-weight: 700;
            font-variant-numeric: tabular-nums;
        }
        .theme-accordion-title { min-width: 0; }
        .theme-accordion-name { font-size: 13px; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .theme-accordion-meta { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
        .theme-accordion-bar {
            display: flex; align-items: center; gap: 6px;
            font-size: 11px; color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
        }
        .theme-prev-bar {
            flex: 1; height: 4px; background: var(--bg-tertiary); border-radius: 2px; overflow: hidden;
        }
        .theme-prev-bar > span {
            display: block; height: 100%;
            background: var(--brand-primary);
            border-radius: 2px;
        }
        .theme-accordion-sentiment {
            display: flex; height: 5px; border-radius: 2px; overflow: hidden; background: var(--bg-tertiary);
            min-width: 100px;
        }
        .theme-accordion-sentiment > span { display: block; }
        .theme-accordion-arrow {
            font-size: 10px; color: var(--text-secondary);
            transition: transform 0.2s;
            text-align: center;
        }
        .theme-accordion.open .theme-accordion-arrow { transform: rotate(90deg); }
        .theme-accordion-body {
            display: none;
            padding: 6px 20px 20px 64px;
            background: var(--bg-primary);
            border-top: 1px solid var(--border-primary);
        }
        [data-theme="dark"] .theme-accordion-body { background: rgba(15, 23, 42, 0.3); }
        .theme-accordion.open .theme-accordion-body { display: block; }

        /* ── Section-specific utilities ────────────────────────────── */
        .slide-body { font-size: 14px; color: var(--text-primary); line-height: 1.55; }
        .prev-line { font-size: 12px; color: var(--text-secondary); }
        .tensions-hdr { font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 600; }
        .sentiment-bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--bg-secondary); margin-top: 10px; }
        .sentiment-bar > span { display: block; }
        .sentiment-bar .pos { background: var(--color-success); }
        .sentiment-bar .neg { background: var(--color-error); }
        .sentiment-bar .neu { background: var(--text-secondary); opacity: 0.4; }
        .sentiment-bar .mix { background: var(--color-warning); }
        .sentiment-legend { font-size: 11px; color: var(--text-secondary); margin-top: 4px; display: flex; gap: 12px; flex-wrap: wrap; }

        /* Quote cards — glassy mini-bento */
        .quote-card {
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.02) 50%, transparent 100%),
                var(--bg-card, var(--bg-secondary));
            backdrop-filter: blur(14px) saturate(1.2);
            -webkit-backdrop-filter: blur(14px) saturate(1.2);
            border: 1px solid var(--border-primary);
            border-radius: 14px;
            padding: 18px 20px;
            margin-bottom: 14px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 2px 10px rgba(0, 0, 0, 0.04);
            display: flex; flex-direction: column; gap: 12px;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
            position: relative;
        }
        .quote-card:last-child { margin-bottom: 0; }
        .gallery-grid .quote-card { margin-bottom: 0; }
        .quote-card:hover {
            transform: translateY(-2px);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 8px 22px rgba(0, 0, 0, 0.08);
            border-color: rgba(var(--brand-primary-rgb, 59, 130, 246), 0.35);
        }
        [data-theme="dark"] .quote-card {
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 50%, transparent 100%),
                rgba(15, 23, 42, 0.5);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 2px 10px rgba(0, 0, 0, 0.2);
        }
        .quote-card::before {
            content: '"';
            position: absolute; top: 6px; left: 14px;
            font-family: Georgia, serif;
            font-size: 42px; line-height: 1;
            color: var(--brand-primary);
            opacity: 0.28;
        }
        .quote-card .qtext {
            font-size: 14px; line-height: 1.6; color: var(--text-primary);
            padding-left: 22px;
            font-style: italic;
        }
        .quote-card .qmeta {
            font-size: 11px; color: var(--text-secondary);
            display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
            padding-top: 10px;
            border-top: 1px dashed var(--border-primary);
        }
        .quote-card .qspeaker {
            font-weight: 700; color: var(--text-primary);
            font-size: 12px;
        }
        .quote-card .qtime { font-variant-numeric: tabular-nums; }
        .quote-card .qsentiment {
            text-transform: capitalize; font-weight: 600;
            padding: 2px 8px; border-radius: 999px; font-size: 10px;
        }
        .quote-card .qsentiment.positive { background: rgba(16, 185, 129, 0.15); color: var(--color-success); }
        .quote-card .qsentiment.negative { background: rgba(239, 68, 68, 0.15); color: var(--color-error); }
        .quote-card .qsentiment.neutral  { background: rgba(100, 116, 139, 0.18); color: var(--text-secondary); }
        .quote-card .qsentiment.mixed    { background: rgba(245, 158, 11, 0.18); color: var(--color-warning); }
        .quote-card.warn { border: 1px solid rgba(245, 158, 11, 0.35); }

        .gallery-filters {
            display: grid;
            grid-template-columns: minmax(200px, 1fr) minmax(200px, 1fr) minmax(220px, 2fr) auto;
            gap: 14px; align-items: center;
            margin-bottom: 20px; padding: 16px 18px;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, transparent 60%),
                var(--bg-card, var(--bg-secondary));
            border-radius: 14px;
            border: 1px solid var(--border-primary);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }
        [data-theme="dark"] .gallery-filters {
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.04) 0%, transparent 60%),
                rgba(15, 23, 42, 0.5);
        }
        .gallery-filters input[type="search"] {
            background: var(--bg-secondary); color: var(--text-primary);
            border: 1px solid var(--border-primary); border-radius: 8px;
            padding: 10px 14px; font-size: 13px;
            font-family: inherit;
            width: 100%;
            height: 40px;
        }
        .gallery-filters input[type="search"]:focus {
            outline: none;
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 3px rgba(var(--brand-primary-rgb, 59, 130, 246), 0.12);
        }
        .gallery-filters .prev-line {
            font-size: 12px; color: var(--text-secondary);
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
            padding: 0 8px;
        }
        @media (max-width: 900px) {
            .gallery-filters { grid-template-columns: 1fr 1fr; }
            .gallery-filters > input, .gallery-filters > .searchable-dropdown-container { grid-column: span 2; }
        }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }

        .codeframe-tree { font-size: 13px; line-height: 1.6; color: var(--text-primary); display: flex; flex-direction: column; gap: 16px; }
        .codeframe-tree .cf-theme {
            padding: 16px 18px;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, transparent 55%),
                var(--bg-secondary);
            border: 1px solid var(--border-primary);
            border-radius: 12px;
        }
        [data-theme="dark"] .codeframe-tree .cf-theme {
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.04) 0%, transparent 55%),
                rgba(15, 23, 42, 0.45);
        }
        .codeframe-tree .cf-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
        .codeframe-tree .cf-id {
            font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
            font-size: 11px; color: var(--brand-primary); font-weight: 700;
            padding: 3px 8px; border-radius: 6px;
            background: rgba(var(--brand-primary-rgb), 0.12);
        }
        .codeframe-tree .cf-name { font-weight: 600; font-size: 14px; color: var(--text-primary); }
        .codeframe-tree .cf-def { color: var(--text-secondary); font-size: 12px; line-height: 1.55; margin-bottom: 12px; }
        .codeframe-tree .cf-codes-label {
            font-size: 10px; text-transform: uppercase; letter-spacing: 0.7px;
            color: var(--text-secondary); font-weight: 700; margin-bottom: 8px;
        }
        .codeframe-tree .cf-codes-list { display: flex; flex-wrap: wrap; gap: 6px; }
        .codeframe-tree .cf-code-chip {
            display: inline-block;
            font-size: 11px; line-height: 1.4;
            padding: 4px 10px; border-radius: 999px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-primary);
            white-space: nowrap;
        }
        [data-theme="dark"] .codeframe-tree .cf-code-chip {
            background: rgba(255, 255, 255, 0.05);
        }

        /* Sub-theme mini-cards inside a codeframe theme */
        .codeframe-tree .cf-subthemes { display: flex; flex-direction: column; gap: 10px; }
        .codeframe-tree .cf-subtheme {
            padding: 12px 14px;
            border-radius: 10px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-primary);
            display: flex; flex-direction: column; gap: 8px;
        }
        [data-theme="dark"] .codeframe-tree .cf-subtheme { background: rgba(255, 255, 255, 0.03); }
        .codeframe-tree .cf-subtheme-head {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
        }
        .codeframe-tree .cf-subtheme-label {
            font-size: 13px; font-weight: 600; color: var(--text-primary);
            line-height: 1.4;
        }
        .codeframe-tree .cf-subtheme-stat {
            display: flex; align-items: center; gap: 10px; flex-shrink: 0;
            font-variant-numeric: tabular-nums;
        }
        .codeframe-tree .cf-subtheme-count {
            font-size: 11px; color: var(--text-secondary);
            font-weight: 500;
        }
        .codeframe-tree .cf-subtheme-pct {
            font-size: 13px; font-weight: 700;
            color: var(--brand-primary);
            padding: 3px 10px; border-radius: 999px;
            background: rgba(var(--brand-primary-rgb), 0.12);
        }
        .codeframe-tree .cf-subtheme-desc {
            font-size: 11px; color: var(--text-secondary); line-height: 1.5;
        }
        .codeframe-tree .cf-subtheme-bar {
            height: 4px; background: var(--bg-secondary); border-radius: 2px; overflow: hidden;
        }
        .codeframe-tree .cf-subtheme-bar > span {
            display: block; height: 100%;
            background: var(--brand-primary);
            border-radius: 2px;
        }
        .codeframe-tree .cf-subtheme-chips {
            display: flex; flex-wrap: wrap; gap: 4px;
            padding-top: 4px;
        }
        .codeframe-tree .cf-subtheme-chips .cf-code-chip {
            font-size: 10px; padding: 2px 8px;
            opacity: 0.75;
        }

        .audit-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; font-size: 12px; }
        .audit-grid .k { color: var(--text-secondary); }
        .audit-grid .v { color: var(--text-primary); font-weight: 600; font-variant-numeric: tabular-nums; }

        .empty-note { font-size: 13px; color: var(--text-secondary); font-style: italic; }

        /* ── Processing / failed fullscreen overlay ──────────────── */
        .dash-fullscreen-overlay {
            display: flex; align-items: center; justify-content: center;
            padding: 40px;
        }
        .dash-fullscreen-overlay .dash-card { max-width: 520px; width: 100%; }
        .progress-outer { height: 8px; background: rgba(var(--brand-primary-rgb), 0.12); border-radius: 4px; overflow: hidden; }
        .progress-fill  { height: 100%; background: var(--brand-primary); border-radius: 4px; transition: width 0.4s ease; }
        .progress-label { font-size: 12px; color: var(--text-secondary); margin-top: 8px; font-variant-numeric: tabular-nums; }

        .error-box {
            background: rgba(239, 68, 68, 0.10);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: var(--color-error);
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-top: 14px;
            white-space: pre-wrap; word-break: break-word;
        }

        /* Toast for share — pinned bottom-center, high opacity, stays long
           enough to read. Uses !important to defeat inherited transforms
           from parent layout rules (sidebar grid etc). */
        .copy-toast {
            position: fixed !important;
            bottom: 32px !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            padding: 12px 22px;
            background: var(--bg-card, var(--bg-secondary));
            border: 1px solid var(--brand-primary);
            color: var(--text-primary);
            border-radius: 10px;
            font-size: 13px; font-weight: 600;
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.3);
            z-index: 10000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s, transform 0.25s;
            white-space: nowrap;
        }
        [data-theme="dark"] .copy-toast {
            background: rgba(30, 41, 59, 0.98);
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.6);
        }
        .copy-toast.show { opacity: 1; }

        /* ── Responsive / mobile ──────────────────────────────────
           Uniform semantics across breakpoints:
              .collapsed  → sidebar HIDDEN, content fills the viewport
              (no class)  → sidebar VISIBLE
           Desktop default = no class. Mobile default = `.collapsed`
           (JS sets it on load when window < 900px). Hamburger toggles
           the class in both modes. On mobile, sidebar becomes an
           overlay rather than a grid column. */
        .dash-backdrop {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 40;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        @media (max-width: 900px) {
            /* Main area always fills the full width on mobile. */
            .dash-shell, .dash-shell.collapsed { grid-template-columns: 1fr; }
            .dash-sidebar {
                position: fixed;
                top: 0; left: 0; bottom: 0;
                width: 280px;
                z-index: 50;
                box-shadow: 4px 0 20px rgba(0, 0, 0, 0.35);
                transform: translateX(0);
                opacity: 1;
            }
            /* Collapsed mobile: hide overlay + backdrop. */
            .dash-shell.collapsed .dash-sidebar {
                transform: translateX(-100%);
                opacity: 0;
                pointer-events: none;
            }
            /* Sidebar visible on mobile = show the backdrop. */
            .dash-shell:not(.collapsed) .dash-backdrop {
                display: block;
                opacity: 1;
            }
            .dash-topbar { padding: 12px 16px; }
            .dash-content { padding: 16px 16px 80px; }
            .dash-section-title { font-size: 16px; }
            .dash-two-col { grid-template-columns: 1fr; }
            .kpi-row { gap: 10px; }
            .chart-grid { gap: 12px; }
            .theme-accordion-header {
                grid-template-columns: 28px minmax(0, 1fr) 60px 20px;
                gap: 10px;
                padding: 10px 12px;
            }
            .theme-accordion-sentiment { display: none; }
            .theme-accordion-body { padding: 6px 14px 16px 46px; }
        }
        @media (max-width: 480px) {
            .dash-topbar-titles .dash-section-sub { display: none; }
            .dash-btn { padding: 6px 10px; font-size: 12px; }
            .dash-btn svg { width: 12px; height: 12px; }
            .dash-actions { gap: 6px; }
            .kpi-row { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .kpi-val { font-size: 20px; }
            .kpi { padding: 12px 14px; }
            .dash-content { padding: 12px 12px 80px; }
            .dash-topbar { padding: 10px 12px; }
        }
    </style>
</head>
<body class="dashboard research-page">
    <!-- ══════════════════════════════════════════════════════════════
         PROCESSING / FAILED FULLSCREEN VIEW
         Shown while job is in-flight or when it has failed. Swaps to
         dashboard-shell once status=done.
         ══════════════════════════════════════════════════════════════ -->
    <div id="statusView" class="dash-fullscreen-overlay" style="min-height:100vh;">
        <div class="dash-card" style="padding: 28px;">
            <div style="font-size:12px; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-secondary); margin-bottom:6px;" id="stageLabel">Loading…</div>
            <h1 style="font-size:22px; margin:0 0 20px 0; color:var(--text-primary);" id="stageTitle">Loading report</h1>

            <div class="progress-outer"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
            <div class="progress-label"><span id="progressPct">0</span>% — <span id="progressStatus">Waiting for job state</span></div>

            <div class="error-box" id="errorBox" style="display:none;"></div>

            <div style="display:flex; gap:10px; margin-top:22px;" id="actionsRow">
                <button class="dash-btn" id="backBtn">Back to project</button>
                <button class="dash-btn primary" id="retryBtn" style="display:none;">Retry</button>
            </div>
        </div>
    </div>

    <!-- ══════════════════════════════════════════════════════════════
         DASHBOARD SHELL — populated once status=done
         ══════════════════════════════════════════════════════════════ -->
    <div id="dashBackdrop" class="dash-backdrop"></div>
    <div id="dashShell" class="dash-shell" style="display:none;">
        <aside class="dash-sidebar">
            <div class="dash-sidebar-header">
                <a class="dash-back" id="dashBack" href="focus-groups.html">← Focus Groups</a>
                <div class="dash-project" id="dashProjectName">Loading…</div>
                <div class="dash-meta" id="dashProjectMeta"></div>
            </div>
            <nav class="dash-nav" id="dashNav"></nav>
            <div class="dash-sidebar-footer" id="dashGenerated"></div>
        </aside>

        <main class="dash-main">
            <div class="dash-topbar">
                <div class="dash-topbar-left">
                    <button class="dash-hamburger" id="btnHamburger" title="Toggle sidebar" aria-label="Toggle sidebar">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
                        </svg>
                    </button>
                    <div class="dash-topbar-titles">
                        <div class="dash-section-title" id="sectionTitle">Overview</div>
                        <div class="dash-section-sub" id="sectionSub"></div>
                    </div>
                </div>
                <div class="dash-actions">
                    <button class="dash-btn dash-btn-icon" id="btnThemeToggle" title="Toggle theme" aria-label="Toggle theme">
                        <svg class="dash-theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="4"/>
                            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
                        </svg>
                        <svg class="dash-theme-icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </button>
                    <button class="dash-btn" id="btnShare" title="Copy dashboard URL">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/>
                        </svg>
                        Share
                    </button>
                    <button class="dash-btn primary" id="btnDownloadPPT" title="Download as PowerPoint">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        Download PPT
                    </button>
                </div>
            </div>
            <div class="dash-content" id="dashContent"></div>
        </main>
    </div>

    <div id="copyToast" class="copy-toast">Copied to clipboard</div>

    <script>document.write('<script src="../../js/config.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script>document.write('<script src="../../js/api.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script>document.write('<script src="../../js/navigation.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script>document.write('<script src="../../js/toast.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script>document.write('<script src="../../js/searchable-dropdown.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.0/dist/browser/signalr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.44.0/dist/apexcharts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    <script>document.write('<script src="../../js/research/fgd-report.js?v=' + CACHE_VERSION + '"><\/script>');</script>
</body>
