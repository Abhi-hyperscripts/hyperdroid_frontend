<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FGD Report - Ragenaizer</title>
    <script>window.CACHE_VERSION = Date.now();</script>
    <script>document.write('<script src="../../js/sw-version.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/theme.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/styles.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/research.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/glassmorphic-modal.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<script src="../../js/theme.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <style>
        .report-shell { max-width: 960px; margin: 0 auto; padding: 24px 20px 80px; }
        .report-breadcrumb { display:flex; align-items:center; gap:8px; font-size:14px; color:var(--text-secondary); margin-bottom: 14px; }
        .report-breadcrumb a { color: var(--text-secondary); text-decoration: none; }
        .report-breadcrumb a:hover { color: var(--text-primary); }
        .report-panel {
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, transparent 50%),
                rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(16px) saturate(1.4);
            -webkit-backdrop-filter: blur(16px) saturate(1.4);
            border: 1px solid rgba(var(--brand-primary-rgb), 0.25);
            border-radius: 14px;
            padding: 28px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }
        [data-theme="dark"] .report-panel {
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0.01) 50%, transparent 100%),
                rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(var(--brand-primary-rgb), 0.3);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.06),
                0 2px 8px rgba(0, 0, 0, 0.15);
        }
        .stage-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-secondary); margin-bottom: 6px; }
        .stage-title { font-size: 22px; font-weight: 600; color: var(--text-primary); margin: 0 0 20px 0; }
        .progress-outer { height: 8px; background: rgba(var(--brand-primary-rgb), 0.12); border-radius: 4px; overflow: hidden; }
        .progress-fill  { height: 100%; background: var(--brand-primary); border-radius: 4px; transition: width 0.4s ease; }
        .progress-label { font-size: 12px; color: var(--text-secondary); margin-top: 8px; font-variant-numeric: tabular-nums; }
        .status-line    { font-size: 14px; color: var(--text-primary); margin-top: 18px; }
        .error-box {
            background: rgba(239, 68, 68, 0.10);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: var(--color-error);
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-top: 14px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .actions-row { display:flex; gap:10px; margin-top: 22px; }
        .done-banner {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: var(--color-success);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 16px;
        }
        pre.report-dump {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-primary);
            border-radius: 10px;
            padding: 14px;
            font-size: 11px;
            max-height: 520px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body class="dashboard research-page">
    <script>document.write('<script src="/js/button-spinner.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <nav class="navbar">
        <div class="navbar-brand">
            <a href="../home.html"><img src="../../assets/brand_logo.png" alt="Logo" class="navbar-logo"></a>
        </div>
        <div class="navbar-menu"></div>
    </nav>

    <div class="report-shell">
        <div class="report-breadcrumb">
            <a href="dashboard.html">Research</a>
            <span>/</span>
            <a href="focus-groups.html">Focus Groups</a>
            <span>/</span>
            <a id="backToProject" href="#">Project</a>
            <span>/</span>
            <span style="color:var(--text-primary); font-weight:500;">Report</span>
        </div>

        <div class="report-panel">
            <div class="stage-label" id="stageLabel">Loading…</div>
            <h1 class="stage-title" id="stageTitle">Loading report</h1>

            <div class="progress-outer"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
            <div class="progress-label"><span id="progressPct">0</span>% — <span id="progressStatus">Waiting for job state</span></div>

            <div class="status-line" id="statusLine"></div>
            <div class="error-box" id="errorBox" style="display:none;"></div>

            <div class="actions-row" id="actionsRow" style="display:none;">
                <button class="research-btn btn-primary" id="retryBtn" style="display:none;">Retry</button>
                <button class="research-btn" id="backBtn">Back to project</button>
            </div>
        </div>

        <div class="report-panel" id="reportRenderPanel" style="display:none; margin-top:20px;">
            <div class="done-banner">Report ready. Full slide-style renderer ships in Sprint 5 — raw JSON shown below for now.</div>
            <pre class="report-dump" id="reportJsonDump"></pre>
        </div>
    </div>

    <script>document.write('<script src="../../js/config.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script>document.write('<script src="../../js/api.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script>document.write('<script src="../../js/navigation.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script>document.write('<script src="../../js/toast.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.0/dist/browser/signalr.min.js"></script>
    <script>document.write('<script src="../../js/research/fgd-report.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof Navigation !== 'undefined') Navigation.init('research', '../');
        });
    </script>
</body>
</html>
