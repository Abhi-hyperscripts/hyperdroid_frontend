<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Cookie Consent & Analytics -->
    <script src="/js/cookie-consent.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=2">
    <title>Inquiry Detail - Procurement | Ragenaizer</title>
    <script>window.CACHE_VERSION = Date.now();</script>
    <script>document.write('<script src="../../js/sw-version.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script src="/js/sw-update.js"></script>
    <script src="/js/pwa-install-prompt.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script>document.write('<link rel="stylesheet" href="../../css/theme.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/styles.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/glassmorphic-modal.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/crm.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/glass-cards.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/table-cards.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<script src="../../js/theme.js?v=' + CACHE_VERSION + '"><\/script>');</script>
</head>
<body class="dashboard crm-page">
    <script>document.write('<script src="/js/button-spinner.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <nav class="navbar">
        <div class="navbar-brand">
            <a href="../home.html">
                <img src="../../assets/brand_logo.png" alt="Ragenaizer Logo" class="navbar-logo">
            </a>
        </div>
        <div class="navbar-menu"></div>
    </nav>

    <div class="crm-container">
        <!-- Header -->
        <div class="crm-header">
            <div class="header-content">
                <nav class="breadcrumb-nav">
                    <a href="dashboard.html">Procurement</a>
                    <span class="separator">/</span>
                    <a href="inquiries.html">Inquiries</a>
                    <span class="separator">/</span>
                    <span class="current" id="breadcrumbTitle">Detail</span>
                </nav>
                <div class="crm-header-row">
                    <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                        <a href="inquiries.html" class="btn btn-secondary btn-sm" style="display: inline-flex; align-items: center; gap: 4px;">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="15 18 9 12 15 6"/>
                            </svg>
                            Back
                        </a>
                        <h1 id="inquiryTitle" style="margin: 0;">Loading...</h1>
                        <span id="inquiryStatusBadge"></span>
                        <span id="inquiryPriorityBadge"></span>
                    </div>
                    <div class="header-actions" id="headerActions">
                        <!-- Actions populated dynamically -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Metadata Row -->
        <div id="metadataRow" style="display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 24px; padding: 16px; background: var(--bg-card); border: 1px solid var(--border-primary); border-radius: 12px;">
            <div>
                <div style="font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;">Inquiry Number</div>
                <div style="font-size: 14px; color: var(--text-primary); font-weight: 600;" id="metaInquiryNumber">-</div>
            </div>
            <div>
                <div style="font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;">Client</div>
                <div style="font-size: 14px; color: var(--text-primary);" id="metaClient">-</div>
            </div>
            <div>
                <div style="font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;">Project</div>
                <div style="font-size: 14px; color: var(--text-primary);" id="metaProject">-</div>
            </div>
            <div>
                <div style="font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;">Due Date</div>
                <div style="font-size: 14px; color: var(--text-primary);" id="metaDueDate">-</div>
            </div>
            <div>
                <div style="font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;">Created By</div>
                <div style="font-size: 14px; color: var(--text-primary);" id="metaCreatedBy">-</div>
            </div>
        </div>

        <!-- Description -->
        <div id="descriptionSection" style="display: none; margin-bottom: 24px; padding: 16px; background: var(--bg-card); border: 1px solid var(--border-primary); border-radius: 12px;">
            <div style="font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;">Description</div>
            <div style="font-size: 14px; color: var(--text-primary); line-height: 1.6;" id="inquiryDescription">-</div>
        </div>

        <!-- Items Section -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h3 style="color: var(--text-primary); font-size: 1rem; font-weight: 600; margin: 0;">Items</h3>
            <button class="btn btn-primary btn-sm" onclick="openAddItemModal()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Add Item
            </button>
        </div>

        <div class="crm-table-wrapper data-table-container">
            <table class="crm-table data-table" id="itemsTable">
                <thead>
                    <tr>
                        <th>Item Name</th>
                        <th>Quantity</th>
                        <th class="hide-mobile">Unit</th>
                        <th class="hide-mobile">Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="itemsTableBody">
                    <tr>
                        <td colspan="5" class="crm-empty-state">
                            <div class="crm-empty-content">
                                <p>Loading items...</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add/Edit Item Modal -->
    <div class="modal" id="addItemModal">
        <div class="modal-backdrop" onclick="closeAddItemModal()"></div>
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addItemModalTitle">Add Item</h5>
                    <button class="close-btn" onclick="closeAddItemModal()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="addItemForm" onsubmit="handleAddItemSubmit(event)">
                        <input type="hidden" id="editItemId" value="">
                        <div class="mb-3">
                            <label for="addItemName" class="form-label">Item Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="addItemName" name="item_name" required>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="addItemQuantity" class="form-label">Quantity <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" id="addItemQuantity" name="quantity" min="0" step="any" required>
                            </div>
                            <div class="col-md-6">
                                <label for="addItemUnit" class="form-label">Unit</label>
                                <select class="form-select" id="addItemUnit" name="unit">
                                    <option value="">Select Unit</option>
                                    <option value="nos">Nos</option>
                                    <option value="kg">Kg</option>
                                    <option value="ltr">Ltr</option>
                                    <option value="mtr">Mtr</option>
                                    <option value="sqm">Sqm</option>
                                    <option value="sqft">Sqft</option>
                                    <option value="set">Set</option>
                                    <option value="pair">Pair</option>
                                    <option value="box">Box</option>
                                    <option value="pack">Pack</option>
                                    <option value="ton">Ton</option>
                                    <option value="bag">Bag</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="addItemDescription" class="form-label">Description / Specifications</label>
                            <textarea class="form-control" id="addItemDescription" name="description" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeAddItemModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" form="addItemForm" id="addItemSubmitBtn">
                        <span class="btn-spinner" id="addItemSubmitSpinner" style="display:none;"></span>
                        Add Item
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.0/dist/browser/signalr.min.js"></script>
    <script>
        document.write('<script src="../../js/config.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/api.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/navigation.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/toast.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/table-cards.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/procurement/inquiry-detail.js?v=' + CACHE_VERSION + '"><\/script>');
    </script>
</body>
</html>
