<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Cookie Consent & Analytics -->
    <script src="/js/cookie-consent.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=2">
    <title>Master Items - Procurement | Ragenaizer</title>
    <script>window.CACHE_VERSION = Date.now();</script>
    <script>document.write('<script src="../../js/sw-version.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script src="/js/sw-update.js"></script>
    <script src="/js/pwa-install-prompt.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script>document.write('<link rel="stylesheet" href="../../css/theme.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/styles.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/glassmorphic-modal.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/crm.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/glass-cards.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/table-cards.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/searchable-dropdown.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<script src="../../js/theme.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <style>
        /* Match filter bar heights: search, dropdown trigger, buttons all 32px */
        #filterCategory-searchable-container .searchable-dropdown-trigger {
            height: 32px !important;
            min-height: 32px !important;
            max-height: 32px !important;
            padding: 5px 8px !important;
            font-size: 13px !important;
        }
    </style>
</head>
<body class="dashboard crm-page">
    <script>document.write('<script src="/js/button-spinner.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <nav class="navbar">
        <div class="navbar-brand">
            <a href="../home.html">
                <img src="../../assets/brand_logo.png" alt="Ragenaizer Logo" class="navbar-logo">
            </a>
        </div>
        <div class="navbar-menu"></div>
    </nav>

    <div class="crm-container">
        <!-- Header -->
        <div class="crm-header">
            <div class="header-content">
                <nav class="breadcrumb-nav">
                    <a href="dashboard.html">Procurement</a>
                    <span class="separator">/</span>
                    <span class="current">Master Items</span>
                </nav>
                <div class="crm-header-row">
                    <h1>Master Items</h1>
                </div>
            </div>
        </div>

        <!-- Filter Bar -->
        <div style="display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; margin-bottom:16px;">
            <!-- Search -->
            <div style="flex:1; min-width:200px;">
                <label style="display:block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-secondary); margin-bottom:4px;">Search</label>
                <input type="text" id="filterSearch" placeholder="Search items..." oninput="applyFilters()"
                    style="width:100%; height:32px; padding:0 10px; font-size:13px; border:1px solid var(--border-primary); border-radius:4px; background:var(--bg-input, var(--bg-secondary)); color:var(--text-primary); outline:none; box-sizing:border-box;">
            </div>
            <!-- Category dropdown -->
            <div style="min-width:180px;">
                <label style="display:block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-secondary); margin-bottom:4px;">Category</label>
                <select id="filterCategory" class="form-select form-select-sm" onchange="applyFilters()" style="height:32px;">
                    <option value="">All Categories</option>
                </select>
            </div>
            <!-- Buttons -->
            <div style="display:flex; gap:8px; align-items:flex-end;">
                <button class="btn btn-primary btn-sm" onclick="openNewItemModal()" style="height:32px; padding:0 14px; white-space:nowrap; display:flex; align-items:center; gap:5px; font-size:13px; border-radius:4px;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Add Item
                </button>
                <button class="btn btn-secondary btn-sm" onclick="openCategoryModal()" style="height:32px; padding:0 14px; white-space:nowrap; display:flex; align-items:center; gap:5px; font-size:13px; border-radius:4px;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    Categories
                </button>
            </div>
        </div>

        <!-- Items Table -->
        <div class="crm-table-wrapper data-table-container">
            <table class="crm-table data-table" id="itemsTable">
                <thead>
                    <tr>
                        <th>Item Name</th>
                        <th>Item Code</th>
                        <th class="hide-mobile">Category</th>
                        <th class="hide-mobile">Unit</th>
                        <th class="hide-mobile">Vendors</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="itemsTableBody">
                    <tr>
                        <td colspan="6" class="crm-empty-state">
                            <div class="crm-empty-content">
                                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <path d="M20 7h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v3H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2z"/>
                                </svg>
                                <p>Loading items...</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- New/Edit Item Modal -->
    <div class="modal" id="itemModal">
        <div class="modal-backdrop" onclick="closeItemModal()"></div>
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="itemModalTitle">Add Item</h5>
                    <button class="close-btn" onclick="closeItemModal()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="itemForm" onsubmit="handleItemSubmit(event)">
                        <input type="hidden" id="itemId" value="">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="itemName" class="form-label">Item Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="itemName" name="item_name" required>
                            </div>
                            <div class="col-md-6">
                                <label for="itemCode" class="form-label">Item Code</label>
                                <input type="text" class="form-control" id="itemCode" name="item_code" placeholder="Auto-generated if empty">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="itemCategory" class="form-label">Category</label>
                                <select class="form-select" id="itemCategory" name="category_id">
                                    <option value="">No Category</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="itemUnit" class="form-label">Unit</label>
                                <select class="form-select" id="itemUnit" name="unit">
                                    <option value="">Select Unit</option>
                                    <option value="nos">Nos</option>
                                    <option value="kg">Kg</option>
                                    <option value="ltr">Ltr</option>
                                    <option value="mtr">Mtr</option>
                                    <option value="sqm">Sqm</option>
                                    <option value="sqft">Sqft</option>
                                    <option value="set">Set</option>
                                    <option value="pair">Pair</option>
                                    <option value="box">Box</option>
                                    <option value="pack">Pack</option>
                                    <option value="ton">Ton</option>
                                    <option value="bag">Bag</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="itemHsnCode" class="form-label">HSN Code</label>
                                <input type="text" class="form-control" id="itemHsnCode" name="hsn_code">
                            </div>
                            <div class="col-md-6">
                                <label for="itemSpecifications" class="form-label">Specifications</label>
                                <input type="text" class="form-control" id="itemSpecifications" name="specifications">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="itemDescription" class="form-label">Description</label>
                            <textarea class="form-control" id="itemDescription" name="description" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeItemModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" form="itemForm" id="itemSubmitBtn">
                        <span class="btn-spinner" id="itemSubmitSpinner" style="display:none;"></span>
                        Add Item
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Category Management Modal -->
    <div class="modal" id="categoryModal">
        <div class="modal-backdrop" onclick="closeCategoryModal()"></div>
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Manage Categories</h5>
                    <button class="close-btn" onclick="closeCategoryModal()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <div class="modal-body">
                    <!-- Add New Category -->
                    <div style="display: flex; gap: 8px; margin-bottom: 16px; align-items: stretch;">
                        <input type="text" class="form-control" id="newCategoryName" placeholder="New category name..." style="flex:1 1 auto !important; min-width:0 !important; width:auto !important; height:34px !important;">
                        <button class="btn btn-primary btn-sm" onclick="addCategory()" style="white-space: nowrap; padding:0 16px; flex:0 0 auto; width:auto; height:34px !important; line-height:34px; font-size:13px; margin:0 !important; border-radius:4px;">+ Add</button>
                    </div>
                    <!-- Category List -->
                    <div id="categoryListContainer" style="max-height: 300px; overflow-y: auto;">
                        <p style="color: var(--text-secondary); text-align: center;">Loading categories...</p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeCategoryModal()">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Item Detail Modal -->
    <div class="modal" id="itemDetailModal">
        <div class="modal-backdrop" onclick="closeModal('itemDetailModal')"></div>
        <div class="modal-dialog" style="max-width:820px;width:95vw;">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="itemDetailTitle">Item Details</h5>
                    <button class="close-btn" onclick="closeModal('itemDetailModal')">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>
                <div class="modal-body" style="padding:0;">
                    <!-- Tabs -->
                    <div style="display:flex;border-bottom:2px solid var(--border-primary);padding:0 16px;">
                        <button class="item-detail-tab active" data-tab="vendors" onclick="switchItemDetailTab('vendors')" style="padding:10px 16px;font-size:13px;font-weight:600;border:none;background:none;color:var(--text-secondary);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;">Linked Vendors</button>
                        <button class="item-detail-tab" data-tab="synonyms" onclick="switchItemDetailTab('synonyms')" style="padding:10px 16px;font-size:13px;font-weight:600;border:none;background:none;color:var(--text-secondary);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;">Synonyms</button>
                        <button class="item-detail-tab" data-tab="mappings" onclick="switchItemDetailTab('mappings')" style="padding:10px 16px;font-size:13px;font-weight:600;border:none;background:none;color:var(--text-secondary);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;">Mappings</button>
                    </div>
                    <!-- Tab Content -->
                    <div style="padding:16px;">
                        <div id="tab-vendors" class="item-detail-content"></div>
                        <div id="tab-synonyms" class="item-detail-content" style="display:none;"></div>
                        <div id="tab-mappings" class="item-detail-content" style="display:none;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.0/dist/browser/signalr.min.js"></script>
    <script>
        document.write('<script src="../../js/config.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/api.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/navigation.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/toast.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/table-cards.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/searchable-dropdown.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/procurement/info-panel.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/auto-searchable-select.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/procurement/items.js?v=' + CACHE_VERSION + '"><\/script>');
    </script>
    <script>document.write('<script src="../../embed/widget.js?v=' + CACHE_VERSION + '" data-mode="copilot" data-service="procurement" data-title="Procurement Assistant"><\/script>')</script>
</body>
</html>
