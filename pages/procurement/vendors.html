<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Cookie Consent & Analytics -->
    <script src="/js/cookie-consent.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=2">
    <title>Vendors - Procurement | Ragenaizer</title>
    <script>window.CACHE_VERSION = Date.now();</script>
    <script>document.write('<script src="../../js/sw-version.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script src="/js/sw-update.js"></script>
    <script src="/js/pwa-install-prompt.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script>document.write('<link rel="stylesheet" href="../../css/theme.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/styles.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/glassmorphic-modal.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/crm.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/glass-cards.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/table-cards.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<script src="../../js/theme.js?v=' + CACHE_VERSION + '"><\/script>');</script>
</head>
<body class="dashboard crm-page">
    <script>document.write('<script src="/js/button-spinner.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <nav class="navbar">
        <div class="navbar-brand">
            <a href="../home.html">
                <img src="../../assets/brand_logo.png" alt="Ragenaizer Logo" class="navbar-logo">
            </a>
        </div>
        <div class="navbar-menu"></div>
    </nav>

    <div class="crm-container">
        <!-- Header -->
        <div class="crm-header">
            <div class="header-content">
                <nav class="breadcrumb-nav">
                    <a href="dashboard.html">Procurement</a>
                    <span class="separator">/</span>
                    <span class="current">Vendors</span>
                </nav>
                <div class="crm-header-row">
                    <h1>Vendors</h1>
                    <button class="btn btn-primary" id="newVendorBtn" onclick="openNewVendorModal()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        Add Vendor
                    </button>
                </div>
            </div>
        </div>

        <!-- Filter Bar -->
        <div class="crm-filter-bar">
            <div class="crm-filter-group crm-search-group">
                <label for="filterSearch">Search</label>
                <input type="text" id="filterSearch" class="form-control form-control-sm" placeholder="Search vendors..." oninput="applyFilters()">
            </div>
        </div>

        <!-- Vendors Table -->
        <div class="crm-table-wrapper data-table-container">
            <table class="crm-table data-table" id="vendorsTable">
                <thead>
                    <tr>
                        <th>Vendor Name</th>
                        <th>Code</th>
                        <th class="hide-mobile">Email</th>
                        <th class="hide-mobile">Phone</th>
                        <th class="hide-mobile">City</th>
                        <th class="hide-mobile">Country</th>
                        <th class="hide-mobile">Rating</th>
                        <th class="hide-mobile">Items</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="vendorsTableBody">
                    <tr>
                        <td colspan="9" class="crm-empty-state">
                            <div class="crm-empty-content">
                                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
                                    <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
                                </svg>
                                <p>Loading vendors...</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- New/Edit Vendor Modal -->
    <div class="modal" id="vendorModal">
        <div class="modal-backdrop" onclick="closeVendorModal()"></div>
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="vendorModalTitle">Add Vendor</h5>
                    <button class="close-btn" onclick="closeVendorModal()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="vendorForm" onsubmit="handleVendorSubmit(event)">
                        <input type="hidden" id="vendorId" value="">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="vendorName" class="form-label">Vendor Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="vendorName" name="vendor_name" required>
                            </div>
                            <div class="col-md-6">
                                <label for="vendorCode" class="form-label">Vendor Code</label>
                                <input type="text" class="form-control" id="vendorCode" name="vendor_code" placeholder="Auto-generated if empty">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="vendorEmail" class="form-label">Email</label>
                                <input type="email" class="form-control" id="vendorEmail" name="email">
                            </div>
                            <div class="col-md-6">
                                <label for="vendorPhone" class="form-label">Phone</label>
                                <input type="tel" class="form-control" id="vendorPhone" name="phone">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="vendorContactPerson" class="form-label">Contact Person</label>
                                <input type="text" class="form-control" id="vendorContactPerson" name="contact_person">
                            </div>
                            <div class="col-md-6">
                                <label for="vendorWebsite" class="form-label">Website</label>
                                <input type="url" class="form-control" id="vendorWebsite" name="website" placeholder="https://...">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="vendorAddress" class="form-label">Address</label>
                                <input type="text" class="form-control" id="vendorAddress" name="address">
                            </div>
                            <div class="col-md-6">
                                <label for="vendorCity" class="form-label">City</label>
                                <input type="text" class="form-control" id="vendorCity" name="city">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="vendorState" class="form-label">State</label>
                                <input type="text" class="form-control" id="vendorState" name="state">
                            </div>
                            <div class="col-md-6">
                                <label for="vendorCountry" class="form-label">Country</label>
                                <input type="text" class="form-control" id="vendorCountry" name="country">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="vendorPostalCode" class="form-label">Postal Code</label>
                                <input type="text" class="form-control" id="vendorPostalCode" name="postal_code">
                            </div>
                            <div class="col-md-6">
                                <label for="vendorGstNumber" class="form-label">GST / Tax Number</label>
                                <input type="text" class="form-control" id="vendorGstNumber" name="gst_number">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="vendorPanNumber" class="form-label">PAN / Tax ID</label>
                                <input type="text" class="form-control" id="vendorPanNumber" name="pan_number">
                            </div>
                            <div class="col-md-6">
                                <label for="vendorPaymentTerms" class="form-label">Payment Terms</label>
                                <input type="text" class="form-control" id="vendorPaymentTerms" name="payment_terms" placeholder="e.g. Net 30">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="vendorNotes" class="form-label">Notes</label>
                            <textarea class="form-control" id="vendorNotes" name="notes" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeVendorModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" form="vendorForm" id="vendorSubmitBtn">
                        <span class="btn-spinner" id="vendorSubmitSpinner" style="display:none;"></span>
                        Add Vendor
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.0/dist/browser/signalr.min.js"></script>
    <script>
        document.write('<script src="../../js/config.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/api.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/navigation.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/toast.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/table-cards.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/procurement/vendors.js?v=' + CACHE_VERSION + '"><\/script>');
    </script>
</body>
</html>
