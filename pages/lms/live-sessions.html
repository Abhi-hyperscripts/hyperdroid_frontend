<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Cookie Consent & Analytics -->
    <script src="/js/cookie-consent.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=2">
    <title>Live Sessions - LMS | Ragenaizer</title>
    <script>window.CACHE_VERSION = Date.now();</script>
    <script>document.write('<script src="../../js/sw-version.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script src="/js/sw-update.js"></script>
    <script src="/js/pwa-install-prompt.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        document.write('<link rel="stylesheet" href="../../css/theme.css?v=' + CACHE_VERSION + '">');
        document.write('<link rel="stylesheet" href="../../css/styles.css?v=' + CACHE_VERSION + '">');
        document.write('<link rel="stylesheet" href="../../css/crm.css?v=' + CACHE_VERSION + '">');
        document.write('<link rel="stylesheet" href="../../css/glass-cards.css?v=' + CACHE_VERSION + '">');
        document.write('<link rel="stylesheet" href="../../css/table-cards.css?v=' + CACHE_VERSION + '">');
        document.write('<link rel="stylesheet" href="../../css/lms.css?v=' + CACHE_VERSION + '">');
        document.write('<link rel="stylesheet" href="../../css/glassmorphic-modal.css?v=' + CACHE_VERSION + '">');
    </script>
    <!-- Flatpickr — datetime-local has no time picker on macOS Safari. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script>document.write('<link rel="stylesheet" href="../../css/flatpickr-custom.css?v=' + CACHE_VERSION + '">');</script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>document.write('<script src="../../js/theme.js?v=' + CACHE_VERSION + '"><\/script>');</script>
</head>
<body class="dashboard lms-dashboard crm-page">
    <script>document.write('<script src="/js/button-spinner.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <nav class="navbar">
        <div class="navbar-brand">
            <a href="../home.html">
                <img src="../../assets/brand_logo.png" alt="Ragenaizer Logo" class="navbar-logo">
            </a>
        </div>
        <div class="navbar-menu">
            <!-- Navigation links rendered by Navigation.init() -->
        </div>
    </nav>

    <div class="crm-container">
        <!-- Header -->
        <div class="crm-header">
            <div class="header-content">
                <nav class="breadcrumb-nav" style="margin-bottom: 8px;">
                    <a href="dashboard.html">LMS</a>
                    <span class="separator">/</span>
                    <span class="current">Live Sessions</span>
                </nav>
                <div class="crm-header-row">
                    <div>
                        <h1>Live Sessions</h1>
                        <p class="header-subtitle">Join live classes and view recordings</p>
                    </div>
                    <button class="btn btn-primary" id="btnScheduleSession" style="display: none;" onclick="showScheduleModal()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        Schedule Session
                    </button>
                </div>
            </div>
        </div>

        <!-- Upcoming Sessions -->
        <div class="section-header">
            <h3 class="section-title">Upcoming Sessions</h3>
        </div>
        <div class="sessions-grid" id="upcomingSessionsGrid">
            <div class="lms-loading">Loading sessions...</div>
        </div>

        <!-- Past Sessions with Recordings -->
        <div class="section-header" style="margin-top: 32px;">
            <h3 class="section-title">Past Sessions</h3>
        </div>
        <div class="sessions-grid" id="pastSessionsGrid">
            <div class="lms-loading">Loading past sessions...</div>
        </div>
    </div>

    <!-- Schedule Session Modal (INSTRUCTOR only) -->
    <div class="modal-overlay" id="scheduleSessionModal" style="display: none;">
        <div class="modal-container">
            <div class="modal-header">
                <h3>Schedule Live Session</h3>
                <button class="modal-close" onclick="closeScheduleModal()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label" for="sessionTitle">Session Title</label>
                    <input type="text" id="sessionTitle" class="form-input" placeholder="Enter session title" maxlength="200">
                </div>
                <div class="form-group">
                    <label class="form-label" for="sessionCourse">Course</label>
                    <select id="sessionCourse" class="form-input">
                        <option value="">Select a course</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="sessionDate">Date & Time</label>
                    <div style="display:grid;grid-template-columns:1fr 130px;gap:6px;">
                        <input type="date" id="sessionDate" class="form-input">
                        <input type="time" id="sessionDateTime" class="form-input">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="sessionDuration">Duration (minutes)</label>
                    <input type="number" id="sessionDuration" class="form-input" value="60" min="15" max="480">
                </div>
                <div class="form-group">
                    <label class="form-label" for="sessionDescription">Description (optional)</label>
                    <textarea id="sessionDescription" class="form-textarea" rows="3" placeholder="Session description..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeScheduleModal()">Cancel</button>
                <button class="btn btn-primary" id="btnSubmitSession" onclick="scheduleSession()">Schedule</button>
            </div>
        </div>
    </div>

    <script>
        document.write('<script src="../../js/config.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/api.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/navigation.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/lms/lms-notifications.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/toast.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/lms/lmsRoles.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/hrms/hrms-datepicker.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/lms/live-sessions.js?v=' + CACHE_VERSION + '"><\/script>');
    </script>
    <!-- AI Copilot Widget -->
    <script>document.write('<script src="../../embed/widget.js?v=' + CACHE_VERSION + '" data-mode="copilot" data-service="lms" data-title="LMS Assistant"><\/script>');</script>
</body>
</html>
