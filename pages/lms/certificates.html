<head>

    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">

    <script>window.CACHE_VERSION = Date.now();</script>
    <script src="../../js/sw-version.js?v=3061"></script>
    <script src="/js/sw-update.js"></script>
    <script src="/js/pwa-install-prompt.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="../../css/theme.css?v=3061">
    <link rel="stylesheet" href="../../css/styles.css?v=3061">
<link rel="stylesheet" href="../../css/crm.css?v=3061">
        <link rel="stylesheet" href="../../css/glass-cards.css?v=3061">
        <link rel="stylesheet" href="../../css/table-cards.css?v=3061">
        <link rel="stylesheet" href="../../css/table-filter.css?v=3061">
        <link rel="stylesheet" href="../../css/lms.css?v=3061">
        <link rel="stylesheet" href="../../css/glassmorphic-modal.css?v=3061">
    <script src="../../js/theme.js?v=3061"></script>
</head>
<body class="dashboard lms-dashboard crm-page">
    <script src="/js/button-spinner.js?v=3061"></script>
    <nav class="navbar">
        <div class="navbar-brand">
            <a href="../home.html">
                <img src="../../assets/brand_logo.png" alt="Ragenaizer Logo" class="navbar-logo">
            </a>
        </div>
        <div class="navbar-menu">
            <!-- Navigation links rendered by Navigation.init() -->
        </div>
    </nav>

    <div class="crm-container">
        <!-- Breadcrumb -->
        <div class="lms-breadcrumb">
            <a href="dashboard.html">LMS</a>
            <span class="separator">/</span>
            <span class="current">Certificates</span>
        </div>

        <!-- Header -->
        <div class="lms-header">
            <div>
                <h1>My Certificates</h1>
                <p class="header-subtitle">Certificates earned from completed courses</p>
            </div>
        </div>

        <!-- Certificate Grid -->
        <div id="certificateGrid" class="lms-course-grid">
            <div class="lms-empty-state" id="certLoading">
                <p>Loading certificates...</p>
            </div>
        </div>

        <!-- Verify Certificate Section -->
        <div class="lms-card" style="margin-top: var(--space-8);">
            <div class="lms-card-header">
                <h3>Verify a Certificate</h3>
            </div>
            <div style="padding: var(--space-5);">
                <p style="color: var(--text-secondary); margin-bottom: var(--space-4);">Enter a certificate number to verify its authenticity.</p>
                <div style="display: flex; gap: var(--space-3); max-width: 500px;">
                    <input type="text" id="verifyCertNumber" class="form-control"
                           placeholder="e.g. CERT-2026-XXXX"
                           style="background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border-primary);">
                    <button class="btn btn-primary" onclick="verifyCertificate()" style="white-space: nowrap;">Verify</button>
                </div>
                <div id="verifyResult" style="margin-top: var(--space-4); display:none;"></div>
            </div>
        </div>
    </div>

<div class="modal-overlay" id="certDetailModal" style="display:none;">
        <div class="modal-container">
            <div class="modal-header"><h3>Certificate</h3>
                <button class="modal-close" onclick="closeCertDetail()">&times;</button></div>
            <div class="modal-body" id="certDetailBody"></div>
            <div class="modal-footer"><button class="btn btn-secondary" onclick="closeCertDetail()">Done</button></div>
        </div>
    </div>

        <script src="../../js/config.js?v=3061"></script>
        <script src="../../js/api.js?v=3061"></script>
        <script src="../../js/navigation.js?v=3061"></script>
        <script src="../../js/table-cards.js?v=3061"></script>
        <script src="../../js/table-filter.js?v=3061"></script>
        <script src="../../js/lms/lmsRoles.js?v=3061"></script>
        <script src="../../js/lms/lms-insight-views.js?v=3061"></script>
        <script src="../../js/lms/lms-notifications.js?v=3061"></script>
        <script src="../../js/toast.js?v=3061"></script>
        <script src="../../js/lms/certificates.js?v=3061"></script>
    <!-- AI Copilot Widget -->
    <script src="../../embed/widget.js?v=3061" data-mode="copilot" data-service="lms" data-title="LMS Assistant"></script>
</body>
</html>
