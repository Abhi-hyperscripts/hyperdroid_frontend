<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Cookie Consent & Analytics -->
    <script src="/js/cookie-consent.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=2">
    <title>Course Builder - LMS | Ragenaizer</title>
    <script>window.CACHE_VERSION = Date.now();</script>
    <script>document.write('<script src="../../js/sw-version.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script src="/js/sw-update.js"></script>
    <script src="/js/pwa-install-prompt.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>document.write('<link rel="stylesheet" href="../../css/theme.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/styles.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/crm.css?v=' + CACHE_VERSION + '">');
        document.write('<link rel="stylesheet" href="../../css/glass-cards.css?v=' + CACHE_VERSION + '">');
        document.write('<link rel="stylesheet" href="../../css/table-cards.css?v=' + CACHE_VERSION + '">');
        document.write('<link rel="stylesheet" href="../../css/lms.css?v=' + CACHE_VERSION + '">');
        document.write('<link rel="stylesheet" href="../../css/glassmorphic-modal.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<script src="../../js/theme.js?v=' + CACHE_VERSION + '"><\/script>');</script>
</head>
<body class="dashboard lms-dashboard crm-page">
    <script>document.write('<script src="/js/button-spinner.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <nav class="navbar">
        <div class="navbar-brand">
            <a href="../home.html">
                <img src="../../assets/brand_logo.png" alt="Ragenaizer Logo" class="navbar-logo">
            </a>
        </div>
        <div class="navbar-menu">
            <!-- Navigation links rendered by Navigation.init() -->
        </div>
    </nav>

    <div class="crm-container">
        <!-- Breadcrumb -->
        <div class="lms-breadcrumb">
            <a href="dashboard.html">LMS</a>
            <span class="separator">/</span>
            <span class="current" id="builderBreadcrumb">New Course</span>
        </div>

        <!-- Builder Header -->
        <div class="course-builder-header">
            <div class="course-builder-header-left">
                <a href="dashboard.html" class="lms-back-link">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="15 18 9 12 15 6"/>
                    </svg>
                    Back
                </a>
                <h1 id="builderTitle">New Course</h1>
            </div>
            <div class="course-builder-header-actions">
                <button class="btn-lms-secondary" id="saveDraftBtn" onclick="saveDraft()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                        <polyline points="17 21 17 13 7 13 7 21"/>
                        <polyline points="7 3 7 8 15 8"/>
                    </svg>
                    Save Draft
                </button>
                <button class="btn btn-primary" id="publishBtn" onclick="publishCourse()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                    Publish
                </button>
            </div>
        </div>

        <!-- Builder Tabs -->
        <div class="lms-tabs" id="builderTabs">
            <button class="lms-tab active" data-tab="settings">Settings</button>
            <button class="lms-tab" data-tab="builder-modules">Modules</button>
            <button class="lms-tab" data-tab="preview">Preview</button>
        </div>

        <!-- Tab Content -->
        <div class="lms-tab-content">
            <!-- Settings Tab -->
            <div class="lms-tab-pane active" id="tab-settings">
                <form id="courseSettingsForm" class="course-settings-form">
                    <div class="form-row">
                        <div class="form-group full-width">
                            <label for="courseTitle">Course Title <span class="required">*</span></label>
                            <input type="text" id="courseTitle" class="form-control" placeholder="Enter course title" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group full-width">
                            <label for="courseDescription">Description</label>
                            <textarea id="courseDescription" class="form-control" rows="5" placeholder="Describe what students will learn..."></textarea>
                        </div>
                    </div>
                    <div class="form-row two-col">
                        <div class="form-group">
                            <label for="courseCategory">Category</label>
                            <select id="courseCategory" class="form-select">
                                <option value="">Select category</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="courseDifficulty">Difficulty</label>
                            <select id="courseDifficulty" class="form-select">
                                <option value="beginner">Beginner</option>
                                <option value="intermediate">Intermediate</option>
                                <option value="advanced">Advanced</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row two-col">
                        <div class="form-group">
                            <label for="courseThumbnail">Thumbnail URL</label>
                            <input type="url" id="courseThumbnail" class="form-control" placeholder="https://example.com/image.jpg">
                        </div>
                        <div class="form-group">
                            <label for="courseDuration">Estimated Duration (hours)</label>
                            <input type="number" id="courseDuration" class="form-control" min="0" step="0.5" placeholder="e.g. 10">
                        </div>
                    </div>
                    <div class="form-row two-col">
                        <div class="form-group">
                            <label>Enrollment Type</label>
                            <div class="radio-group">
                                <label class="radio-label">
                                    <input type="radio" name="enrollmentType" value="open" checked> Open
                                </label>
                                <label class="radio-label">
                                    <input type="radio" name="enrollmentType" value="approval"> Requires Approval
                                </label>
                                <label class="radio-label">
                                    <input type="radio" name="enrollmentType" value="invite_only"> Invite Only
                                </label>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="coursePassingScore">Passing Score (%)</label>
                            <input type="number" id="coursePassingScore" class="form-control" min="0" max="100" value="70" placeholder="70">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group full-width">
                            <label for="courseTags">Tags (comma-separated)</label>
                            <input type="text" id="courseTags" class="form-control" placeholder="e.g. onboarding, compliance, leadership">
                        </div>
                    </div>
                </form>
            </div>

            <!-- Modules Tab -->
            <div class="lms-tab-pane" id="tab-builder-modules">
                <div class="builder-modules-header">
                    <h3>Course Modules</h3>
                    <button class="btn btn-primary" onclick="addModule()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        Add Module
                    </button>
                </div>
                <div class="builder-modules-list" id="builderModulesList">
                    <div class="builder-empty-state">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <rect x="3" y="3" width="7" height="7"/>
                            <rect x="14" y="3" width="7" height="7"/>
                            <rect x="14" y="14" width="7" height="7"/>
                            <rect x="3" y="14" width="7" height="7"/>
                        </svg>
                        <p>No modules yet. Click "Add Module" to start building your course.</p>
                    </div>
                </div>
            </div>

            <!-- Preview Tab -->
            <div class="lms-tab-pane" id="tab-preview">
                <div class="builder-preview" id="builderPreview">
                    <div class="builder-preview-placeholder">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <p>Save your course settings and add modules to see a preview.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Lesson Editor Modal -->
    <div class="modal-overlay" id="lessonEditorModal" style="display:none;">
        <div class="modal-dialog lms-modal-dialog">
            <div class="modal-header">
                <h3 id="lessonEditorTitle">Add Lesson</h3>
                <button class="modal-close" onclick="closeLessonEditor()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="lessonEditorForm">
                    <input type="hidden" id="lessonEditId">
                    <input type="hidden" id="lessonEditModuleId">
                    <div class="form-group">
                        <label for="lessonEditTitle">Lesson Title <span class="required">*</span></label>
                        <input type="text" id="lessonEditTitle" class="form-control" placeholder="Enter lesson title" required>
                    </div>
                    <div class="form-group">
                        <label>Content Type</label>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="lessonContentType" value="video" checked onchange="toggleLessonContentField()"> Video
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="lessonContentType" value="document" onchange="toggleLessonContentField()"> Document
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="lessonContentType" value="text" onchange="toggleLessonContentField()"> Text
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="lessonContentType" value="quiz" onchange="toggleLessonContentField()"> Quiz
                            </label>
                        </div>
                    </div>
                    <div class="form-group" id="lessonContentUrlGroup">
                        <label for="lessonEditContentUrl">Content URL</label>
                        <input type="url" id="lessonEditContentUrl" class="form-control" placeholder="https://example.com/video.mp4">
                    </div>
                    <div class="form-group" id="lessonContentTextGroup" style="display:none;">
                        <label for="lessonEditContentText">Content</label>
                        <textarea id="lessonEditContentText" class="form-control" rows="6" placeholder="Enter lesson content..."></textarea>
                    </div>
                    <div class="form-row two-col">
                        <div class="form-group">
                            <label for="lessonEditDuration">Duration (minutes)</label>
                            <input type="number" id="lessonEditDuration" class="form-control" min="0" placeholder="e.g. 15">
                        </div>
                        <div class="form-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="lessonEditMandatory" checked>
                                Mandatory
                            </label>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-lms-secondary" onclick="closeLessonEditor()">Cancel</button>
                <button class="btn btn-primary" onclick="saveLessonEditor()">Save Lesson</button>
            </div>
        </div>
    </div>

    <script>
        document.write('<script src="../../js/config.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/api.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/navigation.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/lms/lms-notifications.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/toast.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/lms/course-builder.js?v=' + CACHE_VERSION + '"><\/script>');
    </script>
    <!-- AI Copilot Widget -->
    <script>document.write('<script src="../../embed/widget.js?v=' + CACHE_VERSION + '" data-mode="copilot" data-service="lms" data-title="LMS Assistant"><\/script>');</script>
</body>
</html>
