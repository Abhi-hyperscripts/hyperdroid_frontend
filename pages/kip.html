<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Cookie Consent & Analytics -->
    <script src="/js/cookie-consent.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=2">
    <title>KIP — Knowledge Intelligence Platform | Ragenaizer</title>
    <meta name="description" content="KIP delivers AI-curated business news, technology updates, startup funding signals, and market intelligence. Real-time news aggregation with AI-generated summaries, category filtering, and business signal detection.">

    <!-- SEO Meta Tags -->
    <meta name="keywords" content="AI news aggregation, business news, technology news, startup funding, market intelligence, AI-curated news, business signals, IPO news, acquisition news, real-time news, India news, global news, finance news, sports news, science news, health news">
    <meta name="author" content="Ragenaizer">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://ragenaizer.com/pages/kip.html">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="KIP — Knowledge Intelligence Platform">
    <meta property="og:url" content="https://ragenaizer.com/pages/kip.html">
    <meta property="og:title" content="KIP — Knowledge Intelligence Platform">
    <meta property="og:description" content="AI-curated business news with signal detection. Funding, acquisitions, IPOs, regulations, hiring, partnerships.">
    <meta property="og:image" content="https://ragenaizer.com/assets/og-news.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@ragenaizer">
    <meta name="twitter:title" content="KIP — Knowledge Intelligence Platform">
    <meta name="twitter:description" content="AI-curated business news with signal detection. Funding, acquisitions, IPOs, regulations, hiring, partnerships.">
    <meta name="twitter:image" content="https://ragenaizer.com/assets/og-news.png">

    <meta name="theme-color" content="#0f1118">

    <!-- Schema: NewsMediaOrganization -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "NewsMediaOrganization",
        "name": "KIP — Knowledge Intelligence Platform",
        "url": "https://ragenaizer.com/pages/kip.html",
        "logo": "https://ragenaizer.com/assets/brand_logo.png",
        "description": "AI-powered news aggregation with business signal detection and market intelligence.",
        "sameAs": ["https://twitter.com/ragenaizer"]
    }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Electrolize&display=swap" rel="stylesheet">
    <script>window.CACHE_VERSION = Date.now();</script>
    <script>document.write('<script src="../js/sw-version.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script src="/js/sw-update.js"></script>
    <script>document.write('<link rel="stylesheet" href="../css/news.css?v=' + CACHE_VERSION + '">');</script>
</head>
<body class="nw-page nw-dark">

    <!-- Mobile Slide Menu -->
    <div class="nw-menu-overlay" id="menuOverlay" onclick="toggleMobileMenu()"></div>
    <aside class="nw-slide-menu" id="slideMenu">
        <div class="nw-slide-header">
            <span class="nw-slide-title">Filters</span>
            <button class="nw-slide-close" onclick="toggleMobileMenu()">&times;</button>
        </div>
        <div class="nw-slide-body">
            <div class="nw-slide-section">
                <label class="nw-slide-label">COUNTRY</label>
                <select class="nw-filter-select nw-slide-select" id="countryFilterMobile" onchange="syncFilter('country', this.value)">
                    <option value="">All Countries</option>
                    <option value="IN">India</option>
                    <option value="US">United States</option>
                    <option value="GB">United Kingdom</option>
                    <option value="CN">China</option>
                    <option value="AE">UAE</option>
                </select>
            </div>
            <div class="nw-slide-section">
                <label class="nw-slide-label">SIGNAL</label>
                <select class="nw-filter-select nw-slide-select" id="signalFilterMobile" onchange="syncFilter('signal', this.value)">
                    <option value="">All Signals</option>
                    <option value="funding">Funding</option>
                    <option value="acquisition">Acquisition</option>
                    <option value="ipo">IPO</option>
                    <option value="regulation">Regulation</option>
                    <option value="product_launch">Product Launch</option>
                    <option value="partnership">Partnership</option>
                    <option value="hiring">Hiring</option>
                    <option value="expansion">Expansion</option>
                </select>
            </div>
            <button class="nw-clear-btn nw-slide-clear" onclick="clearFilters(); toggleMobileMenu();">Clear filters</button>
            <hr class="nw-slide-divider">
            <label class="nw-slide-label">CATEGORIES</label>
            <div class="nw-slide-cats" id="mobileCategoryBar"></div>
            <hr class="nw-slide-divider">
            <div class="nw-slide-theme">
                <label class="nw-slide-label">THEME</label>
                <button class="nw-slide-theme-btn" id="mobileThemeToggle" onclick="toggleTheme()">
                    <span class="nw-slide-theme-icon" id="mobileThemeIcon">&#9790;</span>
                    <span id="mobileThemeLabel">Light Mode</span>
                </button>
            </div>
        </div>
    </aside>

    <!-- Header -->
    <header class="nw-header">
        <button class="nw-hamburger" id="hamburgerBtn" onclick="toggleMobileMenu()">
            <span></span><span></span><span></span>
        </button>
        <a href="/index.html" class="nw-brand">
            <span class="nw-kip-mark">KIP</span>
        </a>
        <div class="nw-header-right">
            <div class="nw-live">
                <span class="nw-live-dot"></span>
                LIVE
            </div>
            <span class="nw-date-display" id="liveTime"></span>
            <button class="nw-theme-btn" id="themeToggle" onclick="toggleTheme()">Light</button>
        </div>
    </header>

    <!-- Filters -->
    <div class="nw-filters">
        <div class="nw-filter-group">
            <label>COUNTRY</label>
            <select class="nw-filter-select" id="countryFilter" onchange="filterCountry()">
                <option value="">All Countries</option>
                <option value="IN">India</option>
                <option value="US">United States</option>
                <option value="GB">United Kingdom</option>
                <option value="CN">China</option>
                <option value="AE">UAE</option>
            </select>
        </div>
        <div class="nw-filter-group">
            <label>SIGNAL</label>
            <select class="nw-filter-select" id="signalFilter" onchange="filterSignal()">
                <option value="">All Signals</option>
                <option value="funding">Funding</option>
                <option value="acquisition">Acquisition</option>
                <option value="ipo">IPO</option>
                <option value="regulation">Regulation</option>
                <option value="product_launch">Product Launch</option>
                <option value="partnership">Partnership</option>
                <option value="hiring">Hiring</option>
                <option value="expansion">Expansion</option>
            </select>
        </div>
        <button class="nw-clear-btn" onclick="clearFilters()">Clear filters</button>
        <span class="nw-article-count" id="articleCount"></span>
    </div>

    <!-- Categories -->
    <div class="nw-categories" id="categoryBar">
        <button class="nw-cat active" onclick="filterCategory(this, '')">All</button>
    </div>

    <!-- Content -->
    <div class="nw-content">
        <!-- Loading -->
        <div class="nw-loading" id="loadingState">
            <div class="nw-spinner"></div>
            <p>Loading news...</p>
        </div>

        <!-- Empty -->
        <div class="nw-empty" id="emptyState">
            <p style="font-size:1.2rem;margin-bottom:8px;">No articles found</p>
            <p>Try changing your filters or check back soon</p>
        </div>

        <!-- Articles -->
        <div id="newsGrid"></div>

        <!-- Load More -->
        <div class="nw-load-more" id="loadMoreWrap">
            <button class="nw-load-more-btn" onclick="loadMore()">Load More</button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="nw-footer">
        <div class="nw-footer-top">
            <img src="../assets/brand_logo.png" alt="Ragenaizer" class="nw-footer-logo">
            <span class="nw-footer-sep"></span>
            <span class="nw-footer-brand">KIP</span>
        </div>
        <div class="nw-footer-sub">Knowledge Intelligence Platform by Ragenaizer</div>
        <div class="nw-footer-meta">
            <span>Real-time news intelligence & signal detection</span>
            <span class="nw-footer-dot"></span>
            <span>&copy; 2026 Ragenaizer. All rights reserved.</span>
        </div>
    </footer>

    <script src="/js/config.js"></script>
    <script>document.write('<script src="../js/news/news.js?v=' + CACHE_VERSION + '"><\/script>');</script>
</body>
</html>
