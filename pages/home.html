<body class="dashboard">
    <script>document.write('<script src="/js/button-spinner.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <nav class="navbar">
        <div class="navbar-brand">
            <a href="home.html">
                <img src="../assets/brand_logo.png" alt="Ragenaizer Logo" class="navbar-logo">
            </a>
        </div>
        <div class="navbar-menu">
            <!-- Navigation links rendered by Navigation.init() -->

    <div class="home-content">
        <header class="home-hero">
            <p class="home-eyebrow" id="orgEyebrow">Workspace</p>
            <h1 class="home-title">Good <span id="timeGreeting">morning</span>, <span id="userName">there</span>.</h1>
            <p class="home-sub" id="homeSub"><span class="pulse"></span><span id="homeSubText">Checking your services…</span></p>
            <div class="home-search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>

        <!-- Live overview — rendered only when Accounts is licensed and reachable -->
        <section class="home-overview" id="homeOverview" hidden aria-label="Business overview"></section>

        <!-- Groups + module rows rendered from the MODULES registry -->
        <main id="moduleGroups"></main>
    </div>

    <script>
        document.write('<script src="../js/config.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../js/api.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../js/navigation.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../js/toast.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../js/firebase-init.js?v=' + CACHE_VERSION + '"><\/script>');
    </script>
    <script>
        // ═══════════════════════════════════════════════════════════════════
        // Module registry — single source of truth for the launcher.
        // Visibility = role AND license (same rules as before the redesign):
        //   - SUPERADMIN passes every role check but does NOT bypass licensing
        //     (sub-tenant superadmins only see what their tenant pays for; the
        //     platform root's license already includes every service).
        //   - admin (per-tenant dashboard) is a built-in: no license required.
        //   - A token with no licensed_services claim fails OPEN (legacy).
        // ═══════════════════════════════════════════════════════════════════
        const ICONS = {
            vision: '<polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>',
            drive: '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
            chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
            email: '<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>',
            hrms: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
            crm: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/>',
            research: '<path d="M21 21H4.6c-.56 0-.84 0-1.05-.11a1 1 0 0 1-.44-.44C3 20.24 3 19.96 3 19.4V3"/><path d="M7 14l4-4 4 4 6-6"/><path d="M17 8h4v4"/>',
            pms: '<path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 14l2 2 4-4"/>',
            procurement: '<path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>',
            lms: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M8 7h8M8 11h6"/>',
            accounts: '<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1z"/><path d="M8 10h8"/><path d="M8 14h4"/>',
            paymentplans: '<rect x="2" y="6" width="20" height="14" rx="2"/><line x1="2" y1="11" x2="22" y2="11"/><path d="M7 16h2"/><path d="M12 16h6"/>',
            news: '<path d="M19 20H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v1m2 13a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2z"/><line x1="7" y1="8" x2="13" y2="8"/><line x1="7" y1="12" x2="11" y2="12"/><line x1="7" y1="16" x2="13" y2="16"/>',
            admin: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>'
        };

        const GROUPS = [
            { id: 'money', label: 'Money', blurb: 'Billing, books, purchasing and collections.' },
            { id: 'people', label: 'People', blurb: 'Customers, team and growth.' },
            { id: 'work', label: 'Work', blurb: 'Projects, files and analysis.' },
            { id: 'comms', label: 'Communication', blurb: 'Talk to your team and customers.' },
            { id: 'adminGroup', label: 'Administration', blurb: 'Keep the workspace healthy.' }
        ];

        const MODULES = [
            { id: 'accounts', group: 'money', role: 'ACCOUNTS_USER', service: 'Accounts', color: '#0e9f6e',
              title: 'Accounts', desc: 'Invoices, ledger, GST, inventory and banking', href: 'accounts/dashboard.html', health: 'accounts' },
            { id: 'paymentplans', group: 'money', role: 'PAYMENTPLANS_USER', service: 'PaymentPlans', color: '#b45309',
              title: 'Payment Plans', desc: 'Installments, reminders and recurring collections', href: 'payment-plans/dashboard.html', health: 'paymentplans' },
            { id: 'procurement', group: 'money', role: 'PROCUREMENT_USER', service: 'Procurement', color: '#6d5bd0',
              title: 'Procurement', desc: 'Vendors, quote comparison and purchase orders', href: 'procurement/dashboard.html', health: 'procurement' },

            { id: 'crm', group: 'people', role: 'CRM_USER', service: 'CRM', color: '#2563eb',
              title: 'CRM', desc: 'Leads, deals and customer conversations', href: 'crm/dashboard.html', health: 'crm' },
            { id: 'hrms', group: 'people', role: 'HRMS_USER', service: 'HRMS', color: '#be3980',
              title: 'HRMS', desc: 'Attendance, leave and payroll', href: 'hrms/dashboard.html', health: 'hrms' },
            { id: 'lms', group: 'people', role: 'LMS_USER', service: 'LMS', color: '#9333ea',
              title: 'Learning', desc: 'Courses, training and certifications', href: 'lms/dashboard.html', health: 'lms' },

            { id: 'pms', group: 'work', role: 'PMS_USER', service: 'PMS', color: '#0891b2',
              title: 'Projects', desc: 'Clients, tasks, time tracking and timesheets', href: 'pms/dashboard.html', health: 'pms' },
            { id: 'drive', group: 'work', role: 'DRIVE_USER', service: 'Drive', color: '#059669',
              title: 'Drive', desc: 'Secure file storage and sharing', href: 'drive/drive.html', health: 'drive' },
            { id: 'research', group: 'work', role: 'RESEARCH_USER', service: 'Research', color: '#7c3aed',
              title: 'Research', desc: 'Market research with AI analysis', href: 'research/dashboard.html', health: 'research' },

            { id: 'vision', group: 'comms', role: 'VISION_USER', service: 'Vision', color: '#0e7490',
              title: 'Meetings', desc: 'Video calls with recording and captions', href: 'vision/dashboard.html', health: 'vision' },
            { id: 'email', group: 'comms', role: 'EMAILSERVICE_USER', service: 'EmailService', color: '#c2680c',
              title: 'Email', desc: 'Shared mailboxes with real-time sync', href: 'email/inbox.html', health: 'email' },
            { id: 'chat', group: 'comms', role: 'CHAT_USER', service: 'Chat', color: '#db2777',
              title: 'Chat', desc: 'Direct and group messaging', href: 'chat/chat.html', health: 'chat' },

            { id: 'news', group: 'adminGroup', role: 'SUPERADMIN', service: 'KIP', color: '#64748b',
              title: 'KIP', desc: 'News intelligence and business signals', href: 'news/admin.html', tag: 'Admin' },
            { id: 'admin', group: 'adminGroup', role: 'SUPERADMIN', service: null, color: '#64748b',
              title: 'Admin Panel', desc: 'Users, roles and service health', href: 'auth/dashboard.html', tag: 'Admin' }
        ];

        let healthTotal = 0;
        let healthDone = 0;
        let healthOnline = 0;

        document.addEventListener('DOMContentLoaded', () => {
            if (!api.isAuthenticated()) {
                window.location.href = '/index.html';
                return;
            }

            Navigation.init('home', '');

            const accessible = getAccessibleModules();

            // Single-module tenants skip the launcher entirely (preserved behavior)
            if (accessible.length === 1) {
                window.location.href = accessible[0].href;
                return;
            }

            initializeHero(accessible);
            renderGroups(accessible);
            checkModuleStatus(accessible);
            setupSearch();
            loadOverview(accessible);

            // Firebase push notifications
            if (typeof ensureFcmTokenRegistered === 'function') {
                ensureFcmTokenRegistered();
                setupForegroundMessageHandler();
            } else if (typeof requestNotificationPermission === 'function') {
                requestNotificationPermission();
                if (typeof setupForegroundMessageHandler === 'function') {
                    setupForegroundMessageHandler();
                }
            }
        });

        function getAccessibleModules() {
            const user = api.getUser();
            if (!user || !user.roles) return [];

            let licensedServices = null;
            const orgInfo = getOrganizationInfo();
            if (orgInfo && orgInfo.licensedServices) {
                licensedServices = orgInfo.licensedServices;
            }

            return MODULES.filter(m => {
                const hasRole = user.roles.includes('SUPERADMIN') || user.roles.includes(m.role);
                // service === null → built-in tool (admin panel), no license needed.
                // Missing licensed_services claim → legacy token, fail open.
                const isLicensed = m.service === null ||
                                   !licensedServices ||
                                   licensedServices.includes(m.service);
                return hasRole && isLicensed;
            });
        }

        function initializeHero(accessible) {
            const user = api.getUser();
            if (user) {
                document.getElementById('userName').textContent = user.firstName || 'there';
            }

            const hour = new Date().getHours();
            document.getElementById('timeGreeting').textContent =
                hour < 12 ? 'morning' : hour < 17 ? 'afternoon' : 'evening';

            const orgInfo = getOrganizationInfo();
            const orgName = orgInfo && (orgInfo.organizationName || orgInfo.tenantName);
            document.getElementById('orgEyebrow').textContent =
                orgName ? orgName + ' · Workspace' : 'Workspace';

            updateSubline(accessible);
        }

        function updateSubline(accessible) {
            const dateStr = new Date().toLocaleDateString('en-IN',
                { weekday: 'long', day: 'numeric', month: 'long' });
            const checked = accessible.filter(m => m.health).length;
            let statusPart = 'checking services…';
            if (healthDone >= healthTotal && healthTotal > 0) {
                statusPart = healthOnline + ' of ' + healthTotal + ' services running';
            }
            document.getElementById('homeSubText').textContent =
                dateStr + (checked > 0 ? ' · ' + statusPart : '');
        }

        function renderGroups(accessible) {
            const container = document.getElementById('moduleGroups');
            container.innerHTML = '';

            GROUPS.forEach(group => {
                const mods = accessible.filter(m => m.group === group.id);
                if (mods.length === 0) return; // unlicensed groups collapse entirely

                const section = document.createElement('section');
                section.className = 'home-group';
                section.dataset.groupId = group.id;

                const label = document.createElement('div');
                label.className = 'home-group-label';
                label.innerHTML = '<h2></h2><p></p>';
                label.querySelector('h2').textContent = group.label;
                label.querySelector('p').textContent = group.blurb;

                const rows = document.createElement('div');
                rows.className = 'home-rows';

                mods.forEach(m => {
                    const row = document.createElement('a');
                    row.className = 'home-row';
                    row.id = m.id + 'Card';
                    row.href = m.href;
                    row.style.setProperty('--mod-color', m.color);
                    row.dataset.searchText = (m.title + ' ' + m.desc).toLowerCase();

                    const statusHtml = m.health
                        ? '<div class="home-row-status" id="' + m.id + 'Status"><span class="sdot"></span><span>Checking</span></div>'
                        : '<div class="home-row-status online"><span class="sdot"></span><span>Online</span></div>';

                    row.innerHTML =
                        '<div class="home-row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">' + ICONS[m.id] + '</svg></div>' +
                        '<div class="home-row-meta">' +
                            '<div class="home-row-name"><span></span>' + (m.tag ? '<span class="home-tag">' + m.tag + '</span>' : '') + '</div>' +
                            '<div class="home-row-desc"></div>' +
                        '</div>' +
                        statusHtml +
                        '<div class="home-row-arrow">→</div>';

                    row.querySelector('.home-row-name span').textContent = m.title;
                    row.querySelector('.home-row-desc').textContent = m.desc;
                    rows.appendChild(row);
                });

                section.appendChild(label);
                section.appendChild(rows);
                container.appendChild(section);
            });
        }

        function checkModuleStatus(accessible) {
            const toCheck = accessible.filter(m => m.health && CONFIG.endpoints[m.health]);
            healthTotal = toCheck.length;
            healthDone = 0;
            healthOnline = 0;
            toCheck.forEach(m => checkServiceHealth(m, accessible));
        }

        async function checkServiceHealth(module, accessible) {
            const statusEl = document.getElementById(module.id + 'Status');
            const row = document.getElementById(module.id + 'Card');
            const endpoint = CONFIG.endpoints[module.health];

            let online = false;
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);
                const response = await fetch(endpoint + '/health', { signal: controller.signal });
                clearTimeout(timeoutId);
                online = response.ok;
            } catch (e) { /* offline */ }

            healthDone++;
            if (online) healthOnline++;

            if (statusEl) {
                statusEl.className = 'home-row-status' + (online ? ' online' : '');
                statusEl.innerHTML = '<span class="sdot"></span><span>' + (online ? 'Online' : 'Off') + '</span>';
            }
            if (row) row.classList.toggle('offline', !online);

            updateSubline(accessible);
        }

        // ═══ Live overview: real numbers from Accounts, hidden when unreachable ═══
        function formatINR(n) {
            const neg = n < 0;
            const a = Math.abs(n);
            let s;
            if (a >= 1e7) s = '₹' + (a / 1e7).toFixed(2).replace(/\.00$/, '') + 'Cr';
            else if (a >= 1e5) s = '₹' + (a / 1e5).toFixed(2).replace(/\.00$/, '') + 'L';
            else if (a >= 1e3) s = '₹' + (a / 1e3).toFixed(1).replace(/\.0$/, '') + 'k';
            else s = '₹' + Math.round(a).toLocaleString('en-IN');
            return neg ? '−' + s : s;
        }

        async function loadOverview(accessible) {
            if (!accessible.some(m => m.id === 'accounts')) return;
            const base = CONFIG.endpoints.accounts;
            const token = (typeof getAuthToken === 'function') ? getAuthToken() : null;
            if (!base || !token) return;

            const headers = { 'Authorization': 'Bearer ' + token };
            try {
                const [kpiRes, trendRes] = await Promise.all([
                    fetch(base + '/api/accounts/dashboard/kpis', { headers }),
                    fetch(base + '/api/accounts/dashboard/revenue-trend?months=6', { headers })
                ]);
                if (!kpiRes.ok || !trendRes.ok) return;
                const kpis = await kpiRes.json();
                const trend = await trendRes.json();
                renderOverview(kpis, trend);
            } catch (e) { /* Accounts unreachable — overview stays hidden */ }
        }

        function renderOverview(kpis, trend) {
            const el = document.getElementById('homeOverview');
            if (!el) return;

            const stats = [
                { label: 'Cash & bank', raw: kpis.total_liquid || 0, value: formatINR(kpis.total_liquid || 0),
                  hint: '30-day projection ' + formatINR(kpis.projected_balance_30d || 0) },
                { label: 'Receivables due', raw: kpis.ar_outstanding || 0, value: formatINR(kpis.ar_outstanding || 0),
                  hint: (kpis.ar_overdue || 0) > 0
                      ? formatINR(kpis.ar_overdue) + ' overdue · ' + (kpis.ar_open_invoices_count || 0) + ' invoices'
                      : (kpis.ar_open_invoices_count || 0) + ' open invoice' + (kpis.ar_open_invoices_count === 1 ? '' : 's') },
                { label: 'Payables due', raw: kpis.ap_outstanding || 0, value: formatINR(kpis.ap_outstanding || 0),
                  hint: (kpis.ap_open_bills_count || 0) + ' open bill' + (kpis.ap_open_bills_count === 1 ? '' : 's') },
                { label: 'Net profit', raw: kpis.net_profit_ytd || 0, value: formatINR(kpis.net_profit_ytd || 0),
                  hint: kpis.fiscal_year_name || 'this fiscal year' }
            ];

            const chartCard = document.createElement('div');
            chartCard.className = 'home-chart-card';
            chartCard.innerHTML =
                '<div class="home-chart-head">' +
                    '<h2 class="home-chart-title">Revenue vs expenses</h2>' +
                    '<div class="home-chart-legend">' +
                        '<span><span class="swatch" style="background:var(--chart-revenue)"></span>Revenue</span>' +
                        '<span><span class="swatch" style="background:var(--chart-expense)"></span>Expenses</span>' +
                    '</div>' +
                '</div>' +
                '<div class="home-chart-body" id="homeChartBody"></div>' +
                '<div class="home-chart-tip" id="homeChartTip"></div>';
            el.appendChild(chartCard);

            stats.forEach(s => {
                const tile = document.createElement('div');
                tile.className = 'home-stat';
                tile.innerHTML = '<div class="label"></div><div class="value"></div><div class="hint"></div>';
                tile.querySelector('.label').textContent = s.label;
                tile.querySelector('.hint').textContent = s.hint;
                countUp(tile.querySelector('.value'), s.raw, s.value);
                el.appendChild(tile);
            });

            renderTrendChart(trend);
            el.hidden = false;
        }

        // Animate a stat from 0 to its final value (skipped under reduced motion)
        function countUp(node, raw, finalText) {
            const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (reduced || !isFinite(raw) || raw === 0) {
                node.textContent = finalText;
                return;
            }
            const dur = 700;
            const start = performance.now();
            function tick(now) {
                const p = Math.min(1, (now - start) / dur);
                const eased = 1 - Math.pow(1 - p, 3);
                node.textContent = formatINR(raw * eased);
                if (p < 1) requestAnimationFrame(tick);
                else node.textContent = finalText;
            }
            requestAnimationFrame(tick);
        }

        function renderTrendChart(trend) {
            const body = document.getElementById('homeChartBody');
            if (!body || !trend || !trend.length) return;

            const hasData = trend.some(t => (t.revenue || 0) !== 0 || (t.expenses || 0) !== 0);
            if (!hasData) {
                body.innerHTML = '<div class="home-chart-empty">No transactions in the last 6 months yet.</div>';
                return;
            }

            const W = 560, H = 172, padL = 8, padR = 46, padT = 14, padB = 22;
            const iw = W - padL - padR, ih = H - padT - padB;
            const maxVal = Math.max(...trend.map(t => Math.max(t.revenue || 0, t.expenses || 0)));
            const yMax = maxVal * 1.15 || 1;
            const x = i => padL + (trend.length === 1 ? iw / 2 : (i / (trend.length - 1)) * iw);
            const y = v => padT + ih - (v / yMax) * ih;

            // Monotone-cubic smoothing (no overshoot below the baseline on spikes)
            function smoothPathOf(key) {
                const pts = trend.map((t, i) => [x(i), y(t[key] || 0)]);
                if (pts.length < 3) {
                    return pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
                }
                const n = pts.length;
                const dx = [], dy = [], m = [];
                for (let i = 0; i < n - 1; i++) {
                    dx.push(pts[i + 1][0] - pts[i][0]);
                    dy.push(pts[i + 1][1] - pts[i][1]);
                    m.push(dy[i] / dx[i]);
                }
                const t = [m[0]];
                for (let i = 1; i < n - 1; i++) {
                    t.push((m[i - 1] * m[i] <= 0) ? 0 : (m[i - 1] + m[i]) / 2);
                }
                t.push(m[n - 2]);
                for (let i = 0; i < n - 1; i++) {
                    if (m[i] === 0) { t[i] = 0; t[i + 1] = 0; }
                    else {
                        const a = t[i] / m[i], b = t[i + 1] / m[i];
                        const s = a * a + b * b;
                        if (s > 9) { const tau = 3 / Math.sqrt(s); t[i] = tau * a * m[i]; t[i + 1] = tau * b * m[i]; }
                    }
                }
                let d = 'M' + pts[0][0].toFixed(1) + ',' + pts[0][1].toFixed(1);
                for (let i = 0; i < n - 1; i++) {
                    const h = dx[i];
                    d += ' C' + (pts[i][0] + h / 3).toFixed(1) + ',' + (pts[i][1] + t[i] * h / 3).toFixed(1) +
                         ' ' + (pts[i + 1][0] - h / 3).toFixed(1) + ',' + (pts[i + 1][1] - t[i + 1] * h / 3).toFixed(1) +
                         ' ' + pts[i + 1][0].toFixed(1) + ',' + pts[i + 1][1].toFixed(1);
                }
                return d;
            }
            const pathOf = smoothPathOf;
            const baseline = (padT + ih).toFixed(1);
            const areaPath = smoothPathOf('revenue') +
                ' L' + x(trend.length - 1).toFixed(1) + ',' + baseline +
                ' L' + x(0).toFixed(1) + ',' + baseline + ' Z';

            // Recessive grid: 3 horizontal lines, muted month labels
            let grid = '';
            for (let g = 1; g <= 3; g++) {
                const gy = (padT + ih - (g / 3) * ih).toFixed(1);
                grid += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (W - padR) + '" y2="' + gy +
                        '" stroke="var(--home-line)" stroke-width="1"/>';
            }
            const labels = trend.map((t, i) =>
                '<text x="' + x(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle" ' +
                'font-size="10" fill="var(--text-muted)" font-family="var(--font-family)">' +
                (t.label || '').split(' ')[0] + '</text>').join('');

            const last = trend.length - 1;
            // Anchor the direct label to the latest month with activity, not a
            // just-started zero month (an endpoint reading "₹0" misleads).
            let lastActive = last;
            for (let i = last; i >= 0; i--) {
                if ((trend[i].revenue || 0) !== 0 || (trend[i].expenses || 0) !== 0) { lastActive = i; break; }
            }
            const endDot = (key, color) =>
                '<circle cx="' + x(lastActive).toFixed(1) + '" cy="' + y(trend[lastActive][key] || 0).toFixed(1) +
                '" r="3" fill="' + color + '"/>';
            const endLabel = (key) => {
                const v = trend[lastActive][key] || 0;
                if (v === 0) return '';
                const lx = Math.min(x(lastActive) + 7, W - padR + 4);
                return '<text x="' + lx.toFixed(1) + '" y="' + (y(v) + 3.5).toFixed(1) +
                    '" font-size="10.5" fill="var(--text-secondary)" font-family="var(--font-family-mono)">' +
                    formatINR(v) + '</text>';
            };

            body.innerHTML =
                '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" ' +
                'aria-label="Monthly revenue and expenses, last ' + trend.length + ' months">' +
                '<defs><linearGradient id="homeRevFill" x1="0" y1="0" x2="0" y2="1">' +
                '<stop offset="0" stop-color="var(--chart-revenue)" stop-opacity="0.22"/>' +
                '<stop offset="1" stop-color="var(--chart-revenue)" stop-opacity="0"/>' +
                '</linearGradient></defs>' +
                grid +
                '<path d="' + areaPath + '" fill="url(#homeRevFill)" stroke="none"/>' +
                '<path class="draw-line" d="' + pathOf('revenue') + '" fill="none" stroke="var(--chart-revenue)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
                '<path class="draw-line" d="' + pathOf('expenses') + '" fill="none" stroke="var(--chart-expense)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
                endDot('revenue', 'var(--chart-revenue)') + endDot('expenses', 'var(--chart-expense)') +
                endLabel('revenue') +
                '<line id="homeChartCross" x1="0" y1="' + padT + '" x2="0" y2="' + (padT + ih) +
                '" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>' +
                labels +
                '</svg>' +
                buildTrendTable(trend);

            // Draw-in animation (skipped under reduced motion)
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                body.querySelectorAll('.draw-line').forEach((p, i) => {
                    const len = p.getTotalLength();
                    p.style.strokeDasharray = len;
                    p.style.strokeDashoffset = len;
                    p.style.transition = 'stroke-dashoffset 0.9s cubic-bezier(0.22, 1, 0.36, 1) ' + (0.15 + i * 0.12) + 's';
                    requestAnimationFrame(() => requestAnimationFrame(() => { p.style.strokeDashoffset = '0'; }));
                });
            }

            // Hover: nearest-month crosshair + tooltip
            const svg = body.querySelector('svg');
            const cross = body.querySelector('#homeChartCross');
            const tip = document.getElementById('homeChartTip');

            svg.addEventListener('mousemove', (e) => {
                const rect = svg.getBoundingClientRect();
                const relX = (e.clientX - rect.left) / rect.width * W;
                let idx = 0, best = Infinity;
                trend.forEach((t, i) => {
                    const d = Math.abs(x(i) - relX);
                    if (d < best) { best = d; idx = i; }
                });
                cross.style.display = '';
                cross.setAttribute('x1', x(idx));
                cross.setAttribute('x2', x(idx));
                tip.style.display = 'block';
                tip.style.left = (x(idx) / W * rect.width) + 'px';
                tip.style.top = '30px';
                tip.innerHTML = '<b></b><br>Revenue <b class="tr"></b><br>Expenses <b class="te"></b>';
                tip.querySelector('b').textContent = trend[idx].label || '';
                tip.querySelector('.tr').textContent = formatINR(trend[idx].revenue || 0);
                tip.querySelector('.te').textContent = formatINR(trend[idx].expenses || 0);
            });
            svg.addEventListener('mouseleave', () => {
                cross.style.display = 'none';
                tip.style.display = 'none';
            });
        }

        function buildTrendTable(trend) {
            let rows = '';
            trend.forEach(t => {
                rows += '<tr><th scope="row">' + (t.label || '') + '</th><td>' +
                        formatINR(t.revenue || 0) + '</td><td>' + formatINR(t.expenses || 0) + '</td></tr>';
            });
            return '<table class="sr-only"><caption>Monthly revenue and expenses</caption>' +
                   '<thead><tr><th scope="col">Month</th><th scope="col">Revenue</th><th scope="col">Expenses</th></tr></thead>' +
                   '<tbody>' + rows + '</tbody></table>';
        }

        function setupSearch() {
            const input = document.getElementById('moduleSearch');
            if (!input) return;

            input.addEventListener('input', () => {
                const q = input.value.trim().toLowerCase();
                document.querySelectorAll('.home-row').forEach(row => {
                    const hit = !q || (row.dataset.searchText || '').includes(q);
                    row.classList.toggle('filtered-out', !hit);
                });
                document.querySelectorAll('.home-group').forEach(group => {
                    const anyVisible = group.querySelector('.home-row:not(.filtered-out)');
                    group.classList.toggle('filtered-out', !anyVisible);
                });
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    input.value = '';
                    input.dispatchEvent(new Event('input'));
                    input.blur();
                } else if (e.key === 'Enter') {
                    const first = document.querySelector('.home-row:not(.filtered-out)');
                    if (first) first.click();
                }
            });

            document.addEventListener('keydown', (e) => {
                if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
                    e.preventDefault();
                    input.focus();
                }
            });
        }
    </script>
</body>
</html>
