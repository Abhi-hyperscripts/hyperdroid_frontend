        //   - admin (per-tenant dashboard) is a built-in: no license required.
        //   - A token with no licensed_services claim fails OPEN (legacy).

            { id: 'paymentplans', group: 'money', role: 'PAYMENTPLANS_USER', service: 'PaymentPlans', color: '#d97706',

            { id: 'chat', group: 'comms', role: 'CHAT_USER', service: 'Chat', color: '#f43f5e',

            { id: 'news', group: 'adminGroup', role: 'SUPERADMIN', service: 'KIP', color: '#94a3b8',
              title: 'KIP', desc: 'News intelligence and business signals', href: 'news/admin.html', tag: 'Admin' },
            { id: 'admin', group: 'adminGroup', role: 'SUPERADMIN', service: null, color: '#94a3b8',
              title: 'Admin Panel', desc: 'Users, roles and service health', href: 'auth/dashboard.html', tag: 'Admin' }
        ];

        let healthTotal = 0, healthDone = 0, healthOnline = 0;

        document.addEventListener('DOMContentLoaded', () => {
            if (!api.isAuthenticated()) {
                window.location.href = '/index.html';
                return;
            }

            Navigation.init('home', '');

            const accessible = getAccessibleModules();

            // Single-module tenants skip the launcher entirely (preserved behavior)
            if (accessible.length === 1) {
                window.location.href = accessible[0].href;
                return;
            }

            initializeHero(accessible);
            startClock();
            renderGroups(accessible);
            checkModuleStatus(accessible);
            setupSearch();
            loadPulse(accessible);

            // Firebase push notifications
            if (typeof ensureFcmTokenRegistered === 'function') {
                ensureFcmTokenRegistered();
                setupForegroundMessageHandler();
            } else if (typeof requestNotificationPermission === 'function') {
                requestNotificationPermission();
                if (typeof setupForegroundMessageHandler === 'function') {
                    setupForegroundMessageHandler();
                }
            }
        });

        function getAccessibleModules() {
            const user = api.getUser();
            if (!user || !user.roles) return [];

            let licensedServices = null;
            const orgInfo = getOrganizationInfo();
            if (orgInfo && orgInfo.licensedServices) {
                licensedServices = orgInfo.licensedServices;
            }

            return MODULES.filter(m => {
                const hasRole = user.roles.includes('SUPERADMIN') || user.roles.includes(m.role);
                const isLicensed = m.service === null ||
                                   !licensedServices ||
                                   licensedServices.includes(m.service);
                return hasRole && isLicensed;
            });
        }

        function initializeHero(accessible) {
            const user = api.getUser();
            if (user) {
                document.getElementById('userName').textContent = user.firstName || 'there';
            }

            const hour = new Date().getHours();
            document.getElementById('timeGreeting').textContent =
                hour < 12 ? 'morning' : hour < 17 ? 'afternoon' : 'evening';

            const orgInfo = getOrganizationInfo();
            const orgName = orgInfo && (orgInfo.organizationName || orgInfo.tenantName);
            document.getElementById('orgEyebrow').textContent =
                orgName ? orgName + ' · Workspace' : 'Workspace';

            updateSubline(accessible);
        }

        function startClock() {
            const el = document.getElementById('mcClock');
            function tick() {
                const now = new Date();
                const hh = String(now.getHours()).padStart(2, '0');
                const mm = String(now.getMinutes()).padStart(2, '0');
                const ss = String(now.getSeconds()).padStart(2, '0');
                el.innerHTML = hh + ':' + mm + '<span class="sec">' + ss + '</span>';
            }
            tick();
            setInterval(tick, 1000);
        }

        function updateSubline(accessible) {
            const dateStr = new Date().toLocaleDateString('en-IN',
                { weekday: 'long', day: 'numeric', month: 'long' });
            const checked = accessible.filter(m => m.health).length;
            let statusPart = 'checking services…';
            if (healthDone >= healthTotal && healthTotal > 0) {
                statusPart = healthOnline + ' of ' + healthTotal + ' services running';
            }
            document.getElementById('homeSubText').textContent =
                dateStr + (checked > 0 ? ' · ' + statusPart : '');
        }

        function renderGroups(accessible) {
            const container = document.getElementById('moduleGroups');
            container.innerHTML = '';

            GROUPS.forEach(group => {
                const mods = accessible.filter(m => m.group === group.id);
                if (mods.length === 0) return; // unlicensed groups collapse entirely

                const section = document.createElement('section');
                section.className = 'home-group';
                section.dataset.groupId = group.id;

                const label = document.createElement('div');
                label.className = 'home-group-label';
                label.innerHTML = '<h2></h2><p></p>';
                label.querySelector('h2').textContent = group.label;
                label.querySelector('p').textContent = group.blurb;

                const rows = document.createElement('div');
                rows.className = 'home-rows';

                mods.forEach(m => {
                    const row = document.createElement('a');
                    row.className = 'home-row';
                    row.id = m.id + 'Card';
                    row.href = m.href;
                    row.style.setProperty('--mod-color', m.color);
                    row.dataset.searchText = (m.title + ' ' + m.desc).toLowerCase();
                    if (!m.health) row.classList.add('online'); // built-ins ride on Auth

                    row.innerHTML =
                        '<div class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">' + ICONS[m.id] + '</svg></div>' +
                        '<div class="row-mid">' +
                            '<div class="row-name"><span></span>' + (m.tag ? '<span class="home-tag">' + m.tag + '</span>' : '') + '</div>' +
                            '<div class="row-desc"></div>' +
                        '</div>' +
                        '<div class="row-status">' +
                            '<span class="sdot"></span><span id="' + m.id + 'Status">' + (m.health ? 'Checking' : 'Online') + '</span>' +
                        '</div>' +
                        '<div class="row-arrow">→</div>';

                    row.querySelector('.row-name span').textContent = m.title;
                    row.querySelector('.row-desc').textContent = m.desc;
                    rows.appendChild(row);
                });

                section.appendChild(label);
                section.appendChild(rows);
                container.appendChild(section);
            });
        }

        function checkModuleStatus(accessible) {
            const toCheck = accessible.filter(m => m.health && CONFIG.endpoints[m.health]);
            healthTotal = toCheck.length;
            healthDone = 0;
            healthOnline = 0;
            toCheck.forEach(m => checkServiceHealth(m, accessible));
        }

        async function checkServiceHealth(module, accessible) {
            const app = document.getElementById(module.id + 'Card');
            const srStatus = document.getElementById(module.id + 'Status');
            const endpoint = CONFIG.endpoints[module.health];

            let online = false;
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);
                const response = await fetch(endpoint + '/health', { signal: controller.signal });
                clearTimeout(timeoutId);
                online = response.ok;
            } catch (e) { /* offline */ }

            healthDone++;
            if (online) healthOnline++;

            if (app) {
                app.classList.toggle('online', online);
                app.classList.toggle('offline', !online);
            }
            if (srStatus) srStatus.textContent = online ? 'Online' : 'Off';
            updateSubline(accessible);
        }

        // ═══ Business pulse: chips + full-bleed ambient revenue band ═══
        function formatINR(n) {
            const neg = n < 0;
            const a = Math.abs(n);
            let s;
            if (a >= 1e7) s = '₹' + (a / 1e7).toFixed(2).replace(/\.00$/, '') + 'Cr';
            else if (a >= 1e5) s = '₹' + (a / 1e5).toFixed(2).replace(/\.00$/, '') + 'L';
            else if (a >= 1e3) s = '₹' + (a / 1e3).toFixed(1).replace(/\.0$/, '') + 'k';
            else s = '₹' + Math.round(a).toLocaleString('en-IN');
            return neg ? '−' + s : s;
        }

        async function loadPulse(accessible) {
            const mod = accessible.find(m => m.pulse);
            if (!mod) return;
            const base = CONFIG.endpoints.accounts;
            const token = (typeof getAuthToken === 'function') ? getAuthToken() : null;
            if (!base || !token) return;

            const headers = { 'Authorization': 'Bearer ' + token };
            try {
                const [kpiRes, trendRes] = await Promise.all([
                    fetch(base + '/api/accounts/dashboard/kpis', { headers }),
                    fetch(base + '/api/accounts/dashboard/revenue-trend?months=12', { headers })
                ]);
                if (!kpiRes.ok || !trendRes.ok) return;
                renderChips(await kpiRes.json());
                renderBand(await trendRes.json());
            } catch (e) { /* Accounts unreachable — pulse stays hidden */ }
        }

        function renderChips(kpis) {
            const el = document.getElementById('mcChips');
            if (!el) return;

            const chips = [
                { k: 'revenue ' + (kpis.fiscal_year_name || 'FY'), raw: kpis.revenue_ytd || 0, hero: true },
                { k: 'net profit', raw: kpis.net_profit_ytd || 0 },
                { k: 'cash & bank', raw: kpis.total_liquid || 0 },
                { k: 'receivables', raw: kpis.ar_outstanding || 0,
                  warn: (kpis.ar_overdue_count || 0) > 0 ? kpis.ar_overdue_count + ' overdue' : null },
                { k: 'payables', raw: kpis.ap_outstanding || 0 }
            ];

            el.innerHTML = '';
            chips.forEach(c => {
                const a = document.createElement('a');
                a.className = 'mc-chip' + (c.hero ? ' hero' : '');
                a.href = 'accounts/dashboard.html';
                a.innerHTML = '<span class="v"></span><span class="k"></span>' +
                              (c.warn ? '<span class="warn"></span>' : '');
                a.querySelector('.k').textContent = c.k;
                if (c.warn) a.querySelector('.warn').textContent = '· ' + c.warn;
                countUp(a.querySelector('.v'), c.raw, formatINR(c.raw));
                el.appendChild(a);
            });
            el.hidden = false;
        }

        function countUp(node, raw, finalText) {
            const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (reduced || !isFinite(raw) || raw === 0) { node.textContent = finalText; return; }
            const dur = 700;
            const start = performance.now();
            function tick(now) {
                const p = Math.min(1, (now - start) / dur);
                const eased = 1 - Math.pow(1 - p, 3);
                node.textContent = formatINR(raw * eased);
                if (p < 1) requestAnimationFrame(tick);
                else node.textContent = finalText;
            }
            requestAnimationFrame(tick);
        }

        // Ambient full-bleed revenue band: one series (area), months on hover.
        function renderBand(trend) {
            const band = document.getElementById('mcBand');
            const host = document.getElementById('mcBandChart');
            if (!band || !host || !trend || !trend.length) return;
            if (!trend.some(t => (t.revenue || 0) !== 0)) return; // nothing to show — stay hidden

            const W = 1200, H = 168, padT = 26, padB = 20;
            const ih = H - padT - padB;
            const yMax = Math.max(...trend.map(t => t.revenue || 0)) * 1.15 || 1;
            const x = i => (trend.length === 1 ? W / 2 : (i / (trend.length - 1)) * W);
            const y = v => padT + ih - (v / yMax) * ih;

            function smoothPath() {
                const pts = trend.map((t, i) => [x(i), y(t.revenue || 0)]);
                const n = pts.length;
                if (n < 3) return pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
                const dx = [], m = [];
                for (let i = 0; i < n - 1; i++) {
                    dx.push(pts[i + 1][0] - pts[i][0]);
                    m.push((pts[i + 1][1] - pts[i][1]) / dx[i]);
                }
                const t = [m[0]];
                for (let i = 1; i < n - 1; i++) t.push((m[i - 1] * m[i] <= 0) ? 0 : (m[i - 1] + m[i]) / 2);
                t.push(m[n - 2]);
                for (let i = 0; i < n - 1; i++) {
                    if (m[i] === 0) { t[i] = 0; t[i + 1] = 0; }
                    else {
                        const a = t[i] / m[i], b = t[i + 1] / m[i];
                        const s = a * a + b * b;
                        if (s > 9) { const tau = 3 / Math.sqrt(s); t[i] = tau * a * m[i]; t[i + 1] = tau * b * m[i]; }
                    }
                }
                let d = 'M' + pts[0][0].toFixed(1) + ',' + pts[0][1].toFixed(1);
                for (let i = 0; i < n - 1; i++) {
                    const h = dx[i];
                    d += ' C' + (pts[i][0] + h / 3).toFixed(1) + ',' + (pts[i][1] + t[i] * h / 3).toFixed(1) +
                         ' ' + (pts[i + 1][0] - h / 3).toFixed(1) + ',' + (pts[i + 1][1] - t[i + 1] * h / 3).toFixed(1) +
                         ' ' + pts[i + 1][0].toFixed(1) + ',' + pts[i + 1][1].toFixed(1);
                }
                return d;
            }

            const line = smoothPath();
            const area = line + ' L' + W + ',' + H + ' L0,' + H + ' Z';

            // Direct label on the latest month with activity
            const last = trend.length - 1;
            let lastActive = last;
            for (let i = last; i >= 0; i--) {
                if ((trend[i].revenue || 0) !== 0) { lastActive = i; break; }
            }
            const v = trend[lastActive].revenue || 0;
            const lx = Math.min(x(lastActive), W - 70);
            const marker =
                '<circle cx="' + x(lastActive).toFixed(1) + '" cy="' + y(v).toFixed(1) + '" r="3.5" fill="var(--chart-revenue)"/>' +
                '<text x="' + (lx + 10).toFixed(1) + '" y="' + Math.max(y(v) - 8, 14).toFixed(1) +
                '" font-size="12" font-weight="600" fill="var(--text-secondary)" font-family="var(--font-family-mono)">' +
                formatINR(v) + ' · ' + ((trend[lastActive].label || '').split(' ')[0]) + '</text>';

            host.innerHTML =
                '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" ' +
                'aria-label="Monthly revenue, last ' + trend.length + ' months">' +
                '<defs><linearGradient id="mcRev" x1="0" y1="0" x2="0" y2="1">' +
                '<stop offset="0" stop-color="var(--chart-revenue)" stop-opacity="0.30"/>' +
                '<stop offset="1" stop-color="var(--chart-revenue)" stop-opacity="0"/>' +
                '</linearGradient></defs>' +
                '<path d="' + area + '" fill="url(#mcRev)" stroke="none"/>' +
                '<path class="draw-line" d="' + line + '" fill="none" stroke="var(--chart-revenue)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' +
                marker +
                '<line id="mcCross" x1="0" y1="' + padT + '" x2="0" y2="' + (padT + ih) +
                '" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>' +
                '</svg>' +
                buildTrendTable(trend);

            band.hidden = false;

            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                const p = host.querySelector('.draw-line');
                const len = p.getTotalLength();
                p.style.strokeDasharray = len;
                p.style.strokeDashoffset = len;
                p.style.transition = 'stroke-dashoffset 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.2s';
                requestAnimationFrame(() => requestAnimationFrame(() => { p.style.strokeDashoffset = '0'; }));
            }

            const svg = host.querySelector('svg');
            const cross = host.querySelector('#mcCross');
            const tip = document.getElementById('homeChartTip');

            svg.addEventListener('mousemove', (e) => {
                const rect = svg.getBoundingClientRect();
                const relX = (e.clientX - rect.left) / rect.width * W;
                let idx = 0, best = Infinity;
                trend.forEach((t, i) => {
                    const d = Math.abs(x(i) - relX);
                    if (d < best) { best = d; idx = i; }
                });
                cross.style.display = '';
                cross.setAttribute('x1', x(idx));
                cross.setAttribute('x2', x(idx));
                tip.style.display = 'block';
                tip.style.left = (x(idx) / W * rect.width) + 'px';
                tip.style.top = '40px';
                tip.innerHTML = '<b></b><br>Revenue <b class="tr"></b>';
                tip.querySelector('b').textContent = trend[idx].label || '';
                tip.querySelector('.tr').textContent = formatINR(trend[idx].revenue || 0);
            });
            svg.addEventListener('mouseleave', () => {
                cross.style.display = 'none';
                tip.style.display = 'none';
            });
        }

        function buildTrendTable(trend) {
            let rows = '';
            trend.forEach(t => {
                rows += '<tr><th scope="row">' + (t.label || '') + '</th><td>' +
                        formatINR(t.revenue || 0) + '</td></tr>';
            });
            return '<table class="sr-only"><caption>Monthly revenue</caption>' +
                   '<thead><tr><th scope="col">Month</th><th scope="col">Revenue</th></tr></thead>' +
                   '<tbody>' + rows + '</tbody></table>';
        }

        function setupSearch() {
            const input = document.getElementById('moduleSearch');
            if (!input) return;

            input.addEventListener('input', () => {
                const q = input.value.trim().toLowerCase();
                document.querySelectorAll('.home-row').forEach(row => {
                    const hit = !q || (row.dataset.searchText || '').includes(q);
                    row.classList.toggle('filtered-out', !hit);
                });
                document.querySelectorAll('.home-group').forEach(group => {
                    const anyVisible = group.querySelector('.home-row:not(.filtered-out)');
                    group.classList.toggle('filtered-out', !anyVisible);
                });
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    input.value = '';
                    input.dispatchEvent(new Event('input'));
                    input.blur();
                } else if (e.key === 'Enter') {
                    const first = document.querySelector('.home-row:not(.filtered-out)');
                    if (first) first.click();
                }
            });

            document.addEventListener('keydown', (e) => {
                if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
                    e.preventDefault();
                    input.focus();
                }
            });
        }
    </script>
</body>
</html>
