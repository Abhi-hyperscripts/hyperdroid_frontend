<!DOCTYPE html>
<html lang="en-IN">
<head>
    <!-- Cookie Consent & Analytics -->
    <script src="/js/cookie-consent.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <!-- Pre-prod hardening: CSP locks scripts/styles to known CDNs + same-origin,
         frame-ancestors blocks clickjacking (replaces X-Frame-Options for modern
         browsers), object-src 'none' kills Flash/PDF embedding. 'unsafe-inline'
         on script-src remains because the HRMS JS files still use ~150 inline
         onclick="" handlers; refactoring to event delegation is post-prod. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://cdn.sheetjs.com https://www.googletagmanager.com https://www.gstatic.com https://justadudewhohacks.github.io; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss: ws:; frame-src 'self' https://www.google.com https://docs.google.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=2">
    <title>Organization Chart - HRMS</title>
    <script>window.CACHE_VERSION = Date.now();</script>
    <script>document.write('<script src="../../js/sw-version.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script src="/js/sw-update.js"></script>
    <script src="/js/pwa-install-prompt.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>document.write('<link rel="stylesheet" href="../../css/theme.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/styles.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/hrms-ess.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/hrms-dashboard.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/searchable-dropdown.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/glass-cards.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/rail-drawer.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<script src="../../js/theme.js?v=' + CACHE_VERSION + '"><\/script>');</script>
</head>
<body class="dashboard hrms-dashboard">
    <script>document.write('<script src="/js/button-spinner.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <nav class="navbar">
        <div class="navbar-brand">
            <a href="../home.html">
                <img src="../../assets/brand_logo.png" alt="Ragenaizer Logo" class="navbar-logo">
            </a>
        </div>
        <div class="navbar-menu"></div>
    </nav>

    <div class="ess-container">
        <nav class="breadcrumb-nav">
            <a href="dashboard.html">HRMS</a>
            <span class="separator">/</span>
            <span class="current">Organization Chart</span>
        </nav>
        <h1 class="page-title">Organization Chart</h1>

        <!-- Stats Bar -->
        <div class="org-stats-bar">
            <div class="org-stat-item">
                <span class="stat-label">Total Employees:</span>
                <span class="stat-value" id="totalCount">-</span>
            </div>
            <div class="org-stat-item">
                <span class="stat-label">Departments:</span>
                <span class="stat-value" id="deptCount">-</span>
            </div>
            <div class="org-stat-item">
                <span class="stat-label">Managers:</span>
                <span class="stat-value" id="managerCount">-</span>
            </div>
            <div class="org-stat-item">
                <span class="stat-label">Showing:</span>
                <span class="stat-value" id="visibleCount">-</span>
            </div>
        </div>

        <!-- Main Content Wrapper -->
        <div class="org-chart-wrapper">
            <!-- Main Tree Area -->
            <div class="org-chart-main">
                <div class="org-chart-container">
                    <!-- Toolbar -->
                    <div class="org-chart-toolbar">
                        <div class="org-chart-search">
                            <input type="text" id="searchInput" placeholder="Search by name, code, department..." oninput="debounceSearch()">
                        </div>
                        <div class="org-chart-filters">
                            <select id="departmentFilter" onchange="applyFilters()">
                                <option value="">All Departments</option>
                            </select>
                            <select id="officeFilter" onchange="applyFilters()">
                                <option value="">All Offices</option>
                            </select>
                        </div>
                        <div class="org-chart-actions">
                            <button class="org-chart-btn" onclick="expandAll()">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="6 9 12 15 18 9"/>
                                </svg>
                                Expand All
                            </button>
                            <button class="org-chart-btn" onclick="collapseAll()">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="18 15 12 9 6 15"/>
                                </svg>
                                Collapse All
                            </button>
                            <button class="org-chart-btn" onclick="resetChart()">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                                    <path d="M3 3v5h5"/>
                                </svg>
                                Reset
                            </button>
                        </div>
                    </div>

                    <!-- Tree View -->
                    <div class="org-tree" id="orgTree">
                        <div class="tree-loading">
                            <div class="spinner"></div>
                            <span>Loading organization chart...</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Details Panel (Slide-in) -->
            <div class="org-details-panel" id="detailsPanel">
                <div class="details-panel-header">
                    <h3>Employee Details</h3>
                    <button class="details-close-btn" onclick="hideDetailsPanel()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                </div>
                <div class="details-panel-content" id="detailsContent">
                    <!-- Dynamic content -->
                </div>
            </div>
        </div>

        <div class="ess-back-link" id="backLink">
            <a href="self-service.html" class="back-btn" id="backLinkAnchor">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="19" y1="12" x2="5" y2="12"/>
                    <polyline points="12 19 5 12 12 5"/>
                </svg>
                <span id="backLinkText">Back to Self-Service</span>
            </a>
        </div>
        <script>
        // Show "Back to HRMS" for admin users, "Back to Self-Service" for employees
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('ragenaizer_user') || '{}');
            const roles = user.roles || [];
            const isAdmin = roles.some(r => ['SUPERADMIN','HRMS_ADMIN','HRMS_HR_ADMIN'].includes(r));
            if (isAdmin) {
                const a = document.getElementById('backLinkAnchor');
                const t = document.getElementById('backLinkText');
                if (a) a.href = 'dashboard.html';
                if (t) t.textContent = 'Back to HRMS';
            }
        });
        </script>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.0/dist/browser/signalr.min.js"></script>
    <script src="../../js/searchable-dropdown.js"></script>
    <script src="../../js/auto-searchable-select.js"></script>
    <script>
        document.write('<script src="../../js/config.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/api.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/navigation.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/toast.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/hrms/hrms-signalr.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/hrms/org-chart.js?v=' + CACHE_VERSION + '"><\/script>');
    </script>
    <!-- AI Copilot Widget -->
    <script>document.write('<script src="../../embed/widget.js?v=' + CACHE_VERSION + '" data-mode="copilot" data-service="hrms" data-title="HR Assistant"><\/script>');</script>
    <script>
    // HRMS module set for the rail drawer (consumed by js/rail-drawer.js)
    window.RAIL_DRAWER_ITEMS = [
        { href: 'dashboard.html',    title: 'Today',     color: 'var(--color-warning)', svg: '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M8 15h3"/>' },
        { href: 'employees.html',    title: 'People',    color: '#60A5FA', svg: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>' },
        { href: 'attendance.html',   title: 'Attend',    color: '#4CC9F0', svg: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>' },
        { href: 'leave.html',        title: 'Leave',     color: '#FB923C', svg: '<path d="M8 2v4"/><path d="M16 2v4"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/><path d="m9 16 2 2 4-4"/>' },
        { href: 'payroll.html',      title: 'Payroll',   color: '#E2933D', svg: '<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>' },
        { href: 'recruitment.html',  title: 'Recruit',   color: '#F585C0', svg: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/>' },
        { href: 'organization.html', title: 'Org',       color: '#2DD4BF', svg: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>' },
        { href: 'compliance.html',   title: 'Statutory', color: '#A78BFA', svg: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>' },
        { href: 'reports.html',      title: 'Reports',   color: '#94A3B8', svg: '<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>' },
        { href: 'directory.html',    title: 'Directory', color: '#3DDC97', svg: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>' },
        { href: 'self-service.html', title: 'Me',        color: '#8B5CF6', svg: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>' }
    ];
    </script>
    <script>document.write('<script src="../../js/rail-drawer.js?v=' + CACHE_VERSION + '"><\/script>');</script>
</body>
</html>
