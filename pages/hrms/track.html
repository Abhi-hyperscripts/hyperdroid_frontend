<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https:; frame-ancestors 'none'; object-src 'none'; base-uri 'self';">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
    <title>Live location | Ragenaizer</title>
    <script>window.CACHE_VERSION = Date.now();</script>
    <script>document.write('<script src="../../js/sw-version.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/theme.css?v=' + CACHE_VERSION + '">');</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        html, body { height: 100%; margin: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-primary, #0b0f1a); color: var(--text-primary, #fff); display: flex; flex-direction: column; }
        header { padding: 14px 16px; display: flex; align-items: center; gap: 12px; background: var(--bg-secondary, #121829); border-bottom: 1px solid var(--border-color, #222a3d); }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--brand-primary, #7C3AED); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; flex: none; }
        .name { font-weight: 600; font-size: 1rem; }
        .sub { font-size: 0.78rem; color: var(--text-secondary, #9aa3b5); margin-top: 2px; }
        .pill { margin-left: auto; font-size: 0.72rem; padding: 4px 10px; border-radius: 999px; background: rgba(34,197,94,0.15); color: #4ADE80; white-space: nowrap; }
        .pill.stale { background: rgba(245,158,11,0.15); color: #FBBF24; }
        .pill.ended { background: rgba(148,163,184,0.15); color: #CBD5E1; }
        #map { flex: 1; min-height: 0; }
        .state { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 32px; color: var(--text-secondary, #9aa3b5); line-height: 1.5; }
        footer { padding: 8px 16px; font-size: 0.7rem; color: var(--text-secondary, #9aa3b5); background: var(--bg-secondary, #121829); border-top: 1px solid var(--border-color, #222a3d); display: flex; justify-content: space-between; gap: 8px; }
        .leaflet-container { background: #e8e6e1; }
        .me-pin { width: 18px; height: 18px; border-radius: 50%; background: #7C3AED; border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(124,58,237,0.25); }
    </style>
</head>
<body>
    <header>
        <div class="avatar" id="avatar">•</div>
        <div>
            <div class="name" id="agentName">Loading…</div>
            <div class="sub" id="agentSub">Fetching the latest position</div>
        </div>
        <div class="pill" id="statusPill" hidden></div>
    </header>
    <div id="map" hidden></div>
    <div class="state" id="stateBox">Loading…</div>
    <footer>
        <span id="expiryNote"></span>
        <span>Shared via Ragenaizer</span>
    </footer>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>document.write('<script src="../../js/config.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script>document.write('<script src="../../js/hrms/track.js?v=' + CACHE_VERSION + '"><\/script>');</script>
</body>
</html>
