<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Cookie Consent & Analytics -->
    <script src="/js/cookie-consent.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=2">
    <title>Issues - PMS | Ragenaizer</title>
    <script>window.CACHE_VERSION = Date.now();</script>
    <script>document.write('<script src="../../js/sw-version.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script src="/js/sw-update.js"></script>
    <script src="/js/pwa-install-prompt.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script>document.write('<link rel="stylesheet" href="../../css/theme.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/styles.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/glassmorphic-modal.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/crm.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/glass-cards.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/table-cards.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/searchable-dropdown.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/issues.css?v=' + CACHE_VERSION + '">');</script>
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">
    <script>document.write('<script src="../../js/theme.js?v=' + CACHE_VERSION + '"><\/script>');</script>
</head>
<body class="dashboard crm-page">
    <script>document.write('<script src="/js/button-spinner.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <nav class="navbar">
        <div class="navbar-brand">
            <a href="../home.html">
                <img src="../../assets/brand_logo.png" alt="Ragenaizer Logo" class="navbar-logo">
            </a>
        </div>
        <div class="navbar-menu"></div>
    </nav>

    <div class="crm-container">
        <!-- Header -->
        <div class="crm-header">
            <div class="header-content">
                <nav class="breadcrumb-nav">
                    <a href="dashboard.html">PMS</a>
                    <span class="separator">/</span>
                    <span class="current">Issues</span>
                </nav>
                <div class="crm-header-row">
                    <h1>Issues</h1>
                    <button class="btn btn-primary" onclick="openNewIssueModal()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="12" y1="8" x2="12" y2="16"/>
                            <line x1="8" y1="12" x2="16" y2="12"/>
                        </svg>
                        Report Issue
                    </button>
                </div>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="crm-stats-grid" id="issueStatsGrid">
            <div class="crm-stat-card">
                <div class="crm-stat-icon stat-total">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                </div>
                <div class="crm-stat-value" id="statTotal">-</div>
                <div class="crm-stat-label">Total</div>
            </div>
            <div class="crm-stat-card">
                <div class="crm-stat-icon stat-new">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
                    </svg>
                </div>
                <div class="crm-stat-value" id="statReported">-</div>
                <div class="crm-stat-label">Reported</div>
            </div>
            <div class="crm-stat-card">
                <div class="crm-stat-icon stat-active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                    </svg>
                </div>
                <div class="crm-stat-value" id="statInProgress">-</div>
                <div class="crm-stat-label">In Progress</div>
            </div>
            <div class="crm-stat-card">
                <div class="crm-stat-icon stat-completed">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                </div>
                <div class="crm-stat-value" id="statClosed">-</div>
                <div class="crm-stat-label">Closed</div>
            </div>
        </div>

        <!-- Filters -->
        <div class="crm-filter-bar">
            <div class="crm-filter-group">
                <label>Project</label>
                <select id="filterProject" class="form-select form-select-sm" onchange="loadIssues()">
                    <option value="">All Projects</option>
                </select>
            </div>
            <div class="crm-filter-group">
                <label>Status</label>
                <select id="filterStatus" class="form-select form-select-sm" onchange="loadIssues()">
                    <option value="">All Statuses</option>
                    <option value="reported">Reported</option>
                    <option value="in_progress">In Progress</option>
                    <option value="qa_testing">QA Testing</option>
                    <option value="closed">Closed</option>
                    <option value="reopened">Reopened</option>
                    <option value="wontfix">Won't Fix</option>
                </select>
            </div>
            <div class="crm-filter-group">
                <label>Severity</label>
                <select id="filterSeverity" class="form-select form-select-sm" onchange="loadIssues()">
                    <option value="">All Severities</option>
                    <option value="critical">Critical</option>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                    <option value="cosmetic">Cosmetic</option>
                </select>
            </div>
            <div class="crm-filter-group">
                <label>Priority</label>
                <select id="filterPriority" class="form-select form-select-sm" onchange="loadIssues()">
                    <option value="">All Priorities</option>
                    <option value="P0">P0</option>
                    <option value="P1">P1</option>
                    <option value="P2">P2</option>
                    <option value="P3">P3</option>
                    <option value="P4">P4</option>
                </select>
            </div>
            <div class="crm-filter-group">
                <label>From</label>
                <input type="date" id="filterFromDate" class="form-control form-control-sm" onchange="loadIssues()">
            </div>
            <div class="crm-filter-group">
                <label>To</label>
                <input type="date" id="filterToDate" class="form-control form-control-sm" onchange="loadIssues()">
            </div>
            <div class="crm-filter-group crm-search-group">
                <label>Search</label>
                <input type="text" id="filterSearch" class="form-control form-control-sm" placeholder="Search issues..." oninput="debounceSearch()">
            </div>
        </div>

        <!-- Issues Table -->
        <div class="crm-table-wrapper data-table-container">
            <table class="crm-table data-table issues-table" id="issuesTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Title</th>
                        <th>Type</th>
                        <th>Severity</th>
                        <th>Priority</th>
                        <th>Status</th>
                        <th>Assignee</th>
                        <th>Reporter</th>
                        <th>Age</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="issuesTableBody">
                    <tr><td colspan="10"><div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="40" height="40"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><p>Loading issues...</p></div></td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Create/Edit Issue Modal -->
    <div class="modal" id="issueModal">
        <div class="modal-backdrop" onclick="closeIssueModal()"></div>
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="issueModalTitle">Report Issue</h5>
                    <button class="close-btn" onclick="closeIssueModal()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="issueForm" onsubmit="handleIssueSubmit(event)">
                        <!-- Row 1: Title + Project + Sub-Project -->
                        <div class="row mb-3">
                            <div class="col-md-5">
                                <label class="form-label">Title <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="issueTitle" required placeholder="Brief summary of the issue">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Project <span class="text-danger">*</span></label>
                                <select class="form-select" id="issueProject" required onchange="onIssueProjectChange()">
                                    <option value="">Select Project</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Sub-Project</label>
                                <select class="form-select" id="issueSubProject">
                                    <option value="">Select project first</option>
                                </select>
                            </div>
                        </div>
                        <!-- Row 2: Type + Severity + Priority + Reproducibility -->
                        <div class="row mb-3">
                            <div class="col-md-3">
                                <label class="form-label">Issue Type</label>
                                <select class="form-select" id="issueType">
                                    <option value="bug">Bug</option>
                                    <option value="improvement">Improvement</option>
                                    <option value="task">Task</option>
                                    <option value="question">Question</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Severity</label>
                                <select class="form-select" id="issueSeverity">
                                    <option value="cosmetic">Cosmetic</option>
                                    <option value="low">Low</option>
                                    <option value="medium" selected>Medium</option>
                                    <option value="high">High</option>
                                    <option value="critical">Critical</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Priority</label>
                                <select class="form-select" id="issuePriority">
                                    <option value="P0">P0 - Blocker</option>
                                    <option value="P1">P1 - Critical</option>
                                    <option value="P2" selected>P2 - Major</option>
                                    <option value="P3">P3 - Minor</option>
                                    <option value="P4">P4 - Trivial</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Reproducibility</label>
                                <select class="form-select" id="issueReproducibility">
                                    <option value="always" selected>Always</option>
                                    <option value="sometimes">Sometimes</option>
                                    <option value="rarely">Rarely</option>
                                    <option value="cannot_reproduce">Cannot Reproduce</option>
                                </select>
                            </div>
                        </div>
                        <!-- Row 3: Component + Environment + Assigned To -->
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label">Component</label>
                                <input type="text" class="form-control" id="issueComponent" placeholder="e.g. Dashboard UI">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Environment</label>
                                <input type="text" class="form-control" id="issueEnvironment" placeholder="e.g. Chrome 120, macOS">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Assigned To</label>
                                <select class="form-select" id="issueAssignee">
                                    <option value="">Unassigned</option>
                                </select>
                            </div>
                        </div>
                        <!-- Tabbed Rich Text Editors -->
                        <div class="issue-editor-tabs">
                            <div class="issue-tab-nav">
                                <button type="button" class="issue-tab-btn active" onclick="switchEditorTab('steps', this)">
                                    Steps to Reproduce <span class="required">*</span>
                                </button>
                                <button type="button" class="issue-tab-btn" onclick="switchEditorTab('expected', this)">
                                    Expected Result <span class="required">*</span>
                                </button>
                                <button type="button" class="issue-tab-btn" onclick="switchEditorTab('actual', this)">
                                    Actual Result <span class="required">*</span>
                                </button>
                                <button type="button" class="issue-tab-btn" onclick="switchEditorTab('description', this)">
                                    Notes
                                </button>
                            </div>
                            <div class="issue-tab-panels">
                                <div class="issue-tab-panel active" id="tabSteps">
                                    <div id="editorSteps"></div>
                                </div>
                                <div class="issue-tab-panel" id="tabExpected">
                                    <div id="editorExpected"></div>
                                </div>
                                <div class="issue-tab-panel" id="tabActual">
                                    <div id="editorActual"></div>
                                </div>
                                <div class="issue-tab-panel" id="tabDescription">
                                    <div id="editorDescription"></div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeIssueModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" form="issueForm" id="issueSubmitBtn">Report Issue</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>document.write('<script src="../../js/config.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script>document.write('<script src="../../js/api.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script>document.write('<script src="../../js/toast.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script>document.write('<script src="../../js/navigation.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script>document.write('<script src="../../js/firebase-init.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
    <script>document.write('<script src="../../js/pms/issues.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <!-- AI Copilot Widget -->
    <script>document.write('<script src="../../embed/widget.js?v=' + CACHE_VERSION + '" data-mode="copilot" data-service="pms" data-title="Project Assistant"><\/script>');</script>
</body>
</html>
