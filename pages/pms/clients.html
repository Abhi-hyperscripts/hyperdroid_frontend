<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Cookie Consent & Analytics -->
    <script src="/js/cookie-consent.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=2">
    <title>Clients - Projects | Ragenaizer</title>
    <script>window.CACHE_VERSION = Date.now();</script>
    <script>document.write('<script src="../../js/sw-version.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script src="/js/sw-update.js"></script>
    <script src="/js/pwa-install-prompt.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script>document.write('<link rel="stylesheet" href="../../css/theme.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/styles.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/glassmorphic-modal.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/crm.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/glass-cards.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/table-cards.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/searchable-dropdown.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<script src="../../js/theme.js?v=' + CACHE_VERSION + '"><\/script>');</script>
</head>
<body class="dashboard crm-page">
    <script>document.write('<script src="/js/button-spinner.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <nav class="navbar">
        <div class="navbar-brand">
            <a href="../home.html">
                <img src="../../assets/brand_logo.png" alt="Ragenaizer Logo" class="navbar-logo">
            </a>
        </div>
        <div class="navbar-menu">
            <!-- Navigation links rendered by Navigation.init() -->
        </div>
    </nav>

    <div class="crm-container">
        <!-- Header -->
        <div class="crm-header">
            <div class="header-content">
                <nav class="breadcrumb-nav">
                    <a href="dashboard.html">PMS</a>
                    <span class="separator">/</span>
                    <span class="current">Clients</span>
                </nav>
                <div class="crm-header-row">
                    <h1>Clients</h1>
                    <button class="btn btn-primary" id="newClientBtn" onclick="openNewClientModal()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        New Client
                    </button>
                </div>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="crm-stats-grid" id="clientStatsGrid">
            <div class="crm-stat-card">
                <div class="crm-stat-icon stat-total">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                </div>
                <div class="crm-stat-value" id="statTotalClients">-</div>
                <div class="crm-stat-label">Total Clients</div>
            </div>
            <div class="crm-stat-card">
                <div class="crm-stat-icon stat-new">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
                        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
                    </svg>
                </div>
                <div class="crm-stat-value" id="statActiveProjects">-</div>
                <div class="crm-stat-label">Active Projects</div>
            </div>
            <div class="crm-stat-card">
                <div class="crm-stat-icon stat-qualified">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                </div>
                <div class="crm-stat-value" id="statTotalContacts">-</div>
                <div class="crm-stat-label">Total Contacts</div>
            </div>
            <div class="crm-stat-card">
                <div class="crm-stat-icon stat-converted">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M2 12h20"/>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                    </svg>
                </div>
                <div class="crm-stat-value" id="statIndustries">-</div>
                <div class="crm-stat-label">Industries</div>
            </div>
        </div>

        <!-- Filter Bar -->
        <div class="crm-filter-bar">
            <div class="crm-filter-group crm-search-group">
                <label for="filterSearch">Search</label>
                <input type="text" id="filterSearch" class="form-control form-control-sm" placeholder="Search clients..." oninput="applyFilters()">
            </div>
        </div>

        <!-- Clients Table -->
        <div class="crm-table-wrapper data-table-container">
            <table class="crm-table data-table" id="clientsTable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Industry</th>
                        <th class="hide-mobile">Website</th>
                        <th class="hide-mobile">Projects</th>
                        <th class="hide-mobile">Contacts</th>
                        <th class="hide-mobile">Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="clientsTableBody">
                    <tr>
                        <td colspan="7" class="crm-empty-state">
                            <div class="crm-empty-content">
                                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                                    <polyline points="9 22 9 12 15 12 15 22"/>
                                </svg>
                                <p>Loading clients...</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- New/Edit Client Modal -->
    <div class="modal" id="clientModal">
        <div class="modal-backdrop" onclick="closeClientModal()"></div>
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="clientModalTitle">New Client</h5>
                    <button class="close-btn" onclick="closeClientModal()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="clientForm" onsubmit="handleClientSubmit(event)">
                        <input type="hidden" id="clientId" value="">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="clientName" class="form-label">Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="clientName" name="name" required>
                            </div>
                            <div class="col-md-6">
                                <label for="clientIndustry" class="form-label">Industry</label>
                                <input type="text" class="form-control" id="clientIndustry" name="industry">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="clientWebsite" class="form-label">Website</label>
                                <input type="url" class="form-control" id="clientWebsite" name="website" placeholder="https://...">
                            </div>
                            <div class="col-md-6">
                                <label for="clientCountry" class="form-label">Country</label>
                                <input type="text" class="form-control" id="clientCountry" name="country">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="clientCity" class="form-label">City</label>
                                <input type="text" class="form-control" id="clientCity" name="city">
                            </div>
                            <div class="col-md-6">
                                <label for="clientState" class="form-label">State</label>
                                <input type="text" class="form-control" id="clientState" name="state">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="clientAddress" class="form-label">Address</label>
                                <input type="text" class="form-control" id="clientAddress" name="address">
                            </div>
                            <div class="col-md-6">
                                <label for="clientPostalCode" class="form-label">Postal Code</label>
                                <input type="text" class="form-control" id="clientPostalCode" name="postal_code">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="clientNotes" class="form-label">Notes</label>
                            <textarea class="form-control" id="clientNotes" name="notes" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeClientModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" form="clientForm" id="clientSubmitBtn">
                        <span class="btn-spinner" id="clientSubmitSpinner" style="display:none;"></span>
                        Create Client
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Client Contacts Modal -->
    <div class="modal" id="contactsModal">
        <div class="modal-backdrop" onclick="closeContactsModal()"></div>
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="contactsModalTitle">Client Contacts</h5>
                    <button class="close-btn" onclick="closeContactsModal()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <div class="modal-body">
                    <div id="contactsList" style="margin-bottom: 16px;">
                        <!-- Populated dynamically -->
                    </div>
                    <hr style="border-color: var(--border-primary);">
                    <h6 style="color: var(--text-primary); margin-bottom: 12px;">Add Contact</h6>
                    <form id="contactForm" onsubmit="handleContactSubmit(event)">
                        <input type="hidden" id="contactClientId" value="">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="contactName" class="form-label">Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="contactName" name="name" required>
                            </div>
                            <div class="col-md-6">
                                <label for="contactEmail" class="form-label">Email</label>
                                <input type="email" class="form-control" id="contactEmail" name="email">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="contactPhone" class="form-label">Phone</label>
                                <input type="tel" class="form-control" id="contactPhone" name="phone">
                            </div>
                            <div class="col-md-6">
                                <label for="contactDesignation" class="form-label">Designation</label>
                                <input type="text" class="form-control" id="contactDesignation" name="designation">
                            </div>
                        </div>
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="contactIsPrimary">
                                <label class="form-check-label" for="contactIsPrimary" style="color: var(--text-primary);">
                                    Primary Contact
                                </label>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-sm" id="contactSubmitBtn">
                            <span class="btn-spinner" id="contactSubmitSpinner" style="display:none;"></span>
                            Add Contact
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.0/dist/browser/signalr.min.js"></script>
    <script>
        document.write('<script src="../../js/config.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/api.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/navigation.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/toast.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/table-cards.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/searchable-dropdown.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/pms/clients.js?v=' + CACHE_VERSION + '"><\/script>');
    </script>
</body>
</html>
