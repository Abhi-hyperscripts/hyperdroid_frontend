<!DOCTYPE html>
<html lang="en-IN">
<head>
    <!-- Cookie Consent & Analytics -->
    <script src="/js/cookie-consent.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=2">
    <title>Tasks - PMS | Ragenaizer</title>

    <script>document.write('<script src="../../js/sw-version.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script src="/js/sw-update.js"></script>
    <script src="/js/pwa-install-prompt.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script>document.write('<link rel="stylesheet" href="../../css/theme.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/styles.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/glassmorphic-modal.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/crm.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/glass-cards.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/table-cards.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/searchable-dropdown.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<script src="../../js/theme.js?v=' + CACHE_VERSION + '"><\/script>');</script>
</head>
<body class="dashboard crm-page">
    <script>document.write('<script src="/js/button-spinner.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <nav class="navbar">
        <div class="navbar-brand">
            <a href="../home.html">
                <img src="../../assets/brand_logo.png" alt="Ragenaizer Logo" class="navbar-logo">
            </a>
        </div>
        <div class="navbar-menu">
            <!-- Navigation links rendered by Navigation.init() -->
        </div>
    </nav>

    <div class="crm-container">
        <!-- Header -->
        <div class="crm-header">
            <div class="header-content">
                <nav class="breadcrumb-nav">
                    <a href="dashboard.html">PMS</a>
                    <span class="separator">/</span>
                    <span class="current">Tasks</span>
                </nav>
                <div class="crm-header-row">
                    <h1>Tasks</h1>
                    <button class="btn btn-primary" id="newTaskBtn" onclick="openNewTaskModal()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        New Task
                    </button>
                </div>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="crm-stats-grid" id="taskStatsGrid">
            <div class="crm-stat-card">
                <div class="crm-stat-icon stat-total">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
                        <rect x="9" y="3" width="6" height="4" rx="1"/>
                        <path d="M9 14l2 2 4-4"/>
                    </svg>
                </div>
                <div class="crm-stat-value" id="statTotalTasks">-</div>
                <div class="crm-stat-label">Total Tasks</div>
            </div>
            <div class="crm-stat-card">
                <div class="crm-stat-icon stat-new">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </svg>
                </div>
                <div class="crm-stat-value" id="statInProgress">-</div>
                <div class="crm-stat-label">In Progress</div>
            </div>
            <div class="crm-stat-card">
                <div class="crm-stat-icon stat-qualified">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                </div>
                <div class="crm-stat-value" id="statCompleted">-</div>
                <div class="crm-stat-label">Completed</div>
            </div>
            <div class="crm-stat-card">
                <div class="crm-stat-icon stat-converted">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="12"/>
                        <line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                </div>
                <div class="crm-stat-value" id="statOverdue">-</div>
                <div class="crm-stat-label">Overdue</div>
            </div>
        </div>

        <!-- Filter Bar -->
        <div class="crm-filter-bar">
            <div class="crm-filter-group">
                <label for="filterStatus">Status</label>
                <select id="filterStatus" class="form-select form-select-sm" onchange="applyFilters()">
                    <option value="">All Statuses</option>
                    <option value="todo">To Do</option>
                    <option value="in_progress">In Progress</option>
                    <option value="in_review">In Review</option>
                    <option value="done">Done</option>
                </select>
            </div>
            <div class="crm-filter-group">
                <label for="filterPriority">Priority</label>
                <select id="filterPriority" class="form-select form-select-sm" onchange="applyFilters()">
                    <option value="">All Priorities</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                    <option value="urgent">Urgent</option>
                </select>
            </div>
            <div class="crm-filter-group">
                <label for="filterProject">Project</label>
                <select id="filterProject" class="form-select form-select-sm" onchange="applyFilters()">
                    <option value="">All Projects</option>
                </select>
            </div>
            <div class="crm-filter-group crm-search-group">
                <label for="filterSearch">Search</label>
                <input type="text" id="filterSearch" class="form-control form-control-sm" placeholder="Search tasks..." oninput="applyFilters()">
            </div>
        </div>

        <!-- Tasks Table -->
        <div class="crm-table-wrapper data-table-container">
            <table class="crm-table data-table" id="tasksTable">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Project</th>
                        <th class="hide-mobile">Assignee</th>
                        <th>Status</th>
                        <th class="hide-mobile">Priority</th>
                        <th class="hide-mobile">Due Date</th>
                        <th class="hide-mobile">Hours Logged</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tasksTableBody">
                    <tr>
                        <td colspan="8" class="crm-empty-state">
                            <div class="crm-empty-content">
                                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
                                    <rect x="9" y="3" width="6" height="4" rx="1"/>
                                    <path d="M9 14l2 2 4-4"/>
                                </svg>
                                <p>Loading tasks...</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="crm-pagination" id="tasksPagination"></div>
    </div>

    <!-- New/Edit Task Modal -->
    <div class="modal" id="taskModal">
        <div class="modal-backdrop" onclick="closeTaskModal()"></div>
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="taskModalTitle">New Task</h5>
                    <button class="close-btn" onclick="closeTaskModal()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="taskForm" onsubmit="handleTaskSubmit(event)">
                        <input type="hidden" id="taskId" value="">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="taskTitle" class="form-label">Title <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="taskTitle" name="title" required>
                            </div>
                            <div class="col-md-6">
                                <label for="taskProject" class="form-label">Project <span class="text-danger">*</span></label>
                                <select class="form-select" id="taskProject" name="project_id" required onchange="onProjectChange()">
                                    <option value="">Select Project</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="taskSubProject" class="form-label">Sub-Project</label>
                                <select class="form-select" id="taskSubProject" name="sub_project_id">
                                    <option value="">None</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="taskAssignee" class="form-label">Assigned To</label>
                                <select class="form-select" id="taskAssignee" name="assigned_to">
                                    <option value="">Select project first</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="taskStatus" class="form-label">Status</label>
                                <select class="form-select" id="taskStatus" name="status">
                                    <option value="todo">To Do</option>
                                    <option value="in_progress">In Progress</option>
                                    <option value="in_review">In Review</option>
                                    <option value="done">Done</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="taskPriority" class="form-label">Priority</label>
                                <select class="form-select" id="taskPriority" name="priority">
                                    <option value="low">Low</option>
                                    <option value="medium" selected>Medium</option>
                                    <option value="high">High</option>
                                    <option value="urgent">Urgent</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="taskDueDate" class="form-label">Due Date</label>
                                <input type="date" class="form-control" id="taskDueDate" name="due_date">
                            </div>
                            <div class="col-md-3">
                                <label for="taskEstHours" class="form-label">Est. Hours</label>
                                <input type="number" class="form-control" id="taskEstHours" name="estimated_hours" min="0" value="0">
                            </div>
                            <div class="col-md-3">
                                <label for="taskEstMinutes" class="form-label">Est. Minutes</label>
                                <input type="number" class="form-control" id="taskEstMinutes" name="estimated_minutes" min="0" max="59" value="0">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="taskDescription" class="form-label">Description</label>
                            <textarea class="form-control" id="taskDescription" name="description" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeTaskModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" form="taskForm" id="taskSubmitBtn">
                        <span class="btn-spinner" id="taskSubmitSpinner" style="display:none;"></span>
                        Create Task
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.0/dist/browser/signalr.min.js"></script>
    <script>
        document.write('<script src="../../js/config.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/api.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/navigation.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/toast.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/table-cards.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/searchable-dropdown.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/auto-searchable-select.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/pms/pms-modal-esc.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/pms/tasks.js?v=' + CACHE_VERSION + '"><\/script>');
    </script>
    <!-- AI Copilot Widget -->
    <script>document.write('<script src="../../embed/widget.js?v=' + CACHE_VERSION + '" data-mode="copilot" data-service="pms" data-title="Project Assistant"><\/script>');</script>
</body>
</html>
