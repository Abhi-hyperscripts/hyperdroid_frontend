<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Cookie Consent & Analytics -->
    <script src="/js/cookie-consent.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=2">
    <title>Time Tracking - PMS | Ragenaizer</title>

    <script>document.write('<script src="../../js/sw-version.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script src="/js/sw-update.js"></script>
    <script src="/js/pwa-install-prompt.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script>document.write('<link rel="stylesheet" href="../../css/theme.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/styles.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/glassmorphic-modal.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/crm.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/glass-cards.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/table-cards.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/searchable-dropdown.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<script src="../../js/theme.js?v=' + CACHE_VERSION + '"><\/script>');</script>
</head>
<body class="dashboard crm-page">
    <script>document.write('<script src="/js/button-spinner.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <nav class="navbar">
        <div class="navbar-brand">
            <a href="../home.html">
                <img src="../../assets/brand_logo.png" alt="Ragenaizer Logo" class="navbar-logo">
            </a>
        </div>
        <div class="navbar-menu">
            <!-- Navigation links rendered by Navigation.init() -->
        </div>
    </nav>

    <div class="crm-container">
        <!-- Header -->
        <div class="crm-header">
            <div class="header-content">
                <nav class="breadcrumb-nav">
                    <a href="dashboard.html">PMS</a>
                    <span class="separator">/</span>
                    <span class="current">Time Tracking</span>
                </nav>
                <div class="crm-header-row">
                    <h1>Time Tracking</h1>
                    <button class="btn btn-primary" id="logTimeBtn" onclick="openLogTimeModal()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        Log Time
                    </button>
                </div>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="crm-stats-grid" id="timeStatsGrid">
            <div class="crm-stat-card">
                <div class="crm-stat-icon stat-total">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </svg>
                </div>
                <div class="crm-stat-value" id="statHoursToday">-</div>
                <div class="crm-stat-label">Hours Today</div>
            </div>
            <div class="crm-stat-card">
                <div class="crm-stat-icon stat-new">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                        <line x1="16" y1="2" x2="16" y2="6"/>
                        <line x1="8" y1="2" x2="8" y2="6"/>
                        <line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                </div>
                <div class="crm-stat-value" id="statHoursWeek">-</div>
                <div class="crm-stat-label">Hours This Week</div>
            </div>
            <div class="crm-stat-card">
                <div class="crm-stat-icon stat-qualified">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                </div>
                <div class="crm-stat-value" id="statHoursMonth">-</div>
                <div class="crm-stat-label">Hours This Month</div>
            </div>
            <div class="crm-stat-card">
                <div class="crm-stat-icon stat-converted">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                    </svg>
                </div>
                <div class="crm-stat-value" id="statBillableHours">-</div>
                <div class="crm-stat-label">Total Entries</div>
            </div>
        </div>

        <!-- Week Navigation -->
        <div class="crm-filter-bar" style="justify-content: center; gap: 16px; align-items: center;">
            <button class="btn btn-sm btn-outline-primary" id="prevWeekBtn" onclick="previousWeek()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="15 18 9 12 15 6"/>
                </svg>
                Previous Week
            </button>
            <span id="weekDisplay" style="font-weight: 600; color: var(--text-primary); font-size: 0.95rem; min-width: 180px; text-align: center;"></span>
            <button class="btn btn-sm btn-outline-primary" id="nextWeekBtn" onclick="nextWeek()">
                Next Week
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="9 18 15 12 9 6"/>
                </svg>
            </button>
        </div>

        <!-- Time Entries Table -->
        <div class="crm-table-wrapper data-table-container">
            <table class="crm-table data-table" id="timeEntriesTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Project</th>
                        <th>Task</th>
                        <th>Hours</th>
                        <th>Minutes</th>
                        <th class="hide-mobile">Comment</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="timeEntriesTableBody">
                    <tr>
                        <td colspan="7" class="crm-empty-state">
                            <div class="crm-empty-content">
                                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <circle cx="12" cy="12" r="10"/>
                                    <polyline points="12 6 12 12 16 14"/>
                                </svg>
                                <p>Loading time entries...</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Log Time Modal -->
    <div class="modal" id="timeEntryModal">
        <div class="modal-backdrop" onclick="closeTimeEntryModal()"></div>
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="timeEntryModalTitle">Log Time</h5>
                    <button class="close-btn" onclick="closeTimeEntryModal()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="timeEntryForm" onsubmit="handleTimeEntrySubmit(event)">
                        <input type="hidden" id="timeEntryId" value="">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="entryProject" class="form-label">Project <span class="text-danger">*</span></label>
                                <select class="form-select" id="entryProject" name="project_id" required onchange="onProjectChange()">
                                    <option value="">Select Project</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="entrySubProject" class="form-label">Sub-Project</label>
                                <select class="form-select" id="entrySubProject" name="sub_project_id">
                                    <option value="">Select project first</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-12">
                                <label for="entryTask" class="form-label">Task</label>
                                <select class="form-select" id="entryTask" name="task_id">
                                    <option value="">Select Task</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="entryDate" class="form-label">Date <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" id="entryDate" name="entry_date" required>
                            </div>
                            <div class="col-md-3">
                                <label for="entryHours" class="form-label">Hours <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" id="entryHours" name="hours" min="0" max="23" value="0" required>
                            </div>
                            <div class="col-md-3">
                                <label for="entryMinutes" class="form-label">Minutes <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" id="entryMinutes" name="minutes" min="0" max="59" value="0" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="entryDescription" class="form-label">Comment</label>
                            <textarea class="form-control" id="entryDescription" name="comment" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeTimeEntryModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" form="timeEntryForm" id="timeEntrySubmitBtn">
                        <span class="btn-spinner" id="timeEntrySubmitSpinner" style="display:none;"></span>
                        Log Time
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.0/dist/browser/signalr.min.js"></script>
    <script>
        document.write('<script src="../../js/config.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/api.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/navigation.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/toast.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/table-cards.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/searchable-dropdown.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/auto-searchable-select.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/pms/pms-modal-esc.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/pms/time-tracking.js?v=' + CACHE_VERSION + '"><\/script>');
    </script>
    <!-- AI Copilot Widget -->
    <script>document.write('<script src="../../embed/widget.js?v=' + CACHE_VERSION + '" data-mode="copilot" data-service="pms" data-title="Project Assistant"><\/script>');</script>
</body>
</html>
