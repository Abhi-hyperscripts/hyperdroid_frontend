<body class="dashboard crm-page">
    <script>document.write('<script src="/js/button-spinner.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <nav class="navbar">
        <div class="navbar-brand">
            <a href="../home.html">
                <img src="../../assets/brand_logo.png" alt="Ragenaizer Logo" class="navbar-logo">
            </a>
        </div>
        <div class="navbar-menu">
            <!-- Navigation links rendered by Navigation.init() -->
        </div>
    </nav>

    <div class="crm-container">
        <!-- Header -->
        <div class="crm-header">
            <div class="header-content">
                <nav class="breadcrumb-nav">
                    <a href="dashboard.html">PMS</a>
                    <span class="separator">/</span>
                    <span class="current">Activity Log</span>
                </nav>
                <div class="crm-header-row">
                    <h1>Activity Log</h1>
                    <button class="btn btn-secondary" onclick="loadActivity()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="23 4 23 10 17 10"/>
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                        </svg>
                        Refresh
                    </button>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="crm-filter-bar">
            <div class="crm-filter-group">
                <label for="filterEntityType">Entity Type</label>
                <select id="filterEntityType" class="form-select form-select-sm" onchange="applyFilters()">
                    <option value="">All Types</option>
                    <option value="client">Client</option>
                    <option value="project">Project</option>
                    <option value="task">Task</option>
                    <option value="member">Member</option>
                    <option value="time_entry">Time Entry</option>
                    <option value="timesheet">Timesheet</option>
                </select>
            </div>
            <div class="crm-filter-group">
                <label for="filterProject">Project</label>
                <select id="filterProject" class="form-select form-select-sm" onchange="applyFilters()">
                    <option value="">All Projects</option>
                </select>
            </div>
        </div>

        <!-- Activity Table -->
        <div class="crm-table-wrapper data-table-container">
            <table class="crm-table data-table" id="activityTable">
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Action</th>
                        <th>Entity</th>
                        <th>Details</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="activityTableBody">
                    <tr>
                        <td colspan="5" class="crm-empty-state">
                            <div class="crm-empty-content">
                                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                                </svg>
                                <p>Loading activity...</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.0/dist/browser/signalr.min.js"></script>
