<!DOCTYPE html>
<html lang="en-IN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>Your Account Card | Ragenaizer</title>

    <!--
      Public-facing lead-card landing reached by scanning a QR.
      Standalone — does NOT pull config.js, api.js, navigation.js, or
      the service worker. Anyone with the URL can load this; we keep
      the blast radius small.

      Visual language: Aurora (violet/indigo/cyan on midnight canvas)
      mirrored from RAGENAIZER_MOBILE/src/shared/theme/aurora.ts.
      Token names match the mobile constants so a future restyle stays
      atomic across web + mobile.
    -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">

    <!-- Fraunces (display), Inter Tight (body), JetBrains Mono (slugs) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

    <style>
        /* ── Aurora tokens (mirror of shared/theme/aurora.ts) ──────────── */
        :root {
            --violet:    #7C3AED;
            --violet2:   #A78BFA;
            --indigo:    #6366F1;
            --sky:       #38BDF8;
            --cyan:      #22D3EE;
            --lime:      #BEF264;
            --mint:      #34D399;
            --steel:     #94A3B8;

            --bg:        #07070C;
            --bg2:       #0A0A12;
            --surface:   #0E0F18;
            --surface2:  #15161F;
            --surface3:  #1B1D29;
            --line:      rgba(255,255,255,0.07);
            --line2:     rgba(255,255,255,0.14);
            --hud:       rgba(167,139,250,0.85);

            --text-primary:   #EDEAF7;
            --text-secondary: #C6C2D8;
            --text-muted:     #9692B0;
            --text-dim:       #5E5A77;
        }

        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text-primary);
            font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Subtle aurora background — radial violet+indigo glow behind the card.
           Pinned via fixed positioning so it doesn't scroll. */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 0%, rgba(124,58,237,0.18), transparent 50%),
                radial-gradient(circle at 80% 100%, rgba(34,211,238,0.12), transparent 55%),
                radial-gradient(circle at 50% 50%, rgba(99,102,241,0.10), transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .wrap {
            position: relative;
            z-index: 1;
            max-width: 520px;
            margin: 0 auto;
            padding: 36px 18px 60px;
        }

        /* Header eyebrow — Aurora "slug" style */
        .eyebrow {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 2.4px;
            text-transform: uppercase;
            color: var(--violet2);
            text-align: center;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .eyebrow::before, .eyebrow::after {
            content: '';
            width: 28px;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--violet2), transparent);
        }

        /* HUD card — main container, glassy + violet-bracket corners */
        .card {
            position: relative;
            background: rgba(14, 15, 24, 0.86);
            backdrop-filter: blur(20px) saturate(140%);
            -webkit-backdrop-filter: blur(20px) saturate(140%);
            border: 1px solid var(--line2);
            border-radius: 22px;
            padding: 30px 26px 28px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
        }
        /* HUD bracket corners — violet-tinted L-shapes at each corner */
        .card::before, .card::after,
        .card .hud-tr, .card .hud-bl {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            border-color: var(--hud);
            border-style: solid;
            border-width: 0;
        }
        .card::before { top: 10px; left: 10px;  border-top-width: 2px; border-left-width: 2px;  border-top-left-radius: 6px; }
        .card::after  { bottom: 10px; right: 10px; border-bottom-width: 2px; border-right-width: 2px; border-bottom-right-radius: 6px; }
        .card .hud-tr { top: 10px; right: 10px; border-top-width: 2px; border-right-width: 2px; border-top-right-radius: 6px; }
        .card .hud-bl { bottom: 10px; left: 10px;  border-bottom-width: 2px; border-left-width: 2px;  border-bottom-left-radius: 6px; }

        /* Lead identity block */
        .lead-name {
            font-family: 'Fraunces', Georgia, serif;
            font-size: clamp(34px, 7vw, 48px);
            font-weight: 300;
            letter-spacing: -1.6px;
            line-height: 1.05;
            color: var(--text-primary);
            margin: 6px 0 10px;
        }
        .lead-ref {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            color: var(--text-muted);
        }
        .lead-ref::before {
            content: '§ ';
            color: var(--cyan);
            font-weight: 600;
        }

        /* Section divider */
        .section {
            margin-top: 26px;
            padding-top: 22px;
            border-top: 1px solid var(--line);
        }
        .section-title {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 2.2px;
            text-transform: uppercase;
            color: var(--cyan);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title::before {
            content: '';
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--cyan);
            box-shadow: 0 0 8px var(--cyan);
        }

        .field-row {
            display: grid;
            grid-template-columns: 110px 1fr;
            gap: 12px;
            padding: 9px 0;
            font-size: 13.5px;
        }
        .field-label {
            color: var(--text-muted);
            letter-spacing: 0.04em;
            font-weight: 500;
        }
        .field-value {
            color: var(--text-primary);
            word-break: break-word;
            font-weight: 500;
        }
        .field-value a {
            color: var(--violet2);
            text-decoration: none;
            border-bottom: 1px solid rgba(167,139,250,0.35);
        }
        .field-value a:hover {
            color: var(--text-primary);
            border-bottom-color: var(--violet2);
        }

        /* Rep contact card */
        .rep-block {
            margin-top: 26px;
            padding-top: 22px;
            border-top: 1px solid var(--line);
        }
        .rep-row {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
        }
        .rep-avatar {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--violet), var(--indigo), var(--cyan));
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 0.04em;
            flex-shrink: 0;
            overflow: hidden;
            border: 1px solid var(--line2);
            box-shadow: 0 0 30px rgba(124,58,237,0.4);
        }
        .rep-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .rep-name {
            font-family: 'Fraunces', Georgia, serif;
            font-weight: 400;
            font-size: 20px;
            color: var(--text-primary);
            margin: 0 0 2px;
            letter-spacing: -0.4px;
        }
        .rep-meta {
            font-size: 12px;
            color: var(--text-muted);
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 14px;
            border-radius: 12px;
            border: 1px solid transparent;
            font-family: 'Inter Tight', sans-serif;
            color: #fff;
            font-size: 14.5px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            min-height: 50px;
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }
        .btn:active { transform: scale(0.97); }
        .btn--call {
            background: linear-gradient(135deg, var(--indigo), var(--sky));
            box-shadow: 0 8px 24px rgba(99,102,241,0.32);
        }
        .btn--whats {
            background: linear-gradient(135deg, var(--mint), var(--cyan));
            color: #0A0A12;
            box-shadow: 0 8px 24px rgba(52,211,153,0.30);
        }
        .btn--disabled {
            background: var(--surface3);
            color: var(--text-dim);
            box-shadow: none;
            border-color: var(--line);
            pointer-events: none;
        }
        .btn svg { width: 18px; height: 18px; }

        /* Empty / error state */
        .empty {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 64px 20px;
            color: var(--text-muted);
        }
        .empty h2 {
            font-family: 'Fraunces', Georgia, serif;
            font-weight: 400;
            margin: 0 0 10px;
            color: var(--text-primary);
            font-size: 26px;
            letter-spacing: -0.6px;
        }
        .empty p { max-width: 360px; margin: 0 auto; }

        .foot {
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-top: 32px;
        }
        .foot a { color: var(--text-muted); text-decoration: none; }
        .foot a:hover { color: var(--violet2); }

        @media (max-width: 420px) {
            .wrap { padding: 24px 14px 50px; }
            .card { padding: 26px 20px 22px; }
            .field-row { grid-template-columns: 92px 1fr; gap: 10px; font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="eyebrow">Customer Card</div>

        <!-- Card mounts here. The script below replaces the inner HTML
             after fetching the public endpoint. We start in a "loading"
             state so a slow connection doesn't flash empty. -->
        <div id="card-mount" class="card" aria-live="polite">
            <span class="hud-tr"></span><span class="hud-bl"></span>
            <p style="text-align:center; color: var(--text-muted); margin: 40px 0;">
                Loading your card…
            </p>
        </div>

        <p class="foot">
            Powered by <a href="https://ragenaizer.com" target="_blank" rel="noopener">Ragenaizer</a>
        </p>
    </div>

    <script>
        const params = new URLSearchParams(location.search);
        const token = params.get('t');
        const mount = document.getElementById('card-mount');

        function escapeHtml(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function renderEmpty(msg) {
            mount.outerHTML = `
                <div class="empty">
                    <h2>This card isn't available</h2>
                    <p>${escapeHtml(msg)}</p>
                </div>
            `;
        }

        function initials(name) {
            const parts = (name || '').trim().split(/\s+/);
            const first = parts[0]?.charAt(0) || '?';
            const last  = parts.length > 1 ? parts[parts.length - 1].charAt(0) : '';
            return (first + last).toUpperCase();
        }

        /**
         * Field-value renderer. The backend tags each field with a `type`
         * which we map to a linked rendering when sensible:
         *   tel   → <a href="tel:...">
         *   email → <a href="mailto:...">
         *   url   → <a href="...">
         *   text  → escaped plain text
         */
        function renderFieldValue(field) {
            const raw = field.value || '';
            const safe = escapeHtml(raw);
            switch (field.type) {
                case 'tel':
                    return `<a href="tel:${escapeHtml(raw.replace(/[^+\d]/g, ''))}">${safe}</a>`;
                case 'email':
                    return `<a href="mailto:${escapeHtml(raw)}">${safe}</a>`;
                case 'url': {
                    let href = raw;
                    if (!/^https?:\/\//i.test(href)) href = 'https://' + href;
                    return `<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">${safe}</a>`;
                }
                default:
                    return safe;
            }
        }

        function renderSection(section) {
            if (!section.fields || !section.fields.length) return '';
            const rows = section.fields.map(f => `
                <div class="field-row">
                    <div class="field-label">${escapeHtml(f.label)}</div>
                    <div class="field-value">${renderFieldValue(f)}</div>
                </div>
            `).join('');
            return `
                <div class="section">
                    <div class="section-title">${escapeHtml(section.title)}</div>
                    ${rows}
                </div>
            `;
        }

        function renderRep(rep) {
            if (!rep) return '';
            const callBtn = rep.call_phone
                ? `<a class="btn btn--call" href="tel:${escapeHtml(rep.call_phone)}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.86 19.86 0 0 1 2.08 4.18 2 2 0 0 1 4.06 2h3a2 2 0 0 1 2 1.72c.13.94.37 1.87.72 2.76a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.32-1.32a2 2 0 0 1 2.11-.45c.89.35 1.82.59 2.76.72a2 2 0 0 1 1.72 2z"/></svg>
                    Call
                  </a>`
                : `<span class="btn btn--call btn--disabled">Call</span>`;
            const waBtn = rep.whatsapp_phone
                ? `<a class="btn btn--whats" href="https://wa.me/${escapeHtml(rep.whatsapp_phone)}" target="_blank" rel="noopener">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.52 3.48A11.94 11.94 0 0 0 12.02 0C5.4 0 .07 5.35.07 11.96c0 2.11.55 4.17 1.6 5.99L0 24l6.21-1.63a11.93 11.93 0 0 0 5.81 1.48h.01c6.62 0 11.95-5.35 11.95-11.96 0-3.19-1.24-6.19-3.46-8.41zM12.02 21.8h-.01a9.85 9.85 0 0 1-5.02-1.38l-.36-.21-3.69.97.98-3.6-.23-.37a9.84 9.84 0 0 1-1.5-5.25c0-5.45 4.43-9.88 9.86-9.88 2.63 0 5.1 1.02 6.96 2.89a9.78 9.78 0 0 1 2.88 6.99c0 5.45-4.43 9.84-9.87 9.84zm5.4-7.36c-.3-.15-1.75-.86-2.02-.96-.27-.1-.47-.15-.66.15-.2.3-.76.96-.93 1.15-.17.2-.34.22-.64.07-.3-.15-1.25-.46-2.38-1.47-.88-.78-1.47-1.75-1.64-2.05-.17-.3-.02-.46.13-.61.13-.13.3-.34.45-.51.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.66-1.6-.91-2.18-.24-.57-.49-.5-.66-.51-.17-.01-.37-.01-.57-.01s-.51.07-.78.37-1.02 1-1.02 2.43 1.04 2.82 1.19 3.02c.15.2 2.05 3.13 4.97 4.39.69.3 1.23.48 1.65.61.69.22 1.32.19 1.82.12.56-.08 1.75-.71 1.99-1.4.25-.69.25-1.28.17-1.4-.07-.13-.27-.2-.57-.35z"/></svg>
                    WhatsApp
                  </a>`
                : `<span class="btn btn--whats btn--disabled">WhatsApp</span>`;

            return `
                <div class="rep-block">
                    <div class="section-title">Your contact</div>
                    <div class="rep-row">
                        <div class="rep-avatar">
                            ${rep.photo_url
                                ? `<img src="${escapeHtml(rep.photo_url)}" alt="" referrerpolicy="no-referrer">`
                                : escapeHtml(initials(rep.display_name))}
                        </div>
                        <div>
                            <div class="rep-name">${escapeHtml(rep.display_name || 'Your account team')}</div>
                            <div class="rep-meta">Your account manager</div>
                        </div>
                    </div>
                    <div class="actions">${callBtn}${waBtn}</div>
                </div>
            `;
        }

        function renderCard(card) {
            const sectionsHtml = (card.sections || []).map(renderSection).join('');
            const repHtml = renderRep(card.assigned_rep);
            mount.innerHTML = `
                <span class="hud-tr"></span><span class="hud-bl"></span>
                <h1 class="lead-name">${escapeHtml(card.lead_name)}</h1>
                <div class="lead-ref">${escapeHtml(card.lead_ref_id)}</div>
                ${sectionsHtml}
                ${repHtml}
            `;
        }

        async function load() {
            if (!token) {
                renderEmpty('No card identifier was provided in the link.');
                return;
            }
            try {
                // Resolve API base. ?api=live lets a developer running the
                // page off `python -m http.server 5501` hit prod CRM without
                // spinning up a local CRM container.
                const forceLive = params.get('api') === 'live';
                const apiBase = (location.hostname === 'localhost' && !forceLive)
                    ? 'http://localhost:5112'
                    : 'https://crm.ragenaizer.com';
                const resp = await fetch(`${apiBase}/api/public/lead-card/${encodeURIComponent(token)}`, {
                    method: 'GET',
                    credentials: 'omit',
                    referrerPolicy: 'no-referrer',
                });
                if (resp.status === 404) {
                    renderEmpty('This card has expired or the link is no longer valid. Please contact your account manager for a new one.');
                    return;
                }
                if (!resp.ok) {
                    renderEmpty('We had trouble loading this card. Please try again in a moment.');
                    return;
                }
                const data = await resp.json();
                renderCard(data);
            } catch (err) {
                renderEmpty('We had trouble loading this card. Please check your connection and try again.');
            }
        }

        load();
    </script>
</body>
</html>
