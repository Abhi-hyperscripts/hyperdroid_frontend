<!DOCTYPE html>
<html lang="en-IN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>Your Account Card | Ragenaizer</title>
    <!--
      Public-facing lead-card landing page reached by scanning a QR.
      Standalone — does NOT pull config.js, api.js, navigation.js, or the
      service worker. Anyone with the URL can load this; we keep the
      blast radius small by only touching one endpoint and rendering
      what comes back as plain text. Token is in the `t` query param.
    -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">

    <style>
        :root {
            --bg: #f5f7fb;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --accent: #25d366;
            --call: #2563eb;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui,
                         'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        .wrap {
            max-width: 440px;
            margin: 0 auto;
            padding: 28px 20px 60px;
        }
        .brand {
            text-align: center;
            font-size: 13px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 24px;
        }
        .card {
            background: var(--card);
            border-radius: 18px;
            padding: 28px 24px 32px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
        }
        .lead-name {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 4px;
            line-height: 1.2;
        }
        .lead-ref {
            font-size: 13px;
            color: var(--muted);
            letter-spacing: 0.04em;
            font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        }
        .divider {
            height: 1px;
            background: var(--border);
            margin: 22px 0;
        }
        .rep-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            margin-bottom: 10px;
        }
        .rep-row {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .rep-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #06b6d4);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 0.02em;
            flex-shrink: 0;
            overflow: hidden;
        }
        .rep-avatar img {
            width: 100%; height: 100%; object-fit: cover;
        }
        .rep-name {
            font-size: 17px;
            font-weight: 600;
            margin: 0 0 2px;
        }
        .rep-meta {
            font-size: 13px;
            color: var(--muted);
        }
        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 22px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 14px;
            border-radius: 12px;
            border: 0;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            min-height: 48px;  /* mobile tap target */
            transition: filter 0.15s ease;
        }
        .btn:active { filter: brightness(0.9); }
        .btn--call    { background: var(--call); }
        .btn--whats   { background: var(--accent); }
        .btn--disabled {
            background: #cbd5e1;
            color: #64748b;
            pointer-events: none;
        }
        .btn svg { width: 18px; height: 18px; }
        .empty {
            text-align: center;
            padding: 48px 20px;
            color: var(--muted);
        }
        .empty h2 { margin: 0 0 8px; color: var(--text); font-size: 22px; }
        .foot {
            text-align: center;
            font-size: 11px;
            color: var(--muted);
            margin-top: 30px;
        }
        .foot a { color: var(--muted); }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="brand">Customer Card</div>

        <!-- Card mounts here. The script below replaces the inner HTML
             after fetching the public endpoint. We start in a "loading"
             state so a slow connection doesn't flash empty. -->
        <div id="card-mount" class="card" aria-live="polite">
            <p style="text-align:center; color: var(--muted); margin: 30px 0;">
                Loading your card…
            </p>
        </div>

        <p class="foot">
            Powered by <a href="https://ragenaizer.com" target="_blank" rel="noopener">Ragenaizer</a>
        </p>
    </div>

    <script>
        // Same-origin guarded fetch. The token is in the `t` query param.
        const params = new URLSearchParams(location.search);
        const token = params.get('t');
        const mount = document.getElementById('card-mount');

        function escapeHtml(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function renderEmpty(msg) {
            mount.className = 'empty';
            mount.innerHTML = `
                <h2>This card isn't available</h2>
                <p>${escapeHtml(msg)}</p>
            `;
        }

        function initials(name) {
            const parts = (name || '').trim().split(/\s+/);
            const first = parts[0]?.charAt(0) || '?';
            const last  = parts.length > 1 ? parts[parts.length - 1].charAt(0) : '';
            return (first + last).toUpperCase();
        }

        function renderCard(card) {
            const rep = card.assigned_rep;
            const repHtml = !rep
                ? `<p class="rep-meta" style="margin:0;">Your account team will reach out soon.</p>`
                : `
                    <div class="rep-row">
                        <div class="rep-avatar">
                            ${rep.photo_url
                                ? `<img src="${escapeHtml(rep.photo_url)}" alt="" referrerpolicy="no-referrer">`
                                : escapeHtml(initials(rep.display_name))}
                        </div>
                        <div>
                            <div class="rep-name">${escapeHtml(rep.display_name || 'Your account team')}</div>
                            <div class="rep-meta">Your account manager</div>
                        </div>
                    </div>
                    <div class="actions">
                        ${rep.call_phone
                            ? `<a class="btn btn--call" href="tel:${escapeHtml(rep.call_phone)}">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.86 19.86 0 0 1 2.08 4.18 2 2 0 0 1 4.06 2h3a2 2 0 0 1 2 1.72c.13.94.37 1.87.72 2.76a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.32-1.32a2 2 0 0 1 2.11-.45c.89.35 1.82.59 2.76.72a2 2 0 0 1 1.72 2z"/></svg>
                                Call
                              </a>`
                            : `<span class="btn btn--call btn--disabled">Call</span>`
                        }
                        ${rep.whatsapp_phone
                            ? `<a class="btn btn--whats" href="https://wa.me/${escapeHtml(rep.whatsapp_phone)}" target="_blank" rel="noopener">
                                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.52 3.48A11.94 11.94 0 0 0 12.02 0C5.4 0 .07 5.35.07 11.96c0 2.11.55 4.17 1.6 5.99L0 24l6.21-1.63a11.93 11.93 0 0 0 5.81 1.48h.01c6.62 0 11.95-5.35 11.95-11.96 0-3.19-1.24-6.19-3.46-8.41zM12.02 21.8h-.01a9.85 9.85 0 0 1-5.02-1.38l-.36-.21-3.69.97.98-3.6-.23-.37a9.84 9.84 0 0 1-1.5-5.25c0-5.45 4.43-9.88 9.86-9.88 2.63 0 5.1 1.02 6.96 2.89a9.78 9.78 0 0 1 2.88 6.99c0 5.45-4.43 9.84-9.87 9.84zm5.4-7.36c-.3-.15-1.75-.86-2.02-.96-.27-.1-.47-.15-.66.15-.2.3-.76.96-.93 1.15-.17.2-.34.22-.64.07-.3-.15-1.25-.46-2.38-1.47-.88-.78-1.47-1.75-1.64-2.05-.17-.3-.02-.46.13-.61.13-.13.3-.34.45-.51.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.66-1.6-.91-2.18-.24-.57-.49-.5-.66-.51-.17-.01-.37-.01-.57-.01s-.51.07-.78.37-1.02 1-1.02 2.43 1.04 2.82 1.19 3.02c.15.2 2.05 3.13 4.97 4.39.69.3 1.23.48 1.65.61.69.22 1.32.19 1.82.12.56-.08 1.75-.71 1.99-1.4.25-.69.25-1.28.17-1.4-.07-.13-.27-.2-.57-.35z"/></svg>
                                WhatsApp
                              </a>`
                            : `<span class="btn btn--whats btn--disabled">WhatsApp</span>`
                        }
                    </div>
                `;

            mount.className = 'card';
            mount.innerHTML = `
                <h1 class="lead-name">${escapeHtml(card.lead_name)}</h1>
                <div class="lead-ref">Reference: ${escapeHtml(card.lead_ref_id)}</div>
                <div class="divider"></div>
                <div class="rep-label">Your contact</div>
                ${repHtml}
            `;
        }

        async function load() {
            if (!token) {
                renderEmpty('No card identifier was provided in the link.');
                return;
            }
            try {
                // Cross-host fetch — frontend on ragenaizer.com, API on
                // crm.ragenaizer.com. No credentials sent (this is a
                // public endpoint; we don't want any cookies leaking).
                const apiBase = location.hostname === 'localhost'
                    ? 'http://localhost:5112'
                    : 'https://crm.ragenaizer.com';
                const resp = await fetch(`${apiBase}/api/public/lead-card/${encodeURIComponent(token)}`, {
                    method: 'GET',
                    credentials: 'omit',
                    referrerPolicy: 'no-referrer',
                });
                if (resp.status === 404) {
                    renderEmpty('This card has expired or the link is no longer valid. Please contact your account manager for a new one.');
                    return;
                }
                if (!resp.ok) {
                    renderEmpty('We had trouble loading this card. Please try again in a moment.');
                    return;
                }
                const data = await resp.json();
                renderCard(data);
            } catch (err) {
                // Network or parse error. Don't surface internals.
                renderEmpty('We had trouble loading this card. Please check your connection and try again.');
            }
        }

        load();
    </script>
</body>
</html>
