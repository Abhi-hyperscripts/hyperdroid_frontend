    <div class="crm-container">
        <div class="ldk-hero">
            <nav class="breadcrumb-nav">
                <a href="dashboard.html">CRM</a>
                <span class="separator">/</span>
                <span class="current">Properties</span>
            </nav>

            <div class="ldk-appbar">
                <div class="ldk-id">
                    <h1 class="pulse-title">Properties</h1>
                    <span class="ldk-count" id="prpTotalNum">—</span>
                </div>

                <div class="ldk-omni">
                    <div class="crm-search-wrap">
                        <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                        <input type="text" id="prpSearch" class="form-control form-control-sm crm-search-input"
                               placeholder="Search by project, tower or unit…">
                    </div>
                </div>

                <!-- Chips live INLINE in the app bar, between the search and the
                     actions — the same slot Leads uses (#lpActiveChips). They were
                     on a row of their own below the tabs, which pushed the whole
                     desk down whenever a filter was active and read as a different
                     product from the page next door. -->
                <div id="prpChips" class="lp-chips" aria-label="Active filters"></div>

                <div class="ldk-actions">
                    <button type="button" id="prpFiltersToggle" class="btn btn-sm btn-outline-primary" title="Show or hide the filters">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
                        </svg>
                        Filters <span id="prpFiltersCount" class="transfer-badge" style="display:none;">0</span>
                    </button>
                    <button class="btn btn-primary" id="addPropertyBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        List a unit
                    </button>
                </div>
            </div>

            <div class="ldk-viewsrow">
                <div class="ldk-tabs" id="prpTabs"></div>

                <div id="prpFiltersPanel" class="lp-filter-panel">
                    <div class="crm-filter-bar crm-filter-bar--dimensions">
                        <div class="crm-filter-group">
                            <label>Project</label>
                            <span data-prp="project-host"></span>
                        </div>
                        <!-- Category narrows Type, exactly as in the unit editor.
                             The server has accepted `category` and `propertyType`
                             since the vocabulary shipped; without these two the
                             capability existed at every layer except the one a
                             user can reach. -->
                        <div class="crm-filter-group">
                            <label>Category</label>
                            <span data-prp="category-host"></span>
                        </div>
                        <div class="crm-filter-group">
                            <label>Type</label>
                            <span data-prp="type-host"></span>
                        </div>
                        <div class="crm-filter-group">
                            <label for="prpBedrooms">Bedrooms</label>
                            <input type="number" step="0.5" min="0" id="prpBedrooms" data-prp="bedrooms"
                                   class="form-control form-control-sm" placeholder="any">
                        </div>
                        <div class="crm-filter-group">
                            <label for="prpMinPrice">Budget from</label>
                            <input type="number" min="0" id="prpMinPrice" data-prp="minPrice"
                                   class="form-control form-control-sm" placeholder="min">
                        </div>
                        <div class="crm-filter-group">
                            <label for="prpMaxPrice">Budget to</label>
                            <input type="number" min="0" id="prpMaxPrice" data-prp="maxPrice"
                                   class="form-control form-control-sm" placeholder="max">
                        </div>
                        <div class="crm-filter-group crm-filter-group--no-label">
                            <label class="prp-toggle">
                                <input type="checkbox" data-prp="availableOnly">
                                <span>Only what I can sell</span>
                            </label>
                        </div>
                        <div class="crm-filter-group crm-filter-group--no-label">
                            <button type="button" class="btn btn-sm btn-primary" data-prp="apply">Apply</button>
                            <button type="button" class="btn btn-sm btn-outline-primary" data-prp="clear">Clear</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Inventory mix: available / on hold / booked / sold, in proportion.
             The property analogue of the Lead Desk's pipeline flow. -->
        <div class="ldk-flowline" id="prpFlowBar"></div>

        <div class="ldk-split">
            <div class="ldk-list">
                <div class="ldk-listtools">
                    <span id="prpShowing">—</span>
                    <button type="button" class="ldk-sort" id="prpSortBtn">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                        <span id="prpSortLabel">Unit</span>
                    </button>
                </div>
                <div class="ldk-rows" id="prpRows"></div>

                <!-- Flush pane footer, mirroring the Lead Desk's pagination bar. -->
                <div class="prp-listfoot" id="prpListFoot">
                    <span class="prp-rows-per">
                        Rows
                        <select id="prpPageSize" aria-label="Rows per page">
                            <option value="25">25</option>
                            <option value="50" selected>50</option>
                            <option value="100">100</option>
                        </select>
                    </span>
                    <span id="prpRange">—</span>
                    <span class="prp-pager" id="prpPager"></span>
                </div>
            </div>

            <!-- The unit detail: the gallery IS the detail for property, so it
                 leads, with the specification and the hold beneath it. -->
            <div class="ldk-detailhost" id="prpDetailHost"></div>
        </div>
    </div>

    <!-- List / edit a unit.
         ⭐ THE MODAL MUST BE A CHILD OF THE OVERLAY. glassmorphic-modal.css is
         written as `.gm-overlay > .gm-modal` and hides an inactive modal ONLY
         through the overlay's opacity — a sibling modal has no rule of its own
         and stays fully visible at the bottom of the page, which is exactly how
         the first version of this page shipped. Found by looking at a full-page
         screenshot; the panel above it looked perfect. -->
    <div class="gm-overlay" id="propertyModalOverlay">
        <div class="gm-modal" id="propertyModal">
            <div class="gm-header">
                <h3 id="propertyModalTitle">List a unit</h3>
            </div>
            <div class="gm-body">
                <div class="prf-grid">
                    <label class="prf-full">Project *
                        <input type="text" data-prf="project" maxlength="200" placeholder="e.g. Aruma Heights">
                    </label>
                    <label>Tower
                        <input type="text" data-prf="tower" maxlength="100" placeholder="e.g. Tower B">
                    </label>
                    <label>Floor
                        <input type="number" data-prf="floorNumber" placeholder="e.g. 12">
                    </label>
                    <label>Unit number *
                        <input type="text" data-prf="unitNumber" maxlength="60" placeholder="e.g. 1204">
                    </label>
                    <!-- ⭐ PICKERS, NOT FREE TEXT. The server now validates the
                         type against a closed vocabulary, so a text box would
                         let somebody type "2BHK flat" and only learn it is
                         invalid when the save is refused. The category picker
                         narrows the type picker, which is also the only way a
                         user discovers that residential and commercial are the
                         axis the listing is organised on. -->
                    <label>Category
                        <span data-prf="category-host"></span>
                    </label>
                    <label>Type
                        <span data-prf="type-host"></span>
                    </label>
                    <label>Bedrooms
                        <input type="number" step="0.5" min="0" data-prf="bedrooms" placeholder="e.g. 2.5">
                    </label>
                    <label>Area (sq ft)
                        <input type="number" step="0.01" min="0" data-prf="areaSqft" placeholder="e.g. 1650">
                    </label>
                    <label>Price
                        <input type="number" step="0.01" min="0" data-prf="price" placeholder="e.g. 12500000">
                    </label>
                    <label>Facing
                        <input type="text" data-prf="facing" maxlength="40" placeholder="e.g. east">
                    </label>
                    <!-- Where the unit actually is. The address is free text a
                         human writes; the coordinates put it on a map, and the
                         server refuses one without the other. -->
                    <label class="prf-full">Address
                        <input type="text" data-prf="address" maxlength="500"
                               placeholder="e.g. Aruma Heights, Sector 75, Noida 201301">
                    </label>
                    <label>Latitude <span class="prf-opt">(with longitude)</span>
                        <input type="number" step="0.000001" min="-90" max="90"
                               data-prf="latitude" placeholder="e.g. 28.583200">
                    </label>
                    <label>Longitude <span class="prf-opt">(with latitude)</span>
                        <input type="number" step="0.000001" min="-180" max="180"
                               data-prf="longitude" placeholder="e.g. 77.379100">
                    </label>

                    <label class="prf-full">Notes
                        <textarea rows="2" data-prf="notes" placeholder="Anything a buyer should know"></textarea>
                    </label>
                </div>
            </div>
            <div class="gm-footer" style="padding: 16px 20px; display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid var(--border-color-light);">
                <button type="button" class="btn btn-secondary" data-prf="cancel">Cancel</button>
                <button type="button" class="btn btn-primary" data-prf="save">Save unit</button>
            </div>
        </div>
    </div>

    <!-- The gallery lives IN the detail pane, so all that is needed here is the
         file picker it opens. -->
    <input type="file" id="prpFileInput" accept="image/jpeg,image/png,image/webp,image/gif,image/avif,video/mp4,video/quicktime,video/webm" multiple hidden>
