    <!-- ══ Page header ══ -->

            <a href="dashboard.html">CRM</a>

            <a href="sequences.html">Sequences</a>
            <span class="separator">/</span>
            <span class="current">New sequence</span>

                <a href="sequences.html" class="seqb-back">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                    Sequences
                </a>
                <h1 id="seqbTitle">New sequence</h1>
                <p class="sqx-sub">Give the cadence a name, set when a lead should drop out, and add the ordered steps that fire automatically.</p>
            </div>
        </div>

    <!-- The builder form is rendered here by sequence-builder.js.
         Reuses the .seq-builder-body form styles from sequences.css; no modal,
         so the step-type dropdown opens in normal page flow with nothing to sit
         behind. -->
    <div class="sqx-wrap seqb-wrap">
        <div id="seqBuilderRoot" class="seq-builder-body seqb-form"></div>
    </div>

    <!-- Sticky action bar — the page equivalent of the modal footer -->
    <div class="seqb-actionbar" id="seqbActionbar">
        <div class="seqb-actionbar-inner">
            <button class="btn btn-outline" onclick="window.location='sequences.html'">Cancel</button>
            <button class="btn btn-primary" id="seqbSaveBtn">Create sequence</button>
        </div>
    </div>
