    <style>
        .crm-subhead { color: var(--text-secondary); font-size: 14px; margin: 8px 0 0; }
        .crm-loading { padding: 48px 24px; text-align: center; color: var(--text-secondary); }

        .rq-summary {
            font-size: 14px; color: var(--text-secondary); margin: 16px 0;
            padding: 12px 16px; background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 10px;
        }
        .rq-summary-count { color: var(--color-error); font-size: 18px; }

        .rq-group {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 12px; margin-bottom: 20px; overflow: hidden;
        }
        .rq-group-header {
            display: flex; justify-content: space-between; align-items: center;
            gap: 16px; padding: 14px 18px; background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color); flex-wrap: wrap;
        }
        .rq-group-title { font-weight: 600; color: var(--text-primary); font-size: 15px; }
        .rq-group-subtitle { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
        .rq-group-bulk { display: flex; gap: 8px; align-items: center; }
        .rq-bulk-pick { min-width: 240px; }
        .rq-row-pick { min-width: 200px; }
        .rq-warning {
            padding: 10px 18px; background: rgba(245, 158, 11, 0.08);
            border-bottom: 1px solid var(--border-color);
            font-size: 13px; color: var(--text-primary);
        }
        .rq-table { margin: 0; }
        .rq-table th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }

        .rq-inactive-pill {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 3px 10px; background: rgba(239, 68, 68, 0.1);
            color: var(--color-error); border-radius: 9999px;
            font-size: 11px; font-weight: 500;
        }
        .rq-inactive-dot {
            width: 6px; height: 6px; background: currentColor; border-radius: 50%;
        }

        /* Owner-inactive pill on the Leads page (renderOwnerCell) */
        .crm-owner-inactive-pill {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 1px 6px; background: rgba(239, 68, 68, 0.1);
            color: var(--color-error); border-radius: 9999px;
            font-size: 10px; font-weight: 600; letter-spacing: .03em;
            text-transform: uppercase; align-self: flex-start;
        }

        /* Unassigned-bucket pill — never had an owner. Amber palette
           reads as "needs attention" but not "broken" (orphaned stays red). */
        .rq-bucket-pill {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 3px 10px; border-radius: 9999px;
            font-size: 11px; font-weight: 500;
        }
        .rq-bucket-unassigned { background: rgba(245,158,11,0.12); color: rgb(217,119,6); }
        .rq-bucket-dot { width: 6px; height: 6px; background: currentColor; border-radius: 50%; }

        /* Subtitle chips — shows the bucket split in the group header. */
        .rq-bucket-chip {
            display: inline-block; padding: 1px 8px; border-radius: 9999px;
            font-size: 11px; font-weight: 600; letter-spacing: .02em;
            margin-right: 4px;
        }
        .rq-bucket-chip-unassigned { background: rgba(245,158,11,0.12); color: rgb(217,119,6); }
        .rq-bucket-chip-orphaned   { background: rgba(239,68,68,0.10); color: var(--color-error); }
    </style>
</head>
<body class="dashboard crm-page crm-reassign-queue-page">

    <div class="crm-container">
        <div class="crm-header">

                    <a href="dashboard.html">CRM</a>
                    <span class="separator">/</span>
                    <a href="leads.html">Leads</a>
                    <span class="separator">/</span>
                    <span class="current">Reassign Queue</span>
                </nav>
                <div class="crm-header-row">
                    <h1>Reassign Queue</h1>
                    <div style="display:flex;gap:8px;align-items:center;">
                        <a href="leads.html" class="btn btn-outline-secondary">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
                            </svg>
                            Back to Leads
                        </a>
                    </div>
                </div>
                <p class="crm-subhead">Open leads owned by users who have been deactivated. Pick a new owner to keep the pipeline moving.</p>
            </div>
        </div>

        <div id="rqContent">
            <div id="rqLoading" class="crm-loading">Loading…</div>
        </div>
    </div>
