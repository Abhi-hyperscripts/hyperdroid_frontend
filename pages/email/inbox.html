<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/js/cookie-consent.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=2">
    <title>Mail - Ragenaizer</title>
    <script>window.CACHE_VERSION = Date.now();</script>
    <script>document.write('<script src="../../js/sw-version.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script src="/js/sw-update.js"></script>
    <script src="/js/pwa-install-prompt.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>document.write('<link rel="stylesheet" href="../../css/theme.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/styles.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/email.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<script src="../../js/theme.js?v=' + CACHE_VERSION + '"><\/script>');</script>
</head>
<body class="dashboard email-page">
    <script>document.write('<script src="/js/button-spinner.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script>document.write('<script src="/js/tooltip.js?v=' + CACHE_VERSION + '"><\/script>');</script>

    <nav class="navbar">
        <div class="navbar-brand">
            <a href="../home.html">
                <img src="../../assets/brand_logo.png" alt="Ragenaizer Logo" class="navbar-logo">
            </a>
        </div>
        <div class="navbar-menu"></div>
    </nav>

    <main class="email-shell" id="emailShell">

        <!-- Backdrop that dims content when rail is open (tablet/phone) -->
        <div class="email-rail-backdrop" id="railBackdrop"></div>

        <!-- ===================== Left rail: accounts + folders ========== -->
        <aside class="email-rail" id="emailRail">
            <div class="email-rail-top">
                <button class="email-compose-btn" id="btnCompose" title="New message (n)">
                    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    New email
                </button>
            </div>

            <div class="email-accounts" id="accountsTree">
                <!-- Skeleton placeholder — replaced by renderAccountTree() once
                     mailboxes + folders load. Matches the shape of the
                     account header + folder rows so the reveal feels smooth. -->
                <div class="email-skel-account">
                    <div class="skel-header">
                        <div class="skel-pulse skel-chev"></div>
                        <div class="skel-pulse skel-name"></div>
                    </div>
                    <div class="skel-folder"><div class="skel-pulse skel-icon"></div><div class="skel-pulse skel-label w-60"></div></div>
                    <div class="skel-folder"><div class="skel-pulse skel-icon"></div><div class="skel-pulse skel-label w-40"></div></div>
                    <div class="skel-folder"><div class="skel-pulse skel-icon"></div><div class="skel-pulse skel-label w-70"></div></div>
                    <div class="skel-folder"><div class="skel-pulse skel-icon"></div><div class="skel-pulse skel-label w-50"></div></div>
                </div>
            </div>

            <div class="email-rail-footer">
                <a href="settings.html" title="Mailbox settings">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
                    </svg>
                    Mailbox settings
                </a>
            </div>
        </aside>

        <!-- ===================== Middle: message list =================== -->
        <section class="email-list" id="emailList">
            <!-- Tablet/phone: top bar with menu button to reveal the rail + compose shortcut -->
            <div class="email-mobile-header">
                <button id="btnOpenRail" title="Folders" aria-label="Open folders">
                    <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <span class="title" id="mobileListTitle">Mail</span>
                <button id="btnComposeMobile" title="New message" aria-label="New message">
                    <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                </button>
            </div>
            <div class="email-list-top">
                <div class="email-list-title">
                    <h3 id="folderTitle">Inbox</h3>
                    <span class="email-list-title-count" id="folderCount"></span>
                </div>
                <div class="email-filter-tabs">
                    <button class="email-filter-tab active" data-filter="focused">Focused</button>
                    <button class="email-filter-tab" data-filter="other">Other</button>
                    <div class="email-toolbar-icons">
                        <button id="btnRefresh" title="Refresh">
                            <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                        </button>
                    </div>
                </div>
                <input type="search" class="email-list-search" id="listSearch" placeholder="Search mail…">
            </div>
            <div class="email-rows" id="emailRows">
                <!-- Skeleton while loading -->
                <div class="email-skel-row">
                    <div class="skel-avatar"></div>
                    <div class="skel-lines">
                        <div class="skel-line w-60"></div>
                        <div class="skel-line w-80"></div>
                        <div class="skel-line w-40"></div>
                    </div>
                </div>
                <div class="email-skel-row">
                    <div class="skel-avatar"></div>
                    <div class="skel-lines">
                        <div class="skel-line w-80"></div>
                        <div class="skel-line w-60"></div>
                        <div class="skel-line w-40"></div>
                    </div>
                </div>
                <div class="email-skel-row">
                    <div class="skel-avatar"></div>
                    <div class="skel-lines">
                        <div class="skel-line w-40"></div>
                        <div class="skel-line w-80"></div>
                        <div class="skel-line w-60"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- ===================== Right: reading pane ==================== -->
        <section class="email-read" id="emailRead">
            <div class="email-empty" id="readEmpty">
                <svg viewBox="0 0 120 120">
                    <rect x="10" y="28" width="100" height="66" rx="6" stroke-dasharray="4 3"/>
                    <polyline points="10,34 60,68 110,34"/>
                </svg>
                <h4>No conversation selected</h4>
                <p>Pick a message from the list on the left to read it here. Use <kbd>j</kbd>/<kbd>k</kbd> to navigate between messages and <kbd>r</kbd> to reply.</p>
            </div>
            <div id="readWrap" style="display:none; flex-direction:column; flex:1; overflow:hidden;"></div>
        </section>

    </main>

    <!-- ===================== Compose modal ============================== -->
    <div class="email-modal-overlay" id="composeOverlay">
        <div class="email-modal">
            <div class="email-modal-header">
                <h3 id="composeTitle">New message</h3>
                <button class="email-modal-close" id="composeClose" title="Close (Esc)">&times;</button>
            </div>
            <div class="email-modal-body">
                <div class="email-compose-row">
                    <label>From</label>
                    <select class="from-select" id="composeFrom"></select>
                </div>
                <div class="email-compose-row">
                    <label>To</label>
                    <div class="chip-field" id="toChips">
                        <input class="chip-input" type="text" id="composeTo" placeholder="Recipients (press Enter or comma)">
                    </div>
                    <button class="cc-toggle" id="toggleCc">Cc/Bcc</button>
                </div>
                <div class="email-compose-row" id="composeCcRow" style="display:none;">
                    <label>Cc</label>
                    <div class="chip-field" id="ccChips">
                        <input class="chip-input" type="text" id="composeCc" placeholder="">
                    </div>
                </div>
                <div class="email-compose-row" id="composeBccRow" style="display:none;">
                    <label>Bcc</label>
                    <div class="chip-field" id="bccChips">
                        <input class="chip-input" type="text" id="composeBcc" placeholder="">
                    </div>
                </div>
                <div class="email-compose-row">
                    <label>Subject</label>
                    <input class="line-input" type="text" id="composeSubject" placeholder="Add a subject">
                </div>
                <div class="email-compose-chips" id="composeAttachChips"></div>
                <div class="email-compose-body-wrap">
                    <textarea id="composeBody" placeholder="Write your message…"></textarea>
                </div>
            </div>
            <div class="email-modal-footer">
                <div class="footer-left">
                    <input type="file" id="composeFile" multiple style="display:none;">
                    <button class="email-icon-btn" id="btnAttach" title="Attach file">
                        <svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                        Attach
                    </button>
                </div>
                <button class="email-send-btn" id="btnSend">
                    <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    Send
                </button>
            </div>
        </div>
    </div>

    <!-- ===================== New-folder modal =========================== -->
    <div class="email-modal-overlay" id="newFolderOverlay">
        <div class="email-modal" style="max-width: 460px;">
            <div class="email-modal-header">
                <h3>Create folder</h3>
                <button class="email-modal-close" id="newFolderClose" title="Close (Esc)">&times;</button>
            </div>
            <div class="email-modal-body">
                <p style="color: var(--text-secondary); font-size: 13px; margin: 0 0 16px;">
                    Folders live on your mail server. This will create the folder on IMAP and sync it here.
                </p>
                <div class="email-compose-row" style="flex-direction: column; align-items: stretch;">
                    <label style="margin-bottom: 6px;">Name</label>
                    <input type="text" class="form-control" id="newFolderName" placeholder="e.g. Projects, Invoices, Clients" autocomplete="off" style="width: 100%;">
                </div>
                <div class="email-compose-row" style="flex-direction: column; align-items: stretch; margin-top: 12px;">
                    <label style="margin-bottom: 6px;">Location</label>
                    <select class="form-control" id="newFolderParent" style="width: 100%;">
                        <option value="">No parent folder (top level)</option>
                    </select>
                </div>
                <div id="newFolderError" style="display:none; margin-top: 12px; color: var(--color-error, #ef4444); font-size: 13px;"></div>
            </div>
            <div class="email-modal-footer">
                <button class="btn-secondary" id="newFolderCancel">Cancel</button>
                <button class="btn-primary" id="newFolderCreate">Create folder</button>
            </div>
        </div>
    </div>

    <!-- SignalR for live inbox push -->
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.0/dist/browser/signalr.min.js"></script>

    <!-- Scripts -->
    <script>
        document.write('<script src="../../js/config.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/api.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/navigation.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/toast.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/email/inbox.js?v=' + CACHE_VERSION + '"><\/script>');
    </script>
</body>
</html>
