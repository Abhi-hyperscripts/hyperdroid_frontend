<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/js/cookie-consent.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>Mail settings - Ragenaizer</title>
    <script>window.CACHE_VERSION = Date.now();</script>
    <script>document.write('<script src="../../js/sw-version.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script src="/js/sw-update.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>document.write('<link rel="stylesheet" href="../../css/theme.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/styles.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/glassmorphic-modal.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/email.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<script src="../../js/theme.js?v=' + CACHE_VERSION + '"><\/script>');</script>
</head>
<body class="dashboard email-page">
    <script>document.write('<script src="/js/button-spinner.js?v=' + CACHE_VERSION + '"><\/script>');</script>

    <nav class="navbar">
        <div class="navbar-brand">
            <a href="../home.html">
                <img src="../../assets/brand_logo.png" alt="Ragenaizer Logo" class="navbar-logo">
            </a>
        </div>
        <div class="navbar-menu"></div>
    </nav>

    <main class="email-settings">
        <div class="email-settings-header">
            <div>
                <h1>Mailbox settings</h1>
                <p>Connect your IMAP/SMTP accounts so EmailService can sync mail and let you send.</p>
            </div>
            <button class="email-settings-add" id="btnAddMailbox">
                <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Add mailbox
            </button>
        </div>

        <div id="mailboxList">
            <div class="email-settings-empty">Loading…</div>
        </div>

        <p style="text-align:center; margin-top:28px;">
            <a href="inbox.html" style="color:var(--brand-primary); font-size:13.5px; font-weight:500;">← Back to inbox</a>
        </p>
    </main>

    <!-- Add/Edit mailbox modal -->
    <div class="email-modal-overlay" id="mailboxModal">
        <div class="email-modal" style="width:620px;">
            <div class="email-modal-header">
                <h3 id="mailboxModalTitle">Add IMAP/SMTP mailbox</h3>
                <button class="email-modal-close" id="mailboxModalClose">&times;</button>
            </div>
            <div class="email-modal-body">
                <div class="email-form-field">
                    <label for="mbxEmail">Email address</label>
                    <input type="email" id="mbxEmail" placeholder="you@company.com">
                </div>
                <div class="email-form-field">
                    <label for="mbxDisplay">Display name (optional)</label>
                    <input type="text" id="mbxDisplay" placeholder="Sales, Billing, etc.">
                </div>

                <div class="email-section-heading">Incoming (IMAP)</div>
                <div class="email-form-row">
                    <div class="email-form-field" style="flex:2;">
                        <label for="mbxImapHost">Server</label>
                        <input type="text" id="mbxImapHost" placeholder="imap.example.com">
                    </div>
                    <div class="email-form-field" style="max-width:100px;">
                        <label for="mbxImapPort">Port</label>
                        <input type="number" id="mbxImapPort" value="993">
                    </div>
                    <div class="email-form-field" style="max-width:110px;">
                        <label for="mbxImapSsl">SSL</label>
                        <select id="mbxImapSsl">
                            <option value="true" selected>Yes</option>
                            <option value="false">STARTTLS</option>
                        </select>
                    </div>
                </div>
                <div class="email-form-row">
                    <div class="email-form-field">
                        <label for="mbxImapUser">Username</label>
                        <input type="text" id="mbxImapUser" placeholder="(defaults to email)">
                    </div>
                    <div class="email-form-field">
                        <label for="mbxImapPass">Password</label>
                        <input type="password" id="mbxImapPass">
                    </div>
                </div>

                <div class="email-section-heading">Outgoing (SMTP)</div>
                <div class="email-form-row">
                    <div class="email-form-field" style="flex:2;">
                        <label for="mbxSmtpHost">Server</label>
                        <input type="text" id="mbxSmtpHost" placeholder="smtp.example.com">
                    </div>
                    <div class="email-form-field" style="max-width:100px;">
                        <label for="mbxSmtpPort">Port</label>
                        <input type="number" id="mbxSmtpPort" value="465">
                    </div>
                    <div class="email-form-field" style="max-width:110px;">
                        <label for="mbxSmtpSsl">SSL</label>
                        <select id="mbxSmtpSsl">
                            <option value="true" selected>Yes</option>
                            <option value="false">STARTTLS</option>
                        </select>
                    </div>
                </div>
                <div class="email-form-row">
                    <div class="email-form-field">
                        <label for="mbxSmtpUser">Username</label>
                        <input type="text" id="mbxSmtpUser" placeholder="(defaults to IMAP username)">
                    </div>
                    <div class="email-form-field">
                        <label for="mbxSmtpPass">Password</label>
                        <input type="password" id="mbxSmtpPass" placeholder="(same as IMAP if blank)">
                    </div>
                </div>

                <div id="mbxTestResult" style="font-size:13px; padding:8px 12px; border-radius:6px; margin-top:14px; display:none;"></div>
            </div>
            <div class="email-modal-footer">
                <div class="footer-left">
                    <button class="email-icon-btn" id="btnTestConnection">Test connection</button>
                </div>
                <button class="email-send-btn" id="btnSaveMailbox">Save</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        document.write('<script src="../../js/config.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/api.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/navigation.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/toast.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/email/settings.js?v=' + CACHE_VERSION + '"><\/script>');
    </script>
</body>
</html>
