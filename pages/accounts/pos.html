<head>

    <script>document.write('<link rel="stylesheet" href="../../css/glass-cards.css?v=' + CACHE_VERSION + '">');</script>
    <script>document.write('<link rel="stylesheet" href="../../css/searchable-dropdown.css?v=' + CACHE_VERSION + '">');</script>

</head>
<body class="dashboard acct-skin">
    <script>document.write('<script src="/js/button-spinner.js?v=' + CACHE_VERSION + '"><\/script>');</script>

    <nav class="navbar">
        <div class="navbar-brand">
            <a href="../home.html">
                <img src="../../assets/brand_logo.png" alt="Ragenaizer Logo" class="navbar-logo">
            </a>
        </div>
        <div class="navbar-menu"></div>
    </nav>

    <div class="accounts-container">
        <div class="hrms-header">
            <div class="header-content">
                <nav class="breadcrumb-nav">
                    <a href="dashboard.html">Accounts</a>
                    <span class="separator">/</span>
                    <span class="current">Cash Sale</span>
                </nav>
                <div class="hrms-header-row">
                    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle navigation menu">
                        <span class="hamburger-icon">
                            <span class="hamburger-line"></span>
                            <span class="hamburger-line"></span>
                            <span class="hamburger-line"></span>
                        </span>
                        <svg class="arrow-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 12H5"></path>
                            <path d="M12 19l-7-7 7-7"></path>
                        </svg>
                    </button>
                    <h1>Cash Sale (POS)</h1>
                    <span id="posNetBadge" style="display:none;margin-left:10px;padding:3px 10px;border-radius:999px;font-size:0.75rem;font-weight:700;cursor:default;"></span>
                </div>
                <div class="active-tab-title" id="activeTabTitle">
                    <span class="tab-indicator"></span>
                    <span id="activeTabName">Counter</span>
                </div>
            </div>
        </div>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <div class="organization-layout">
            <aside class="sidebar-nav-panel" id="accountsSidebar">
                <div class="sidebar-header"><h3>Cash Sale</h3></div>
                <nav class="sidebar-nav">
                    <div class="nav-group" data-group="pos">
                        <div class="nav-group-header"><span class="nav-group-title">POS</span><span class="chevron">&#9660;</span></div>
                        <div class="nav-group-items"><button class="sidebar-btn active" data-tab="pos-counter"><span class="nav-number">1</span><span class="nav-label">Counter</span></button></div>
                    </div>
                    <div class="nav-group" data-group="pos-tools">
                        <div class="nav-group-header"><span class="nav-group-title">Tools</span><span class="chevron">&#9660;</span></div>
                        <div class="nav-group-items"><button class="sidebar-btn" type="button" onclick="pairPhoneScanner(); document.getElementById('sidebarToggle')?.click();"><span class="nav-label">📱 Pair phone scanner</span></button></div>
                    </div>
                </nav>
            </aside>
            <main class="organization-content">
                <div class="tab-content active" id="pos-counter">
                    <div class="pos-layout">
                        <div class="pos-left">
                            <div class="pos-topbar">
                                <div class="pos-search-wrap">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                                    <input type="text" id="posSearch" placeholder="Scan barcode or search items… Enter adds first match">
                                    <button type="button" id="posCamBtn" class="pos-cam-btn" style="display:none;" onclick="startCameraScan()" aria-label="Scan with camera">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                                    </button>
                                </div>
                                <div class="pos-cat-filter">
                                    <div class="searchable-dropdown-container" id="posCats"></div>
                                </div>
                            </div>
                            <div id="posCamOverlay" class="pos-cam-overlay" style="display:none;" onclick="stopCameraScan()">
                                <video id="posCamVideo" autoplay playsinline muted></video>
                                <div class="pos-cam-hint">Point at the barcode — tap anywhere to cancel</div>
                            </div>
                            <div id="posGrid" class="pos-results"></div>
                        </div>
                        <aside class="pos-cart">
                            <div class="pos-cart-head">
                                <span>Current Sale</span>
                                <span class="pos-cart-count" id="posCartCount">0 items</span>
                            </div>
                            <div style="padding:8px 12px;border-bottom:1px solid var(--border-color);display:flex;align-items:center;gap:8px;">
                                <span style="font-size:11px;color:var(--text-secondary);flex-shrink:0;">Bill to</span>
                                <div class="searchable-dropdown-container" id="posCustomer" style="flex:1;min-width:0;" title="Walk-in by default. Pick a known customer to bill in their name — their price list (if any) reprices the cart."></div>
                            </div>
                            <div class="pos-cart-lines"><table><tbody id="posCart"></tbody></table></div>
                            <div class="pos-totals">
                                <div class="pos-trow"><span>Subtotal</span><span id="posSub">₹0.00</span></div>
                                <div class="pos-trow"><span>GST</span><span id="posTax">₹0.00</span></div>
                                <div class="pos-trow pos-grand"><span>Total</span><span id="posTotal">₹0.00</span></div>
                            </div>
                            <div class="pos-pay">
                                <div class="pos-pay-row">
                                    <div><label>Received into</label><div class="searchable-dropdown-container" id="posBank"></div></div>
                                    <div><label>Method</label><div class="searchable-dropdown-container" id="posMethod"></div></div>
                                </div>
                                <button class="pos-charge" id="posPayBtn" onclick="completeSale()">Charge ₹0.00</button>
                                <small id="posHint">One tap = invoice + GST + stock + payment + receipt, against the Walk-in Customer. Mixed GST slabs split automatically.</small>
                            </div>
                        </aside>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        document.write('<script src="../../js/config.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/rail-rbac.js?v=' + CACHE_VERSION + '"><\/script>');

        document.write('<script src="../../js/toast.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/tooltip.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/searchable-dropdown.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/auto-searchable-select.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/accounts/accounts-common.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.44.0/dist/apexcharts.min.js"><\/script>');
        document.write('<script src="../../js/accounts/accounts-charts.js?v=' + CACHE_VERSION + '"><\/script>');
        document.write('<script src="../../js/accounts/pos.js?v=' + CACHE_VERSION + '"><\/script>');
    </script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.0/dist/browser/signalr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
    <script>document.write('<script src="../../embed/widget.js?v=' + CACHE_VERSION + '" data-mode="copilot" data-service="accounts" data-title="Accounts Assistant"><\/script>');</script>
    <!-- The Accounts rail, ONE definition shared with the dashboard's fixed rail.
         Must load before rail-drawer.js, which reads the item list it publishes. -->
    <script>document.write('<script src="../../js/accounts/accounts-rail.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script>document.write('<script src="../../js/accounts/accounts-explore.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script>document.write('<script src="../../js/accounts/accounts-palette.js?v=' + CACHE_VERSION + '"><\/script>');</script>
    <script>document.write('<script src="../../js/rail-drawer.js?v=' + CACHE_VERSION + '"><\/script>');</script>
</body>
</html>
