<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 1200px; height: 630px; font-family: 'Inter', -apple-system, sans-serif; overflow: hidden; }
        .og-card {
            width: 1200px; height: 630px;
            background: linear-gradient(145deg, #0a0806 0%, #1a1208 35%, #12100a 65%, #0a0806 100%);
            position: relative; display: flex; align-items: center; overflow: hidden;
        }
        /* Gold glow effects */
        .glow-1 {
            position: absolute; width: 600px; height: 600px; top: -200px; right: 50px;
            background: radial-gradient(circle, rgba(234, 179, 8, 0.15) 0%, transparent 65%);
            filter: blur(40px);
        }
        .glow-2 {
            position: absolute; width: 400px; height: 400px; bottom: -100px; left: 100px;
            background: radial-gradient(circle, rgba(217, 119, 6, 0.12) 0%, transparent 65%);
            filter: blur(30px);
        }
        .glow-3 {
            position: absolute; width: 350px; height: 350px; top: 40%; right: 25%;
            background: radial-gradient(circle, rgba(250, 204, 21, 0.06) 0%, transparent 70%);
            filter: blur(60px);
        }
        .grid-pattern {
            position: absolute; inset: 0;
            background-image: linear-gradient(rgba(234, 179, 8, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(234, 179, 8, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        /* Decorative line */
        .accent-line {
            position: absolute; left: 70px; top: 55px; bottom: 55px; width: 3px;
            background: linear-gradient(180deg, transparent 0%, #eab308 30%, #d97706 70%, transparent 100%);
            border-radius: 2px; opacity: 0.5;
        }
        .left { position: relative; z-index: 10; padding: 60px 40px 60px 95px; flex: 1; }
        .right { position: relative; z-index: 10; width: 440px; padding-right: 55px; }
        .logo { margin-bottom: 28px; }
        .logo img { height: 36px; filter: brightness(0) invert(1); }
        .badge {
            display: inline-block; padding: 7px 16px;
            background: linear-gradient(135deg, rgba(234, 179, 8, 0.15) 0%, rgba(217, 119, 6, 0.15) 100%);
            border: 1px solid rgba(234, 179, 8, 0.35); border-radius: 100px;
            font-size: 11px; font-weight: 700; color: #fbbf24; text-transform: uppercase;
            letter-spacing: 0.15em; margin-bottom: 22px;
        }
        .title { font-size: 46px; font-weight: 800; color: #ffffff; line-height: 1.12; margin-bottom: 20px; letter-spacing: -0.02em; }
        .title .highlight {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #d97706 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .bullets { list-style: none; margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
        .bullets li {
            font-size: 15px; color: rgba(255,255,255,0.85); font-weight: 500;
            display: flex; align-items: center; gap: 10px;
        }
        .bullet-dot {
            width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
        }
        .bullet-dot.gold { background: #fbbf24; box-shadow: 0 0 8px rgba(251, 191, 36, 0.5); }
        .bullet-dot.amber { background: #f59e0b; box-shadow: 0 0 8px rgba(245, 158, 11, 0.5); }
        .bullets li .desc { color: rgba(255,255,255,0.45); font-weight: 400; }
        .subtitle { font-size: 17px; color: rgba(255,255,255,0.45); font-weight: 400; line-height: 1.5; }
        .subtitle strong { color: rgba(255,255,255,0.6); font-weight: 600; }
        /* Mini dashboard preview */
        .preview { display: flex; flex-direction: column; gap: 10px; }
        .preview-kpi-row { display: flex; gap: 8px; }
        .preview-kpi {
            flex: 1; background: rgba(234, 179, 8, 0.06); border: 1px solid rgba(234, 179, 8, 0.12);
            border-radius: 12px; padding: 16px 10px; text-align: center;
        }
        .preview-kpi-val { font-size: 24px; font-weight: 800; margin-bottom: 3px; }
        .preview-kpi:nth-child(1) .preview-kpi-val { color: #fbbf24; }
        .preview-kpi:nth-child(2) .preview-kpi-val { color: #f59e0b; }
        .preview-kpi:nth-child(3) .preview-kpi-val { color: #fbbf24; }
        .preview-kpi-label { font-size: 9px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; }
        .preview-chart {
            background: rgba(234, 179, 8, 0.06); border: 1px solid rgba(234, 179, 8, 0.12);
            border-radius: 12px; padding: 16px 18px; height: 155px; position: relative; overflow: hidden;
        }
        .preview-chart-title { font-size: 10px; color: rgba(255,255,255,0.4); text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.08em; font-weight: 600; }
        .bars { display: flex; align-items: flex-end; gap: 7px; height: 105px; }
        .bar { flex: 1; border-radius: 5px 5px 0 0; }
        .bar:nth-child(1) { height: 85%; background: linear-gradient(180deg, #fbbf24, #b45309); }
        .bar:nth-child(2) { height: 60%; background: linear-gradient(180deg, #f59e0b, #92400e); }
        .bar:nth-child(3) { height: 92%; background: linear-gradient(180deg, #fbbf24, #b45309); }
        .bar:nth-child(4) { height: 42%; background: linear-gradient(180deg, #f59e0b, #92400e); }
        .bar:nth-child(5) { height: 72%; background: linear-gradient(180deg, #fbbf24, #b45309); }
        .bar:nth-child(6) { height: 50%; background: linear-gradient(180deg, #f59e0b, #92400e); }
        .bar:nth-child(7) { height: 78%; background: linear-gradient(180deg, #fbbf24, #b45309); }
        /* Bottom border accent */
        .bottom-accent {
            position: absolute; bottom: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, transparent 0%, #eab308 30%, #d97706 70%, transparent 100%);
            opacity: 0.5;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="og-card">
        <div class="grid-pattern"></div>
        <div class="glow-1"></div>
        <div class="glow-2"></div>
        <div class="glow-3"></div>
        <div class="accent-line"></div>
        <div class="bottom-accent"></div>
        <div class="left">
            <div class="logo"><img src="brand_logo.png" alt="Ragenaizer"></div>
            <div class="badge">AI Research</div>
            <h1 class="title">Research <span class="highlight">Dashboard</span></h1>
            <ul class="bullets">
                <li><span class="bullet-dot gold"></span>Primary Research <span class="desc">&mdash; Survey data analysis</span></li>
                <li><span class="bullet-dot amber"></span>Secondary Research <span class="desc">&mdash; AI internet research</span></li>
                <li><span class="bullet-dot gold"></span>Embedded Chatbot <span class="desc">&mdash; AI chat widget for dashboards</span></li>
            </ul>
            <p class="subtitle"><strong>Executive-grade analysis</strong> powered by<br>agentic AI &middot; Interactive charts</p>
        </div>
        <div class="right">
            <div class="preview">
                <div class="preview-kpi-row">
                    <div class="preview-kpi"><div class="preview-kpi-val">78%</div><div class="preview-kpi-label">CSAT</div></div>
                    <div class="preview-kpi"><div class="preview-kpi-val">62%</div><div class="preview-kpi-label">NPS</div></div>
                    <div class="preview-kpi"><div class="preview-kpi-val">8.4</div><div class="preview-kpi-label">Intent</div></div>
                </div>
                <div class="preview-chart">
                    <div class="preview-chart-title">Key Metrics Analysis</div>
                    <div class="bars"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
