<!DOCTYPE html>
<html lang="en-IN">
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 1200px; height: 630px; font-family: 'Inter', -apple-system, sans-serif; overflow: hidden; background: #050810; }
        .og-card {
            width: 1200px; height: 630px;
            background: linear-gradient(135deg, #050810 0%, #0b1030 55%, #050810 100%);
            position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .og-card::before {
            content: ''; position: absolute; width: 900px; height: 900px; top: -320px; left: -260px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.45) 0%, transparent 60%);
        }
        .og-card::after {
            content: ''; position: absolute; width: 700px; height: 700px; bottom: -260px; right: -160px;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.35) 0%, rgba(45, 212, 191, 0.10) 40%, transparent 65%);
        }
        .grid-pattern {
            position: absolute; inset: 0;
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px; opacity: 0.5;
        }
        .wave { position: absolute; left: 0; right: 0; bottom: 0; height: 240px; opacity: .9; }
        .content { position: relative; z-index: 10; text-align: center; padding: 60px; }
        .logo { margin-bottom: 30px; display: flex; align-items: center; justify-content: center; }
        .logo img { height: 50px; width: auto; filter: brightness(0) invert(1); }
        .badge {
            display: inline-block; padding: 10px 24px; background: rgba(129, 140, 248, 0.18);
            border: 1px solid rgba(129, 140, 248, 0.45); border-radius: 100px;
            font-size: 14px; font-weight: 600; color: #a5b4fc; text-transform: uppercase;
            letter-spacing: 0.12em; margin-bottom: 28px;
        }
        .title { font-size: 66px; font-weight: 800; color: #ffffff; line-height: 1.08; margin-bottom: 20px; letter-spacing: -0.02em; }
        .title .highlight {
            background: linear-gradient(135deg, #818CF8 0%, #2DD4BF 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .subtitle { font-size: 25px; color: rgba(255,255,255,0.72); font-weight: 500; }
        .features { display: flex; justify-content: center; gap: 32px; margin-top: 36px; }
        .feature { display: flex; align-items: center; gap: 8px; color: rgba(255,255,255,0.62); font-size: 16px; }
        .dot { width: 8px; height: 8px; background: #818CF8; border-radius: 50%; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="og-card">
        <div class="grid-pattern"></div>
        <svg class="wave" viewBox="0 0 1200 240" preserveAspectRatio="none" aria-hidden="true">
            <defs><linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6366F1" stop-opacity=".45"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></linearGradient></defs>
            <path d="M0,190 C90,182 140,120 220,118 C300,116 340,170 420,166 C500,162 540,96 620,92 C700,88 740,150 820,146 C900,142 940,78 1020,74 C1100,70 1150,110 1200,100 L1200,240 L0,240 Z" fill="url(#w)"/>
            <path d="M0,190 C90,182 140,120 220,118 C300,116 340,170 420,166 C500,162 540,96 620,92 C700,88 740,150 820,146 C900,142 940,78 1020,74 C1100,70 1150,110 1200,100" fill="none" stroke="#818CF8" stroke-width="3" stroke-linecap="round" opacity=".85"/>
            <path d="M0,214 C100,208 150,186 240,184 C330,182 380,206 470,202 C560,198 610,170 700,168 C790,166 840,196 930,192 C1020,188 1070,160 1200,150" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" opacity=".45"/>
        </svg>
        <div class="content">
            <div class="logo"><img src="brand_logo.png" alt="Ragenaizer"></div>
            <div class="badge">Client Portal</div>
            <h1 class="title">Your account,<br><span class="highlight">always in reach</span></h1>
            <p class="subtitle">Invoices, quotations, receipts and a live statement — from your supplier's ledger</p>
            <div class="features">
                <div class="feature"><span class="dot"></span>Tax invoices as PDF</div>
                <div class="feature"><span class="dot"></span>Statement that reconciles</div>
                <div class="feature"><span class="dot"></span>Pay online</div>
                <div class="feature"><span class="dot"></span>No sign-up</div>
            </div>
        </div>
    </div>
</body>
</html>
